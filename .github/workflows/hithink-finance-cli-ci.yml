name: hithink-finance-cli CI
on:
  pull_request:
    paths:
      [
        "hithink-finance-cli/**",
        ".github/workflows/hithink-finance-cli-ci.yml",
        ".github/workflows/hithink-finance-cli-release.yml",
      ]
  push:
    branches: ["**"]
    paths:
      [
        "hithink-finance-cli/**",
        ".github/workflows/hithink-finance-cli-ci.yml",
        ".github/workflows/hithink-finance-cli-release.yml",
      ]
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to verify on Node 22 and 24
        type: choice
        default: all
        options: [all, windows, linux, macos]
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hithink-finance-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hithink-finance-cli/npm-shrinkwrap.json
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm pack --dry-run --ignore-scripts
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
      - run: node scripts/check-license.mjs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Pack and verify the release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run verify:release-package -- "$RUNNER_TEMP/hithink-finance-release"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: hithink-finance-cli-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hithink-finance-release/
          if-no-files-found: error
          retention-days: 14
  select-platforms:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - id: select
        env:
          CI_PLATFORM: ${{ inputs.platform }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const targets = [
            { os: 'windows-latest', arch: 'x64' },
            { os: 'ubuntu-latest', arch: 'x64' },
            { os: 'ubuntu-24.04-arm', arch: 'arm64' },
            { os: 'macos-15-intel', arch: 'x64' },
            { os: 'macos-15', arch: 'arm64' },
          ];
          const prefixes = { windows: 'windows-', linux: 'ubuntu-', macos: 'macos-' };
          const scope = process.env.CI_PLATFORM;
          if (scope !== 'all' && !Object.hasOwn(prefixes, scope)) throw Error('Unknown platform scope.');
          const selected = scope === 'all' ? targets : targets.filter(t => t.os.startsWith(prefixes[scope]));
          appendFileSync(process.env.GITHUB_OUTPUT, 'targets=' + JSON.stringify(selected) + '\n');
          NODE
  platform-verify:
    if: github.event_name == 'workflow_dispatch'
    needs: select-platforms
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select-platforms.outputs.targets) }}
        node: [22, 24]
    runs-on: ${{ matrix.target.os }}
    defaults:
      run:
        working-directory: hithink-finance-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.target.arch }}
          cache: npm
          cache-dependency-path: hithink-finance-cli/npm-shrinkwrap.json
      - run: npm ci --ignore-scripts
      - run: node -e "if (process.arch !== '${{ matrix.target.arch }}') process.exit(1)"
      - run: npm run verify
      - run: npm pack --dry-run --ignore-scripts
