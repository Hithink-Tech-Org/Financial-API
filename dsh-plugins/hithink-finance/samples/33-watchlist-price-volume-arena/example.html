<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>自选股价量擂台 · 金融观察室</title><style>/* Original visual styles: 自选股擂台; financial-data scripts are not included. */

  /* 颜色/字号/圆角全部取 Lumi 主题 token；括号里的字面量只是脱离客户端单独打开时的兜底，客户端内不会生效 */
  .g {
    --c-bg: var(--widget-bg, #11151b); --c-surface: var(--widget-surface, #1a2029); --c-hover: var(--widget-surface-hover, #232b36);
    --c-text: var(--widget-text, #e9edf2); --c-dim: var(--widget-text-secondary, #a7b0bd); --c-mute: var(--widget-text-muted, #717c8a);
    --c-border: var(--widget-border, #2b3441); --c-border-2: var(--widget-border-subtle, #222a35); --c-accent: var(--widget-accent, #4c8dff);
    --c-gain: var(--widget-gain, #f04b46); --c-loss: var(--widget-loss, #1fb573); --c-warn: var(--widget-warning, #f2b33d); --c-info: var(--widget-info, #49a8ff);
    --c-violet: var(--tag-6, var(--widget-accent, #8b7bff)); --c-leaf: var(--success-1, var(--widget-loss, #1fb573));
    --f-xs: var(--widget-font-size-xs, 10px); --f-sm: var(--widget-font-size-sm, 12px); --f-base: var(--widget-font-size-base, 14px);
    --f-lg: var(--widget-font-size-lg, 16px); --f-xl: var(--widget-font-size-xl, 20px); --f-2xl: var(--widget-font-size-2xl, 24px);
    --r-sm: var(--widget-radius-sm, 4px); --r-md: var(--widget-radius-md, 8px); --r-lg: var(--widget-radius-lg, 12px); --r-full: var(--widget-radius-full, 9999px);
    --sh: var(--widget-shadow-md, 0 6px 18px rgba(0, 0, 0, .28)); --sh-lg: var(--widget-shadow-lg, 0 14px 40px rgba(0, 0, 0, .4));
    --accent-dim: var(--widget-accent-dim, color-mix(in srgb, var(--c-accent) 16%, transparent));
    box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; min-height: 100vh;
    padding: var(--widget-space-md, 12px) var(--widget-space-lg, 16px) var(--widget-space-lg, 16px);
    background: var(--c-bg); color: var(--c-text); font-size: var(--f-base); line-height: 1.5;
    font-family: var(--widget-font-sans, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif);
  }
  html, body { margin: 0; min-height: 100%; background: var(--widget-bg, #11151b); }
  .g *, .g *::before, .g *::after { box-sizing: border-box; }
  .g button { font-family: inherit; color: inherit; }
  .g [hidden] { display: none !important; }
  .up { color: var(--c-gain); } .down { color: var(--c-loss); } .flat { color: var(--c-dim); }
  .num { font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  .sub { margin: 0; color: var(--c-dim); font-size: var(--f-sm); }
  /* 阵营色与稀有度色：只用主题里的语义色与标签色 */
  .f-fin { --fc: var(--c-info); } .f-con { --fc: var(--c-gain); } .f-tech { --fc: var(--c-violet); } .f-cyc { --fc: var(--c-warn); } .f-mfg { --fc: var(--c-leaf); }
  .r-N { --rc: var(--c-mute); } .r-R { --rc: var(--c-info); } .r-SR { --rc: var(--c-violet); } .r-SSR { --rc: var(--c-warn); }

  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-height: 36px; }
  /* 页面底：顶部聚光 + 极淡的网格，像一块场地而不是一张网页 */
  .g { background: radial-gradient(ellipse 70% 38% at 50% -8%, color-mix(in srgb, var(--c-accent) 18%, transparent), transparent 70%),
    repeating-linear-gradient(0deg, transparent 0 47px, color-mix(in srgb, var(--c-text) 3%, transparent) 47px 48px),
    repeating-linear-gradient(90deg, transparent 0 47px, color-mix(in srgb, var(--c-text) 3%, transparent) 47px 48px), var(--c-bg); }
  .top h1 { display: flex; align-items: center; gap: 10px; margin: 0; font-size: var(--f-2xl); font-weight: 800; letter-spacing: 4px;
    background: linear-gradient(180deg, var(--c-text) 35%, color-mix(in srgb, var(--c-warn) 70%, var(--c-text))); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo { position: relative; flex: none; width: 30px; height: 30px; border-radius: 8px; transform: rotate(45deg) scale(.82);
    background: linear-gradient(135deg, var(--c-gain), color-mix(in srgb, var(--c-gain) 55%, var(--c-warn))); box-shadow: 0 0 0 2px var(--c-surface), 0 0 0 4px var(--c-warn), 0 0 16px color-mix(in srgb, var(--c-gain) 60%, transparent); }
  .logo::after { content: ""; position: absolute; inset: 7px; border-radius: 3px; background: var(--c-surface); opacity: .9; }
  /* 客户端「页面」预览在右上角叠了一个 36px 的悬浮按钮，右上角控件向左让出这块位置 */
  .tools { display: flex; align-items: center; gap: 6px; margin-left: auto; margin-right: 38px; }
  /* 全局按钮：有厚度的游戏按钮，按下去会沉 */
  .btn { --bb: var(--c-surface); position: relative; padding: 7px 16px; border: 0; border-radius: 10px; font-size: var(--f-base); font-weight: 600; cursor: pointer;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c-text) 9%, var(--bb)), var(--bb));
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--c-text) 14%, var(--c-border)) inset, 0 3px 0 color-mix(in srgb, var(--c-bg) 55%, var(--c-border)), 0 5px 12px color-mix(in srgb, var(--c-bg) 50%, transparent);
    transition: transform .08s, box-shadow .08s, filter .15s, opacity .15s; }
  .btn:hover:not(:disabled) { filter: brightness(1.12); }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c-text) 14%, var(--c-border)) inset, 0 0 0 transparent; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { --bb: var(--c-accent); color: var(--c-surface);
    background: linear-gradient(180deg, color-mix(in srgb, var(--c-accent) 72%, var(--c-text)), var(--c-accent));
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--c-text) 30%, var(--c-accent)) inset, 0 3px 0 color-mix(in srgb, var(--c-accent) 52%, var(--c-bg)), 0 6px 14px color-mix(in srgb, var(--c-accent) 30%, transparent); }
  .btn.sm { padding: 5px 12px; border-radius: 9px; font-size: var(--f-sm); }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: var(--r-full); font-size: var(--f-sm); line-height: 20px;
    background: color-mix(in srgb, var(--c-gain) 14%, transparent); color: var(--c-gain); }
  .badge.sim { background: color-mix(in srgb, var(--c-warn) 16%, transparent); color: var(--c-warn); }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .fresh { color: var(--c-mute); font-size: var(--f-sm); }
  h3 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 2px 0 8px; font-size: var(--f-base); font-weight: 600; }
  h3 small { color: var(--c-mute); font-size: var(--f-sm); font-weight: 400; }

  /* ------------------------------------------------------------ 收藏卡 */
  .tc { --w: 148px; position: relative; flex: none; width: var(--w); aspect-ratio: 5 / 7; padding: 3px; border-radius: 12px; cursor: pointer; user-select: none;
    background: linear-gradient(145deg, color-mix(in srgb, var(--rc) 85%, var(--c-text)), var(--rc) 38%, color-mix(in srgb, var(--rc) 50%, var(--c-bg)) 70%, var(--rc));
    box-shadow: 0 3px 10px color-mix(in srgb, var(--c-bg) 60%, transparent); transition: transform .18s ease, box-shadow .18s ease, filter .18s; }
  .tc:hover { transform: translateY(-6px) rotate(-1deg); box-shadow: var(--sh-lg); z-index: 2; }
  .tc.r-SSR::after, .tc.r-SR::after { content: ""; position: absolute; inset: 0; border-radius: 12px; pointer-events: none; mix-blend-mode: overlay;
    background: linear-gradient(115deg, transparent 30%, color-mix(in srgb, var(--c-text) 55%, transparent) 46%, transparent 60%); background-size: 260% 100%; animation: sheen 3.6s linear infinite; }
  @keyframes sheen { from { background-position: 130% 0; } to { background-position: -130% 0; } }
  .tc-in { position: relative; display: flex; flex-direction: column; height: 100%; overflow: hidden; border-radius: 9px; background: linear-gradient(180deg, var(--c-surface), color-mix(in srgb, var(--fc) 10%, var(--c-surface))); }
  .tc-top { display: flex; align-items: center; gap: 4px; padding: 4px 6px 3px; }
  .tc-rar { flex: none; padding: 0 4px; border-radius: 3px; background: var(--rc); color: var(--c-bg); font-size: var(--f-xs); font-weight: 800; line-height: 14px; letter-spacing: .5px; }
  .tc-name { flex: 1; min-width: 0; overflow: hidden; font-size: var(--f-sm); font-weight: 700; white-space: nowrap; text-overflow: ellipsis; }
  .tc-pow { flex: none; color: var(--rc); font-size: var(--f-sm); font-weight: 800; }
  .tc-art { position: relative; flex: 1; min-height: 0; margin: 0 5px; overflow: hidden; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--fc) 50%, var(--c-border)); }
  .tc-art img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .tc-fac { position: absolute; left: 4px; bottom: 4px; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--fc); color: var(--c-bg); font-size: var(--f-sm); font-weight: 800; box-shadow: 0 0 0 2px var(--c-surface); }
  .tc-pct { position: absolute; right: 4px; bottom: 4px; padding: 0 5px; border-radius: 3px; background: color-mix(in srgb, var(--c-bg) 78%, transparent); font-size: var(--f-xs); font-weight: 700; line-height: 16px; }
  .tc-no { position: absolute; top: 4px; right: 4px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--c-accent); color: var(--c-surface); font-size: var(--f-sm); font-weight: 800; box-shadow: 0 0 0 2px var(--c-surface); }
  .tc-type { padding: 3px 6px 0; overflow: hidden; color: var(--c-dim); font-size: var(--f-xs); white-space: nowrap; text-overflow: ellipsis; }
  .tc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px 5px 0; }
  .tc-stats span { display: flex; align-items: center; justify-content: center; gap: 2px; padding: 1px 0; border-radius: 4px; background: var(--c-bg); font-size: var(--f-sm); font-weight: 800; }
  .tc-stats svg { width: 11px; height: 11px; flex: none; }
  .s-atk { color: var(--c-gain); } .s-hp { color: var(--c-leaf); } .s-def { color: var(--c-info); }
  .tc-src { padding: 2px 6px 0; overflow: hidden; color: var(--c-mute); font-size: var(--f-xs); white-space: nowrap; text-overflow: ellipsis; }
  .tc-tags { display: flex; gap: 3px; padding: 2px 5px 5px; font-size: var(--f-xs); white-space: nowrap; overflow: hidden; }
  .tc-tags b { padding: 0 4px; border-radius: 3px; font-weight: 600; line-height: 15px; }
  .t-good { background: color-mix(in srgb, var(--c-info) 18%, transparent); color: var(--c-info); }
  .t-bad { background: color-mix(in srgb, var(--c-warn) 18%, transparent); color: var(--c-warn); }
  .tc.on { transform: translateY(-8px); box-shadow: 0 0 0 2px var(--c-accent), var(--sh-lg); }
  .tc.dead { filter: grayscale(1) brightness(.6); cursor: not-allowed; }
  .tc.dead:hover { transform: none; }
  .tc-hp { margin: 3px 6px 0; }
  .tc-hp i { display: block; height: 6px; overflow: hidden; border-radius: 3px; background: var(--c-border); }
  .tc-hp i b { display: block; height: 100%; border-radius: 3px; background: var(--c-leaf); transition: width .4s ease .45s; }
  .tc-hp span { display: block; color: var(--c-dim); font-size: var(--f-xs); text-align: right; line-height: 1.3; }
  .tc.big { --w: 214px; cursor: default; }
  .tc.big:hover { transform: none; box-shadow: 0 3px 10px color-mix(in srgb, var(--c-bg) 60%, transparent); }
  .tc.big .tc-name { font-size: var(--f-base); } .tc.big .tc-stats span { font-size: var(--f-base); padding: 3px 0; } .tc.big .tc-stats svg { width: 13px; height: 13px; }
  .tc.big .tc-type, .tc.big .tc-src, .tc.big .tc-tags { font-size: var(--f-sm); }

  /* ------------------------------------------------------------ 首页 */
  /* 通用游戏面板：内描边 + 四角的小折角 */
  .frame { position: relative; border-radius: 16px; background: linear-gradient(180deg, color-mix(in srgb, var(--c-text) 4%, var(--c-surface)), var(--c-surface));
    box-shadow: 0 0 0 1px var(--c-border) inset, 0 0 0 4px color-mix(in srgb, var(--c-bg) 60%, transparent) inset, 0 8px 22px color-mix(in srgb, var(--c-bg) 55%, transparent); }
  .frame::before, .frame::after { content: ""; position: absolute; width: 16px; height: 16px; border: 2px solid var(--fx, var(--c-accent)); pointer-events: none; opacity: .8; }
  .frame::before { top: 6px; left: 6px; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
  .frame::after { bottom: 6px; right: 6px; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
  .stars { color: var(--c-warn); font-size: var(--f-sm); letter-spacing: 1px; }
  .stars i { color: var(--c-border); font-style: normal; }
  .stars.big { font-size: 34px; letter-spacing: 8px; }
  /* 擂台之路：六个擂主徽章连成一条路 */
  .road { padding: 12px 18px 14px; }
  .road-title { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .road-title b { font-size: var(--f-lg); font-weight: 800; letter-spacing: 3px; }
  .road-title span { color: var(--c-mute); font-size: var(--f-sm); }
  .road-title .prog { padding: 1px 10px; border-radius: var(--r-full); background: color-mix(in srgb, var(--c-warn) 16%, transparent); color: var(--c-warn); font-weight: 700; }
  .track { position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .track::before { content: ""; position: absolute; top: 37px; left: 8.33%; right: 8.33%; height: 6px; border-radius: 3px;
    background: repeating-linear-gradient(90deg, var(--c-border) 0 10px, transparent 10px 18px); }
  .node { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0; border: 0; background: none; cursor: pointer; }
  .ringimg { position: relative; display: grid; place-items: center; width: 78px; height: 78px; transition: transform .2s; }
  .ringimg img { width: 62px; height: 62px; border-radius: 50%; background: var(--c-bg); box-shadow: 0 0 0 3px var(--c-surface), 0 0 0 6px var(--c-border), 0 6px 14px color-mix(in srgb, var(--c-bg) 60%, transparent); transition: box-shadow .2s, filter .2s; filter: saturate(.75) brightness(.9); }
  .node.done .ringimg img { box-shadow: 0 0 0 3px var(--c-surface), 0 0 0 6px var(--c-warn), 0 6px 14px color-mix(in srgb, var(--c-bg) 60%, transparent); filter: none; }
  .node:hover .ringimg { transform: translateY(-3px) scale(1.05); }
  .node.on .ringimg { transform: scale(1.14); }
  .node.on .ringimg img { filter: none; box-shadow: 0 0 0 3px var(--c-surface), 0 0 0 6px var(--c-accent), 0 0 26px 6px color-mix(in srgb, var(--c-accent) 55%, transparent); }
  .node.on .ringimg::after { content: ""; position: absolute; inset: 1px; border-radius: 50%; border: 2px solid var(--c-accent); animation: ringPulse 1.6s ease-out infinite; }
  @keyframes ringPulse { from { opacity: .9; transform: scale(.9); } to { opacity: 0; transform: scale(1.35); } }
  .node small { color: var(--c-mute); font-size: var(--f-xs); letter-spacing: 1px; }
  .node b { font-weight: 800; }
  .node.on b { color: var(--c-accent); }
  /* 擂主情报：头像 + 铭牌 + 绝招徽章 + 克制思路 */
  .dossier { --fx: var(--c-warn); display: flex; align-items: center; gap: 16px; padding: 14px 20px; margin: 12px 0 14px; }
  .dossier-face { flex: none; width: 92px; height: 92px; border-radius: 50%; background: var(--c-bg); box-shadow: 0 0 0 3px var(--c-surface), 0 0 0 6px var(--c-loss), 0 0 24px color-mix(in srgb, var(--c-loss) 35%, transparent); animation: floaty 2.8s ease-in-out infinite; }
  .dossier-main { flex: 1; min-width: 0; }
  .plate { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .ribbon { padding: 1px 12px 1px 10px; background: var(--c-loss); color: var(--c-bg); font-size: var(--f-sm); font-weight: 800; letter-spacing: 1px; clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 50%, 100% 100%, 0 100%); }
  .plate b { font-size: var(--f-xl); font-weight: 800; letter-spacing: 2px; }
  .hpchip { display: inline-flex; align-items: center; gap: 3px; padding: 0 8px; border-radius: var(--r-full); background: var(--c-bg); color: var(--c-leaf); font-size: var(--f-sm); font-weight: 700; }
  .hpchip svg { width: 11px; height: 11px; }
  .move { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0 4px; }
  .move em { padding: 0 8px; border-radius: 4px; background: var(--c-warn); color: var(--c-bg); font-size: var(--f-xs); font-style: normal; font-weight: 800; line-height: 18px; }
  .move b { color: var(--c-warn); font-size: var(--f-lg); }
  .move span { color: var(--c-dim); font-size: var(--f-sm); }
  .dossier p { margin: 0; color: var(--c-dim); font-size: var(--f-sm); line-height: 1.65; }
  .counter { flex: none; width: 190px; padding: 10px 12px; border-radius: 12px; background: var(--c-bg); box-shadow: 0 0 0 1px var(--c-border-2) inset; text-align: center; }
  .counter small { display: block; color: var(--c-mute); font-size: var(--f-xs); letter-spacing: 2px; }
  .counter b { display: block; margin: 2px 0; color: var(--c-info); font-weight: 800; }
  .counter span { color: var(--c-dim); font-size: var(--f-sm); }
  /* 卡册栏：标题徽记 + 阵营页签 + 排序拨片 */
  .deckbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .deck-title { display: flex; align-items: center; gap: 8px; }
  .deck-title b { font-size: var(--f-lg); font-weight: 800; letter-spacing: 3px; }
  .deck-title .count { padding: 0 9px; border-radius: var(--r-full); background: var(--c-accent); color: var(--c-surface); font-size: var(--f-sm); font-weight: 800; line-height: 20px; }
  .deck-title small { color: var(--c-mute); font-size: var(--f-sm); }
  .tabs, .seg { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--c-surface); box-shadow: 0 0 0 1px var(--c-border) inset; }
  .tab, .seg button { display: flex; align-items: center; gap: 5px; padding: 4px 11px; border: 0; border-radius: 9px; background: transparent; color: var(--c-dim); font-size: var(--f-sm); font-weight: 600; cursor: pointer; transition: background .15s, color .15s, transform .1s; }
  .tab:hover, .seg button:hover { color: var(--c-text); background: var(--c-hover); }
  .tab i { width: 9px; height: 9px; border-radius: 50%; background: var(--fc, var(--c-mute)); box-shadow: 0 0 6px var(--fc, transparent); }
  .tab em { font-style: normal; font-weight: 700; opacity: .6; }
  .tab.on, .seg button.on { color: var(--c-surface); background: linear-gradient(180deg, color-mix(in srgb, var(--c-accent) 75%, var(--c-text)), var(--c-accent)); box-shadow: 0 2px 0 color-mix(in srgb, var(--c-accent) 52%, var(--c-bg)); }
  .tab.on i { background: var(--c-surface); box-shadow: none; }
  .seg-label { color: var(--c-mute); font-size: var(--f-sm); }
  .deck { display: grid; grid-template-columns: repeat(auto-fill, 148px); gap: 14px 12px; justify-content: center; padding: 12px 0 124px; }
  /* 出战席：三张卡位 + 阵营羁绊 + 两个大按钮 */
  .tray { --fx: var(--c-accent); position: fixed; left: 16px; right: 16px; bottom: 12px; z-index: 3; display: flex; align-items: center; gap: 16px; padding: 12px 20px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c-text) 6%, var(--c-surface)), var(--c-surface)); backdrop-filter: blur(8px);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--c-accent) 40%, var(--c-border)) inset, 0 -6px 30px color-mix(in srgb, var(--c-bg) 80%, transparent), 0 10px 30px color-mix(in srgb, var(--c-bg) 70%, transparent); }
  .slots { display: flex; gap: 10px; }
  .slot { position: relative; display: grid; place-items: center; width: 58px; height: 80px; overflow: hidden; border-radius: 9px; color: var(--c-mute); font-size: var(--f-xl); font-weight: 300; cursor: pointer;
    background: var(--c-bg); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c-accent) 35%, var(--c-border)) inset; }
  .slot:not(.full) { animation: slotWait 1.8s ease-in-out infinite; }
  .slot:not(.full):nth-child(2) { animation-delay: .3s; } .slot:not(.full):nth-child(3) { animation-delay: .6s; }
  @keyframes slotWait { 50% { box-shadow: 0 0 0 2px var(--c-accent) inset, 0 0 14px color-mix(in srgb, var(--c-accent) 45%, transparent); color: var(--c-accent); } }
  .slot.full { box-shadow: 0 0 0 3px var(--rc), 0 4px 10px color-mix(in srgb, var(--c-bg) 60%, transparent); transition: transform .15s; }
  .slot.full:hover { transform: translateY(-3px); }
  .slot img { width: 100%; height: 100%; object-fit: cover; }

function schedule(){clearTimeout(refreshTimer);if(boot.mode!=='dynamic'||store.get('paused',false)||document.hidden)return;const now=new Date(),hour=Number(new Intl.DateTimeFormat('en',{timeZone:'Asia/Shanghai',hour:'2-digit',hour12:false}).format(now));const active=board.category==='商品与周期'||(hour>=9&&hour<16);const seconds=active?board.interval:Math.max(board.interval,300);refreshTimer=setTimeout(()=>refresh(false),seconds*1000*(.9+Math.random()*.2));}
async function refresh(manual=true){if(boot.mode==='static'){showDrawer('更新离线看板',`<p>静态页面保存的是一次真实取数快照。解压完整交付包，在包目录执行：</p><pre style="padding:18px;background:#eef3f8;white-space:pre-wrap">npm run refresh -- ${E(board.id)}</pre><p>命令会更新数据，并重新生成全部已保存看板的离线 HTML。也可以导入刷新后生成的 <code>data/latest.json</code>，当前页会立即重绘。</p><div class="controls" style="margin-top:18px">${button('import','导入数据包')}</div>`);return;}if(refreshing)return;refreshing=true;const el=document.querySelector('[data-action=refresh]');if(el){el.disabled=true;el.textContent='更新中…';}try{const res=await fetch('/api/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({board:board.id})});const next=await res.json();if(!res.ok)throw new Error(next.error||'更新失败');D=next;window.BOARD_DATA=D;if(store.get('watch',null)===null&&!S.watch.length)S.watch=D.watchCodes||[];render();if(manual)toast('数据检查完成，请核对各模块时点和来源状态');}catch(e){toast('更新失败，保留当前快照：'+e.message);}finally{refreshing=false;const el=document.querySelector('[data-action=refresh]');if(el){el.disabled=false;el.textContent='更新数据';}schedule();}}
function mountDrawing(){const canvas=document.getElementById('drawPad');if(!canvas)return;const ctx=canvas.getContext('2d');const draw=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);if(!S.pencil.length)return;ctx.strokeStyle='#77adff';ctx.lineWidth=4;ctx.lineJoin='round';ctx.beginPath();S.pencil.forEach((p,i)=>{const x=p[0]*canvas.width,y=(1-p[1])*canvas.height;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();};draw();let active=false;const point=e=>{const r=canvas.getBoundingClientRect();return[Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height))];};canvas.onpointerdown=e=>{active=true;S.pencil=[point(e)];canvas.setPointerCapture(e.pointerId);draw();};canvas.onpointermove=e=>{if(!active)return;const p=point(e);if(p[0]>S.pencil.at(-1)[0])S.pencil.push(p);draw();};canvas.onpointerup=()=>active=false;canvas.onpointercancel=()=>active=false;}
function findPattern(){if(S.pencil.length<3)return toast('请从左到右画线，或选择一条预设曲线');const ordered=S.pencil.slice().sort((a,b)=>a[0]-b[0]);const left=ordered[0][0],right=ordered.at(-1)[0];if(right-left<.1)return toast('画线横向范围太短');const target=Array.from({length:40},(_,i)=>{const x=left+(right-left)*i/39;let k=ordered.findIndex(p=>p[0]>=x);if(k<=0)return ordered[0][1];const [p,q]=[ordered[k-1],ordered[k]];return p[1]+(q[1]-p[1])*(x-p[0])/(q[0]-p[0]||1);});S.patternMatches=(D.patternCodes||[]).map(code=>{const a=history(code).slice(-S.patternWindow);return{code,corr:a.length>=S.patternWindow?F.pearson(target,F.sample(a.map(x=>x.close),40)):null};}).filter(x=>x.corr!==null).sort((a,b)=>b.corr-a.corr).slice(0,10);render();if(!S.patternMatches.length)toast('常数曲线或历史窗口不足，无法计算相关度');}
document.addEventListener('click',async event=>{const el=event.target.closest('[data-action],[data-code],[data-sector],[data-sort]');if(!el)return;if(el.tagName==='A')event.preventDefault();if(el.dataset.action){const action=el.dataset.action,value=el.dataset.value;switch(action){
 case'refresh':return refresh();case'pause':store.set('paused',!store.get('paused',false));render();schedule();return;
 case'close':return closeDrawer();case'csv':return exportCSV();case'import':document.getElementById('importData')?.click();return;
 case'export-html':location.href='/api/export?board='+board.id;return;
 case'native-select':S.nativeCode=value;break;case'native-area':S.nativeArea=value;break;case'native-tier':S.nativeTier=value;break;case'native-view':S.nativeView=value;break;case'native-topic':S.nativeTopic=value;break;case'native-plate':S.futuresPlate=S.futuresPlate===value?'全部':value;break;case'native-sources':S.nativeSources=!S.nativeSources;render();if(S.nativeSources){const el=document.querySelector('.nf-source-footer');el.querySelector('details').open=true;el.scrollIntoView({behavior:'smooth',block:'start'});}return;case'window':S.window=value;break;case'limit-tab':S.limitTab=value;break;case'abnormal-tab':S.abnormalTab=value;break;case'resonance':S.resonance=value;break;
 case'save-note':{const t=document.getElementById('noteText')?.value.trim();if(!t)return toast('先写下观察内容');const a=store.get('notes:'+value,[]);a.unshift({time:Date.now(),text:t});store.set('notes:'+value,a);store.set('draft:'+value,'');toast('笔记已保存到本机');break;}
 case'delete-note':{const [key,i]=value.split(':');const a=store.get('notes:'+key,[]);a.splice(Number(i),1);store.set('notes:'+key,a);break;}
 case'export-notes': {
  const notes = JSON.stringify(store.get('notes:'+value,[]),null,2);
  if (window.parent === window) download(value+'-notes.json',notes,'application/json');
  else showDrawer('复制笔记', `<textarea rows="12" style="width:100%" aria-label="笔记 JSON" readonly>${E(notes)}</textarea>`);
  return;
 }
 case'watch-remove':S.watch=S.watch.filter(c=>c!==value);store.set('watch',S.watch);break;
 case'watch-add':if(!S.watch.includes(value))S.watch.push(value);store.set('watch',S.watch);toast('已加入本地自选');return;
 case'watch-reset':S.watch=[...(D.watchCodes||[])];store.set('watch',S.watch);break;
 case'watch-up':{const i=S.watch.indexOf(value);if(i>0)[S.watch[i-1],S.watch[i]]=[S.watch[i],S.watch[i-1]];store.set('watch',S.watch);break;}
 case'watch-load':return openStock(value);
 case'watch-search':{const q=document.getElementById('watchSearch').value.trim();const rows=(D.symbols||D.stocks||[]).filter(x=>(x.name+x.thscode).toLowerCase().includes(q.toLowerCase())).slice(0,12);document.getElementById('watchResults').innerHTML=q?rows.map(x=>`<button data-action="watch-add-render" data-value="${x.thscode}">${E(x.name)} ${E(x.thscode)}　添加</button>`).join('')||'<p>未找到匹配的A股。</p>':'';return;}
 case'watch-add-render':if(!S.watch.includes(value))S.watch.push(value);store.set('watch',S.watch);break;
 case'pattern-clear':S.pencil=[];S.patternMatches=[];break;
 case'pattern-preset':S.pencil=value==='rise'?[[0,.1],[.25,.3],[.4,.22],[.7,.6],[1,.9]]:value==='v'?[[0,.9],[.5,.1],[1,.8]]:[[0,.25],[.3,.28],[.6,.23],[.75,.3],[1,.85]];break;
 case'pattern-search':return findPattern();
 case'arena-pick':if(S.arena.includes(value))S.arena=S.arena.filter(x=>x!==value);else if(S.arena.length<3)S.arena.push(value);else return toast('每队最多三张卡');break;
 case'arena-fight':{if(S.arena.length!==3)return;const cards=S.arena.map(stock).map(r=>({...r,...gameAttrs(r)}));const enemy=45+(S.round%5)*7,shield=18+(S.round%3)*6;const damage=cards.reduce((s,c)=>s+Math.max(0,c.attack-shield),0),loss=cards.reduce((s,c)=>s+Math.max(0,enemy-c.guard),0),remain=cards.reduce((s,c)=>s+c.energy,0)-loss;S.battle=`队伍造成 ${damage} 点虚拟伤害\n抵挡后受到 ${loss} 点伤害\n剩余虚拟能量 ${remain}\n${damage>=90&&remain>0?'本轮通过':'本轮未通过，可以重新组队'}。这不是金融风险测评。`;S.round++;break;}
 default:return;
 }render();return;}
 if(el.dataset.sort){const {sort:id,key}=el.dataset;const old=S.sort[id];S.sort[id]={key,dir:old?.key===key?-old.dir:-1};render();return;}
 if(el.dataset.sector){S.sector=el.dataset.sector;if(board.id==='sectors')render();else{const a=constituentRows(S.sector),sec=D.sectors?.find(x=>x.thscode===S.sector);showDrawer(sec?.name||S.sector,breadth(a).html+table(a,baseCols,'drawer-members'));}return;}
 if(el.dataset.code)openStock(el.dataset.code);
});
document.addEventListener('change',async e=>{const el=e.target,k=el.dataset.control;if(el.id==='importData'){const file=el.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(d.version!==1||!Array.isArray(d.sources)||!Number.isFinite(d.updatedAt))throw new Error('数据包格式不正确');D=d;window.BOARD_DATA=d;closeDrawer();render();toast('数据包已导入；此操作仅影响当前打开页面');}catch(e){toast(e.message);}return;}
 if(!k)return;switch(k){case'native-width':S.nativeWidth=Number(el.value);break;case'native-height':S.nativeHeight=Number(el.value);break;case'navigate':location.href=el.value+'.html';return;case'direction':S.direction=el.value;break;case'event-tag':S.eventTag=el.value;break;case'etf-min':S.etfMin=Number(el.value)||0;break;case'etf-window':S.etfWindow=el.value;break;case'etf-trend':S.etfTrend=el.checked;break;case'pattern-window':S.patternWindow=Number(el.value);S.patternMatches=[];break;case'structure-code':S.structure=el.value;break;case'future-plate':S.futuresPlate=el.value;break;default:return;}render();});
let inputTimer;document.addEventListener('input',e=>{const el=e.target;if(el.id==='noteText'){store.set('draft:'+board.id,el.value);return;}if(['sector-search','limit-search','event-search'].includes(el.dataset.control)){clearTimeout(inputTimer);const pos=el.selectionStart;inputTimer=setTimeout(()=>{S.search=el.value;render();const next=document.querySelector(`[data-control="${el.dataset.control}"]`);next?.focus();next?.setSelectionRange(pos,pos);},220);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if((e.key==='Enter'||e.key===' ')&&e.target.dataset.sort){e.preventDefault();e.target.click();}if(e.key==='Enter'&&e.target.id==='watchSearch')document.querySelector('[data-action=watch-search]')?.click();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(refreshTimer);else schedule();});
window.addEventListener('pagehide',()=>{clearTimeout(refreshTimer);destroyCharts();});
async function init(){if(!board)return;if(boot.mode==='dynamic'){try{const res=await fetch('/api/state?board='+board.id);if(!res.ok)throw new Error('无法读取本地数据包');D=await res.json();window.BOARD_DATA=D;if(store.get('watch',null)===null&&!S.watch.length)S.watch=D.watchCodes||[];}catch(e){document.getElementById('app').innerHTML=empty('无法打开动态看板',e.message+'；请在完整交付包运行 npm start。');return;}}render();schedule();const deepCode=new URLSearchParams(location.search).get('code');if(board.id==='watch'&&/^[0-9]{6}\.(SH|SZ|BJ)$/.test(deepCode||''))openStock(deepCode);}
init();
})();
</script></body></html>
