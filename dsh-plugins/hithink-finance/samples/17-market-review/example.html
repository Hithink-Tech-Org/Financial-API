<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>市场全景复盘 · 金融观察室</title><style>/* Original visual styles: 全市场看盘; financial-data scripts are not included. */

:root{
  --bg:var(--widget-bg,#0A0E17);
  --panel:var(--widget-card,#131A26);
  --panel-hi:var(--widget-card-hover,#1A2433);
  --line:var(--widget-border,#202B3C);
  --divider:var(--widget-divider,#1C2534);
  --up:var(--widget-gain,#F6465D);
  --down:var(--widget-loss,#0ECB81);
  --flat:var(--widget-text-muted,#8A94A6);
  --accent:var(--widget-accent-bright,#3B82F6);
  --warn:var(--widget-warning,#FF9F43);
  --gold:#F0B90B;
  --ink:var(--widget-text,#E8EEF8);
  --ink-2:var(--widget-text-secondary,#8A94A6);
  --ink-3:var(--widget-text-faint,#5C6675);
  --num:var(--widget-font-mono,"DIN Alternate","JetBrains Mono",Consolas,monospace);
  --zh:var(--widget-font-sans,"PingFang SC","Microsoft YaHei",sans-serif);
  --r:10px;--gap:12px;--pad:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--zh);font-size:13px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{height:100vh;display:flex;flex-direction:column;min-height:0}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.dim{color:var(--ink-2)}.dimmer{color:var(--ink-3)}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--widget-border-strong,#2B3A50);border-radius:3px}
.arw{display:inline-block;width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent;vertical-align:1px;margin-right:3px}
.arw.u{border-bottom:6px solid currentColor}
.arw.d{border-top:6px solid currentColor}

.hdr{height:50px;flex:0 0 50px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--divider);background:var(--panel)}
.hdr h1{font-size:15px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.hdr-sep{width:1px;height:15px;background:var(--line)}
.hdr-clock{font-size:12px;color:var(--ink-2);font-family:var(--num);white-space:nowrap;letter-spacing:.2px}
.hdr-session{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--up);white-space:nowrap}
.hdr-session i{width:6px;height:6px;border-radius:50%;background:currentColor}
.hdr-session.off{color:var(--ink-3)}
.hdr-session.au{color:var(--gold)}
.src-time{font-size:11.5px;color:var(--ink-3);font-family:var(--num);white-space:nowrap}
.ibtn{height:26px;padding:0 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel-hi);color:var(--ink-2);font-size:11.5px;display:inline-flex;align-items:center;gap:5px;transition:.15s;white-space:nowrap}
.ibtn:hover{color:var(--ink);border-color:var(--widget-border-strong,#31405A)}
.ibtn.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

.idxbar{height:112px;flex:0 0 112px;display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid var(--divider)}
.idx-scroll{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden}
.ix{flex:1 1 0;min-width:132px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s}
.ix:hover{background:var(--panel-hi)}
.ix-top{display:flex;align-items:baseline;gap:6px;min-width:0}
.ix-name{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ix-pct{font-family:var(--num);font-size:11.5px;font-weight:600;white-space:nowrap}
.ix-val{font-family:var(--num);font-size:clamp(15px,1.02vw,21px);font-weight:600;letter-spacing:-.3px;line-height:1.18;white-space:nowrap;border-radius:3px}
.ix-sub{display:flex;align-items:baseline;justify-content:space-between;gap:6px;font-size:10px;color:var(--ink-3);font-family:var(--num);white-space:nowrap}
.ix-sub .amt{overflow:hidden;text-overflow:ellipsis}
.ix-spark{height:22px;margin-top:2px;opacity:.95}
.turnover{flex:0 0 196px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.tv-lb{font-size:11px;color:var(--ink-3)}
.tv-val{font-family:var(--num);font-size:24px;font-weight:700;line-height:1.15}
.tv-val small{font-size:11.5px;font-weight:500;color:var(--ink-2);margin-left:3px}
.tv-sub{font-size:10.5px;color:var(--ink-2);font-family:var(--num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.work{flex:1;min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr) 396px;gap:var(--gap);padding:10px 14px}
.col{display:flex;flex-direction:column;gap:var(--gap);min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden;flex:0 0 auto}
.card-h{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex:0 0 auto}
.card-h h2{font-size:12.5px;font-weight:600;padding-left:8px;position:relative;white-space:nowrap}
.card-h h2::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:2px;background:var(--accent)}
.card-h .h-sub{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-h .sp{flex:1}
.card-body{flex:1;min-height:0}
.card-foot{flex:0 0 auto;margin-top:8px;padding-top:7px;border-top:1px solid var(--divider);font-size:10.5px;color:var(--ink-3)}
.card-foot b{color:var(--ink-2)}
.kpi-row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.kpi .k-lb{font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.kpi .k-v{font-family:var(--num);font-size:25px;font-weight:700;line-height:1.15}
.kpi .k-v small{font-size:11.5px;font-weight:500;color:var(--ink-2);margin-left:2px}

.bh-grid{display:flex;flex-direction:column;gap:5px}
.bh-line{display:flex;align-items:baseline;gap:6px;font-size:11.5px;color:var(--ink-2)}
.bh-line .v{font-family:var(--num);font-size:14px;color:var(--ink);font-weight:600}
.bh-line .sl{flex:1}
.ratio-bar{display:flex;height:9px;border-radius:2px;overflow:hidden;margin:9px 0 4px;background:color-mix(in srgb,var(--ink-3) 22%,transparent)}
.ratio-bar i{display:block;height:100%;transition:width .4s ease-out}
.ratio-lb{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);font-family:var(--num)}
.mkt-tbl{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.mkt-tbl th{font-weight:500;color:var(--ink-3);font-size:10px;text-align:right;padding:3px 4px;border-bottom:1px solid var(--divider);white-space:nowrap}
.mkt-tbl th:first-child{text-align:left}
.mkt-tbl td{padding:3px 4px;text-align:right;font-family:var(--num);border-bottom:1px solid color-mix(in srgb,var(--divider) 70%,transparent);white-space:nowrap}
.mkt-tbl td:first-child{text-align:left;font-family:var(--zh)}

.gauge-wrap{display:grid;grid-template-columns:124px 1fr;gap:10px;align-items:center}
.gauge-val{font-family:var(--num);font-size:11px;color:var(--ink-3);text-align:center;margin-top:-2px}
.gauge-legend{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:10px;color:var(--ink-3);margin-top:6px}
.gauge-legend i{display:inline-block;width:6px;height:6px;border-radius:1px;margin-right:3px}
.score-parts{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--ink-2)}
.score-parts .sp-row{display:flex;justify-content:space-between;gap:8px}
.score-parts .sp-row b{font-family:var(--num);color:var(--ink);font-weight:600}
.rule-text{font-size:11.5px;line-height:1.6;color:var(--ink-2);background:color-mix(in srgb,var(--accent) 7%,transparent);border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);border-radius:6px;padding:7px 9px;margin-top:8px}
.rule-text b{color:var(--ink)}
.mini-note{font-size:10px;color:var(--ink-3);margin-top:5px}

.tm-wrap{position:relative}
.tm-legend{position:absolute;right:4px;bottom:4px;display:flex;align-items:center;gap:4px;font-size:9px;color:var(--ink-3);background:color-mix(in srgb,var(--bg) 80%,transparent);border:1px solid var(--line);border-radius:4px;padding:2px 5px;pointer-events:none}
.tm-legend .sw{width:11px;height:7px;border-radius:1px}
.tm svg{display:block}
.tm text{pointer-events:none;font-family:var(--zh)}
.tm .cell{cursor:pointer}
.tm .cell.hover rect{stroke:var(--ink);stroke-width:2}

.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th{font-weight:500;color:var(--ink-3);font-size:10.5px;text-align:right;padding:5px 4px;border-bottom:1px solid var(--divider);position:sticky;top:0;background:var(--panel);white-space:nowrap;z-index:1}
.tbl th:first-child{text-align:left}
.tbl td{padding:3px 4px;text-align:right;font-family:var(--num);font-size:11.5px;border-bottom:1px solid color-mix(in srgb,var(--divider) 65%,transparent)}
.tbl td:first-child{text-align:left;font-family:var(--zh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:126px}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td,.tbl tbody tr.hover td{background:color-mix(in srgb,var(--gold) 10%,transparent)}
.tbl .tag{font-family:var(--zh);font-size:10px;padding:0 5px;border-radius:3px;line-height:16px;display:inline-block;white-space:nowrap}
.tag.strong{color:var(--up);background:color-mix(in srgb,var(--up) 14%,transparent)}
.tag.rebound{color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}
.tag.fade{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.tag.weak{color:var(--down);background:color-mix(in srgb,var(--down) 14%,transparent)}

.flow-rank{display:flex;flex-direction:column;gap:4px}
.fr{display:grid;grid-template-columns:74px 1fr 60px;align-items:center;gap:6px;font-size:11px;cursor:pointer;padding:1px 2px;border-radius:3px}
.fr:hover,.fr.hover{background:color-mix(in srgb,var(--gold) 10%,transparent)}
.fr .nm{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .bar{height:10px;position:relative;background:color-mix(in srgb,var(--ink-3) 14%,transparent);border-radius:1px;overflow:hidden}
.fr .bar i{position:absolute;top:0;bottom:0;left:0;border-radius:1px;transition:width .4s ease-out}
.fr .v{font-family:var(--num);font-size:11px;text-align:right}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:8px;padding:4px 2px;border-bottom:1px solid color-mix(in srgb,var(--divider) 60%,transparent);font-size:12px;cursor:pointer}
.row:hover{background:var(--panel-hi)}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .vl{font-family:var(--num);font-size:11.5px;width:58px;text-align:right}
.row .pc{font-family:var(--num);font-size:11.5px;width:58px;text-align:right;font-weight:600}
.row .tg{font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:3px;padding:0 4px;line-height:15px;white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:11px;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:1px 7px;line-height:17px;white-space:nowrap}
.chip:hover{color:var(--ink);border-color:var(--widget-border-strong,#33425A)}
.chip.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.card-tools{display:flex;gap:4px;flex-wrap:wrap}

.verdict{display:flex;flex-direction:column;gap:8px}
.vd{display:grid;grid-template-columns:34px 1fr;gap:8px;font-size:11.5px;line-height:1.6;color:var(--ink-2)}
.vd .k{font-size:10.5px;color:var(--ink-3);padding-top:1px}
.vd.state .k{color:var(--accent)}.vd.main .k{color:var(--gold)}.vd.fund .k{color:#A855F7}.vd.risk .k{color:var(--warn)}
.vd b{color:var(--ink);font-weight:600}

.status{height:34px;flex:0 0 34px;display:flex;align-items:center;gap:12px;padding:0 14px;border-top:1px solid var(--divider);background:var(--panel);font-size:11px;color:var(--ink-3)}
.status b{color:var(--ink-2);font-family:var(--num);font-weight:500}
.st-item{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.st-spacer{flex:1}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);display:inline-block}
.dot.ok{background:var(--down)}.dot.warn{background:var(--warn)}.dot.err{background:var(--up)}

.state-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:26px 10px;color:var(--ink-2);font-size:11.5px;text-align:center}
.btn-ghost{border:1px solid var(--line);border-radius:5px;padding:3px 10px;font-size:11px;color:var(--ink-2)}
.btn-ghost:hover{color:var(--ink);border-color:var(--widget-border-strong,#33425A)}
.empty-line{font-size:11px;color:var(--ink-3);padding:12px;text-align:center}

@keyframes flashUp{0%{background-color:rgba(246,70,93,.28)}100%{background-color:transparent}}
@keyframes flashDown{0%{background-color:rgba(14,203,129,.28)}100%{background-color:transparent}}
.flash-u{animation:flashUp .8s ease-out}
.flash-d{animation:flashDown .8s ease-out}
.card::after{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left;opacity:0}
.card.refreshing::after{opacity:1;animation:prog .55s ease-out forwards}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.toast{position:fixed;left:50%;bottom:48px;transform:translate(-50%,8px);background:var(--panel-hi);border:1px solid var(--widget-border-strong,#2B3A50);border-radius:6px;padding:7px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:95}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1460px){
  .work{grid-template-columns:302px minmax(0,1fr) 344px}
  .turnover{flex-basis:172px}
}
@media (max-height:980px){
  .idxbar{height:104px;flex-basis:104px;padding:8px 14px}
  .ix-val{font-size:clamp(14px,.92vw,19px)}
  .tv-val{font-size:21px}
}


/* ============================================================
   ACTIVE COLOR THEMES
   与 `src/renderer/theme/registry.ts` 中 `ThemeId` / `THEMES` 一致。
   默认 Zinc 基底 + registry.ts 注册的五套产品主题。
   ============================================================ */

:root {
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 8px;
  --radius-s: 6px;
  --radius-m: 8px;
  --radius-l: 12px;
  --motion-duration-fast: 0.12s;
  --motion-duration-base: 0.2s;
  --motion-duration-slow: 0.3s;
  --motion-duration-ripple: 0.6s;
  --motion-ease-enter: ease-out;
  --motion-ease-exit: ease-in;
  --motion-ease-move: ease-in-out;
  --motion-distance: 16px;
  --motion-scale-from: 0.9;
  --motion-opacity-from: 0;
  --gain: var(--red, #ef4444);
  --loss: var(--green, #22c55e);

  /* 未知或缺失宿主 data-theme 时，与 HostTheme 的 dark 回退一致。 */
  --bg: #111113;
  --surface: #1a1a1e;
  --border: #2c2c32;
  --border-hi: #42424c;
  --text: #f0f0f4;
  --text-dim: #92929e;
  --text-faint: #55555f;
  --accent: #6366f1;
  --accent-dim: #2e3073;
  --green: #22c55e;
  --red: #ef4444;
  --comment: #666672;

  /* 设计稿 Token 模块的未知主题深色回退。 */
  --text-1: var(--text);
  --text-2: color-mix(in srgb, var(--text) 92%, #ffffff);
  --text-3: var(--text-dim);
  --text-4: var(--text-faint);
  --text-5: color-mix(in srgb, var(--text-faint) 72%, var(--bg));
  --text-6: var(--accent);
  --text-7: color-mix(in srgb, var(--accent) 82%, var(--text));
  --border-1: var(--border);
  --border-2: color-mix(in srgb, var(--border) 65%, var(--surface));
  --border-3: var(--border-hi);
  --border-4: color-mix(in srgb, var(--border) 40%, transparent);
  --border-5: color-mix(in srgb, var(--bg) 90%, var(--text));
  --fill-1: var(--border-hi);
  --fill-2: var(--border);
  --fill-3: color-mix(in srgb, var(--surface) 65%, var(--bg));
  --fill-4: var(--surface);
  --fill-5: color-mix(in srgb, var(--surface) 50%, var(--text));
  --fill-6: color-mix(in srgb, var(--bg) 55%, #000000);
  --background-1: var(--bg);
  --background-2: var(--surface);
  --background-3: color-mix(in srgb, var(--surface) 88%, var(--text));
  --background-4: color-mix(in srgb, var(--bg) 78%, #000000);
  --background-5: color-mix(in srgb, var(--accent) 22%, var(--bg));
  --brand-1: var(--accent);
  --brand-2: color-mix(in srgb, var(--accent) 88%, #ffffff);
  --brand-3: color-mix(in srgb, var(--accent) 72%, #000000);
  --brand-4: color-mix(in srgb, var(--accent) 48%, var(--bg));
  --brand-5: color-mix(in srgb, var(--accent) 28%, var(--bg));
  --brand-6: var(--accent-dim);
  --rise-1: var(--red);
  --rise-2: color-mix(in srgb, var(--red) 88%, #ffffff);
  --rise-3: color-mix(in srgb, var(--red) 72%, #000000);
  --rise-4: color-mix(in srgb, var(--red) 35%, var(--bg));
  --rise-5: color-mix(in srgb, var(--red) 18%, var(--bg));
  --fall-1: var(--green);
  --fall-2: color-mix(in srgb, var(--green) 88%, #ffffff);
  --fall-3: color-mix(in srgb, var(--green) 72%, #000000);
  --fall-4: color-mix(in srgb, var(--green) 35%, var(--bg));
  --fall-5: color-mix(in srgb, var(--green) 18%, var(--bg));
  --equal-1: var(--text-dim);
  --success-1: color-mix(in srgb, var(--green) 55%, #36ddd8);
  --success-2: color-mix(in srgb, var(--green) 72%, #00c6d1);
  --success-3: color-mix(in srgb, var(--green) 58%, #00a9b2);
  --success-4: color-mix(in srgb, var(--green) 32%, var(--bg));
  --success-5: color-mix(in srgb, #36ddd8 25%, var(--bg));
  --warning-1: #f59e0b;
  --warning-2: #f6aa28;
  --warning-3: #b07208;
  --warning-4: color-mix(in srgb, #f59e0b 35%, var(--bg));
  --warning-5: color-mix(in srgb, #f59e0b 18%, var(--bg));
  --danger-1: var(--red);
  --danger-2: color-mix(in srgb, var(--red) 90%, #ffffff);
  --danger-3: color-mix(in srgb, var(--red) 75%, #000000);
  --danger-4: color-mix(in srgb, var(--red) 38%, var(--bg));
  --danger-5: color-mix(in srgb, var(--red) 20%, var(--bg));
  --link-1: var(--accent);
  --link-2: color-mix(in srgb, var(--accent) 90%, #ffffff);
  --link-3: color-mix(in srgb, var(--accent) 75%, #000000);
  --link-4: color-mix(in srgb, var(--accent) 45%, var(--bg));
  --link-5: color-mix(in srgb, var(--accent) 25%, var(--bg));

  --lumi-tag-red: color-mix(in srgb, var(--danger-3) 18%, transparent);
  --lumi-tag-blue: color-mix(in srgb, var(--brand-2) 12%, transparent);
  --lumi-tag-yellow: color-mix(in srgb, var(--warning-3) 15%, transparent);
  --lumi-input-bg: color-mix(in srgb, var(--fill-3) 40%, transparent);
  --lumi-input-bg-2: color-mix(in srgb, var(--fill-3) 70%, transparent);
  --lumi-hover: color-mix(in srgb, var(--text-2) 6%, transparent);
  --lumi-click: color-mix(in srgb, var(--text-2) 10%, transparent);
  --lumi-card-bg-1: color-mix(in srgb, var(--background-2) 60%, transparent);
  --lumi-card-bg-2: var(--background-2);
  --lumi-divider-1: color-mix(in srgb, var(--border-1) 80%, transparent);

/*
 * 融合侧栏 Figma [2458:4147]：直接用语义 token —— Background 3 → --background-3；
 * Fill 1|2 → --fill-1 / --fill-2；Text 2|3|4 → --text-2 / --text-3 / --text-4。
 *
 * 2026-07-20 起**不再有 --fusion-text-* / --fusion-bg-* / --fusion-fill-* 这层别名**：
 * 它只有融合壳吃得到，且曾把 ifind 的正文色错取成「主按钮白字」造成白底白字、
 * 把 aviator 辅助字错取成「不可用文本」档。皮肤差异一律由语义 token 在各主题块的取值表达
 * （见 renderer.md 样式铁律第 3 条与 OPEN-QUESTIONS Q26）。
 * 同时移除的还有 brush-* 中间层（31 个变量，全部只在本文件内部转接、组件从未直接消费）。
 */

     放在语义层后所有组件都取对色（见 renderer.md 样式铁律第 3 条）。 */
  --text-2: #eeeff0;
  --text-3: #b4b6b8;

  --text-4: #808286;

}

function noteWidget(key){const notes=store.get('notes:'+key,[]);return panel('我的观察',`<div class="note-box"><textarea id="noteText" placeholder="记下观察、待验证条件或复盘结论…">${E(store.get('draft:'+key,''))}</textarea><div class="controls" style="margin-top:10px">${button('save-note','保存笔记',key)}${button('export-notes','导出笔记',key)}</div><div class="note-list">${notes.length?notes.map((x,i)=>`<div class="note"><small>${date(x.time,true)}</small><button data-action="delete-note" data-value="${key}:${i}">删除</button><p>${E(x.text)}</p></div>`).join(''):'<small>笔记保存在当前浏览器，不上传。</small>'}</div></div>`,'本机保存');}
function futureRows(){return(D.futures||[]).filter(r=>S.futuresPlate==='全部'||r.plate===S.futuresPlate);}
function gameAttrs(r){return{attack:Math.round(20+Math.min(10,Math.abs(r.price_change_ratio_pct||0))*5),guard:Math.round(60-Math.min(20,r.amplitude||0)*2),energy:Math.round(30+Math.min(70,Math.log10(Math.max(1,r.turnover||1))*7))};}
function sourcePanel(){const rows=(D.sources||[]).filter(x=>board.groups.includes(x.group));const failed=rows.filter(x=>['error','stale'].includes(x.status));return `<details class="source-summary"><summary>数据来源与口径 · ${rows.length} 项请求记录${failed.length?' · '+failed.length+' 项待更新':''}</summary><p>仅使用 hithink-finance。页面生成时间 ${date(boot.generatedAt,true)}；数据包生成时间 ${date(D.updatedAt,true)}。表中“响应时点”是上游响应中的 timestamp，不承诺等于每个字段的发生时间；日线、年报和资讯分别显示自身日期。静态版不会自动联网。</p><div class="table-wrap"><table><thead><tr><th>能力</th><th>接口</th><th>响应时点</th><th>本地取数</th><th>状态</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${E(r.id)}</td><td>${E(r.endpoint)}</td><td>${date(r.upstreamTime,true)}</td><td>${date(r.fetchedAt,true)}</td><td>${E(r.status)}${r.error?' / '+E(r.error):''}</td></tr>`).join('')}</tbody></table></div><p style="margin-top:12px">${E(board.decision)}</p><p>信息展示与研究用途，不构成投资建议。互动实验的游戏属性与收益为虚拟设定。</p></details>`;}
function destroyCharts(){for(const x of charts){try{x.observer.disconnect();window.GalleryKlineChart.dispose(x.el);}catch{}}charts=[];}
function render(){if(!board)return;const scroll=window.scrollY;destroyCharts();V.resetPlots?.();const meta=window.NativeBoards.meta[board.id];document.documentElement.dataset.theme=['watch','futures'].includes(board.id)?'light':'dark';document.body.className='native n-'+board.id+' '+(['watch','futures'].includes(board.id)?'native-light':'native-dark');['bg','panel','text','muted','accent'].forEach((key,i)=>document.body.style.setProperty('--nf-'+key,meta[i+1]));document.getElementById('app').innerHTML=window.NativeBoards.render({D,S,board,boot,E,n,pct,money,date,valid,cls,stock,name,history,kline,button,table,baseCols,retcol,noteWidget,breadth,F,V,constituentRows,sourcePanel,store,refreshing});V.mountPlots?.();mountCharts();if(board.id==='pattern')mountDrawing();if(scroll)window.scrollTo(0,scroll);}
function mountCharts(scope=document){scope.querySelectorAll('[data-kline]').forEach(el=>{const code=el.dataset.kline,kind=el.dataset.kind,a=history(code,kind).slice(-180);if(!a.length){el.innerHTML=empty('日线尚未保存',boot.mode==='static'?'本次离线快照没有该标的历史。':'点击更新，或在详情中加载日线。');return;}if(!window.GalleryKlineChart){el.innerHTML=V.line([{name:name(code),points:a.map(x=>[x.time,x.close])}],{height:230,unit:'图表库未加载；收盘线预览'});return;}try{const c=window.GalleryKlineChart.init(el,{timezone:'Asia/Shanghai',dateFormat:'YYYY-MM-DD',locale:'zh-CN',disableAnalytics:true,styles:{candle:{type:'candle_solid',tooltip:{showRule:'follow_cross'},bar:{upColor:'#d03e4c',downColor:'#168270',noChangeColor:'#8293a5',upBorderColor:'#d03e4c',downBorderColor:'#168270',upWickColor:'#d03e4c',downWickColor:'#168270'}},grid:{horizontal:{color:document.body.classList.contains('native-light')?'#edf1f5':'#263141'},vertical:{color:document.body.classList.contains('native-light')?'#edf1f5':'#263141'}},xAxis:{tickText:{color:document.body.classList.contains('native-light')?'#7b8695':'#8c98a8'}},yAxis:{tickText:{color:document.body.classList.contains('native-light')?'#7b8695':'#8c98a8'}}}});c.applyNewData(a.map(r=>({...r,timestamp:r.time})));try{c.createIndicator({name:'MA',calcParams:[20,60]},true,{paneId:'candle_pane'});if(!el.classList.contains('small'))c.createIndicator('VOL');}catch{}const observer=new ResizeObserver(()=>c.resize());observer.observe(el);charts.push({el,c,observer});}catch{el.innerHTML=V.line([{name:name(code),points:a.map(x=>[x.time,x.close])}],{height:230,unit:'K线组件暂不可用；收盘线预览'});}});}
let toastTimer;function toast(t){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.append(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),4000);}
function download(file,content,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function closeDrawer(){document.querySelector('.drawer-back')?.remove();document.querySelector('.drawer')?.remove();}
function showDrawer(title,html){closeDrawer();const back=document.createElement('div');back.className='drawer-back';back.dataset.action='close';const d=document.createElement('section');d.className='drawer';d.setAttribute('role','dialog');d.setAttribute('aria-label',title);d.innerHTML=`<div class="top"><h2>${E(title)}</h2><button class="close" data-action="close" aria-label="关闭详情">×</button></div>${html}`;document.body.append(back,d);d.querySelector('button').focus();return d;}
async function openStock(code){const r=stock(code),kind=(D.etfs||[]).some(x=>x.thscode===code)?'etf':(D.futures||[]).some(x=>x.thscode===code)?'futures':'stock';S.selected=code;let h=history(code,kind);if(!h.length&&boot.mode==='dynamic'&&kind==='stock'){showDrawer(r.name,empty('正在读取日线',code));try{const res=await fetch('/api/history?code='+encodeURIComponent(code));const json=await res.json();if(!res.ok)throw new Error(json.error||'历史接口失败');D.history??={};D.history[code]=json.bars;h=json.bars;}catch(e){toast('日线加载失败：'+e.message);}}
 const m=F.metrics(h),noteText=kind==='futures'?'期货价格单位按该合约规则；涨跌幅相对前收。':kind==='etf'?'ETF场内价格，日线按接口原口径。':'A股快照为当前价格，日线使用前复权。';const el=showDrawer(r.name||code,`<p class="description">${E(code)} · ${E(noteText)}</p><div style="margin-top:20px">${strip([['最新价格',n(r.last_price),kind==='futures'?r.quoteKind||'':'报价单位：元'],['当日涨跌',pct(r.price_change_ratio_pct),'快照读数',cls(r.price_change_ratio_pct)],['20日涨幅',pct(m.ret20),'日线收盘计算',cls(m.ret20)],['60日涨幅',pct(m.ret60),'日线收盘计算',cls(m.ret60)]])}${kline(code,kind)}<p class="panel-foot">日线末日 ${date(h.at(-1)?.time)}；有效记录 ${h.length}。当前快照与日线有各自时点。</p><div class="controls" style="margin-top:20px">${kind==='stock'?button('watch-add','加入本地自选',code):''}</div>${(D.limits?.up||[]).find(x=>x.thscode===code)?`<p class="notice">涨停原因：${E(D.limits.up.find(x=>x.thscode===code).limit_up_reason)}</p>`:''}</div>`);V.mountPlots?.();mountCharts(el);
}
function selectedRows(){const map={market:D.stocks,sectors:D.sectors,semiconductor:constituentRows(boot.config.semiconductorIndex),pulse:D.events,abnormal:D.abnormal?.[S.abnormalTab],topics:(D.news||[]).flatMap(x=>x.items||[]),etf:D.etfs,pattern:S.patternMatches,watch:S.watch.map(stock),structure:F.confirmedTurns(history(S.structure||(D.watchCodes||[])[0])),futures:futureRows(),resonance:futureRows(),agri:D.basis,gold:constituentRows(boot.config.goldIndex),arena:(D.watchCodes||[]).map(stock)};return map[board.id]||[];}
function exportCSV(){const rows=selectedRows();if(!rows.length)return toast('当前没有可导出的记录');const keys=[...new Set(rows.flatMap(Object.keys))].filter(k=>rows.some(r=>r[k]===null||typeof r[k]!=='object'));const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[keys.map(q).join(','),...rows.map(r=>keys.map(k=>q(typeof r[k]==='object'?JSON.stringify(r[k]):r[k])).join(','))].join('\r\n');download(board.id+'.csv',csv,'text/csv;charset=utf-8');}
function schedule(){clearTimeout(refreshTimer);if(boot.mode!=='dynamic'||store.get('paused',false)||document.hidden)return;const now=new Date(),hour=Number(new Intl.DateTimeFormat('en',{timeZone:'Asia/Shanghai',hour:'2-digit',hour12:false}).format(now));const active=board.category==='商品与周期'||(hour>=9&&hour<16);const seconds=active?board.interval:Math.max(board.interval,300);refreshTimer=setTimeout(()=>refresh(false),seconds*1000*(.9+Math.random()*.2));}
async function refresh(manual=true){if(boot.mode==='static'){showDrawer('更新离线看板',`<p>静态页面保存的是一次真实取数快照。解压完整交付包，在包目录执行：</p><pre style="padding:18px;background:#eef3f8;white-space:pre-wrap">npm run refresh -- ${E(board.id)}</pre><p>命令会更新数据，并重新生成全部已保存看板的离线 HTML。也可以导入刷新后生成的 <code>data/latest.json</code>，当前页会立即重绘。</p><div class="controls" style="margin-top:18px">${button('import','导入数据包')}</div>`);return;}if(refreshing)return;refreshing=true;const el=document.querySelector('[data-action=refresh]');if(el){el.disabled=true;el.textContent='更新中…';}try{const res=await fetch('/api/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({board:board.id})});const next=await res.json();if(!res.ok)throw new Error(next.error||'更新失败');D=next;window.BOARD_DATA=D;if(store.get('watch',null)===null&&!S.watch.length)S.watch=D.watchCodes||[];render();if(manual)toast('数据检查完成，请核对各模块时点和来源状态');}catch(e){toast('更新失败，保留当前快照：'+e.message);}finally{refreshing=false;const el=document.querySelector('[data-action=refresh]');if(el){el.disabled=false;el.textContent='更新数据';}schedule();}}
function mountDrawing(){const canvas=document.getElementById('drawPad');if(!canvas)return;const ctx=canvas.getContext('2d');const draw=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);if(!S.pencil.length)return;ctx.strokeStyle='#77adff';ctx.lineWidth=4;ctx.lineJoin='round';ctx.beginPath();S.pencil.forEach((p,i)=>{const x=p[0]*canvas.width,y=(1-p[1])*canvas.height;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();};draw();let active=false;const point=e=>{const r=canvas.getBoundingClientRect();return[Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height))];};canvas.onpointerdown=e=>{active=true;S.pencil=[point(e)];canvas.setPointerCapture(e.pointerId);draw();};canvas.onpointermove=e=>{if(!active)return;const p=point(e);if(p[0]>S.pencil.at(-1)[0])S.pencil.push(p);draw();};canvas.onpointerup=()=>active=false;canvas.onpointercancel=()=>active=false;}
function findPattern(){if(S.pencil.length<3)return toast('请从左到右画线，或选择一条预设曲线');const ordered=S.pencil.slice().sort((a,b)=>a[0]-b[0]);const left=ordered[0][0],right=ordered.at(-1)[0];if(right-left<.1)return toast('画线横向范围太短');const target=Array.from({length:40},(_,i)=>{const x=left+(right-left)*i/39;let k=ordered.findIndex(p=>p[0]>=x);if(k<=0)return ordered[0][1];const [p,q]=[ordered[k-1],ordered[k]];return p[1]+(q[1]-p[1])*(x-p[0])/(q[0]-p[0]||1);});S.patternMatches=(D.patternCodes||[]).map(code=>{const a=history(code).slice(-S.patternWindow);return{code,corr:a.length>=S.patternWindow?F.pearson(target,F.sample(a.map(x=>x.close),40)):null};}).filter(x=>x.corr!==null).sort((a,b)=>b.corr-a.corr).slice(0,10);render();if(!S.patternMatches.length)toast('常数曲线或历史窗口不足，无法计算相关度');}
document.addEventListener('click',async event=>{const el=event.target.closest('[data-action],[data-code],[data-sector],[data-sort]');if(!el)return;if(el.tagName==='A')event.preventDefault();if(el.dataset.action){const action=el.dataset.action,value=el.dataset.value;switch(action){
 case'refresh':return refresh();case'pause':store.set('paused',!store.get('paused',false));render();schedule();return;
 case'close':return closeDrawer();case'csv':return exportCSV();case'import':document.getElementById('importData')?.click();return;
 case'export-html':location.href='/api/export?board='+board.id;return;
 case'native-select':S.nativeCode=value;break;case'native-area':S.nativeArea=value;break;case'native-tier':S.nativeTier=value;break;case'native-view':S.nativeView=value;break;case'native-topic':S.nativeTopic=value;break;case'native-plate':S.futuresPlate=S.futuresPlate===value?'全部':value;break;case'native-sources':S.nativeSources=!S.nativeSources;render();if(S.nativeSources){const el=document.querySelector('.nf-source-footer');el.querySelector('details').open=true;el.scrollIntoView({behavior:'smooth',block:'start'});}return;case'window':S.window=value;break;case'limit-tab':S.limitTab=value;break;case'abnormal-tab':S.abnormalTab=value;break;case'resonance':S.resonance=value;break;
 case'save-note':{const t=document.getElementById('noteText')?.value.trim();if(!t)return toast('先写下观察内容');const a=store.get('notes:'+value,[]);a.unshift({time:Date.now(),text:t});store.set('notes:'+value,a);store.set('draft:'+value,'');toast('笔记已保存到本机');break;}
 case'delete-note':{const [key,i]=value.split(':');const a=store.get('notes:'+key,[]);a.splice(Number(i),1);store.set('notes:'+key,a);break;}
 case'export-notes': {
  const notes = JSON.stringify(store.get('notes:'+value,[]),null,2);
  if (window.parent === window) download(value+'-notes.json',notes,'application/json');
  else showDrawer('复制笔记', `<textarea rows="12" style="width:100%" aria-label="笔记 JSON" readonly>${E(notes)}</textarea>`);
  return;
 }
 case'watch-remove':S.watch=S.watch.filter(c=>c!==value);store.set('watch',S.watch);break;
 case'watch-add':if(!S.watch.includes(value))S.watch.push(value);store.set('watch',S.watch);toast('已加入本地自选');return;
 case'watch-reset':S.watch=[...(D.watchCodes||[])];store.set('watch',S.watch);break;
 case'watch-up':{const i=S.watch.indexOf(value);if(i>0)[S.watch[i-1],S.watch[i]]=[S.watch[i],S.watch[i-1]];store.set('watch',S.watch);break;}
 case'watch-load':return openStock(value);
 case'watch-search':{const q=document.getElementById('watchSearch').value.trim();const rows=(D.symbols||D.stocks||[]).filter(x=>(x.name+x.thscode).toLowerCase().includes(q.toLowerCase())).slice(0,12);document.getElementById('watchResults').innerHTML=q?rows.map(x=>`<button data-action="watch-add-render" data-value="${x.thscode}">${E(x.name)} ${E(x.thscode)}　添加</button>`).join('')||'<p>未找到匹配的A股。</p>':'';return;}
 case'watch-add-render':if(!S.watch.includes(value))S.watch.push(value);store.set('watch',S.watch);break;
 case'pattern-clear':S.pencil=[];S.patternMatches=[];break;
 case'pattern-preset':S.pencil=value==='rise'?[[0,.1],[.25,.3],[.4,.22],[.7,.6],[1,.9]]:value==='v'?[[0,.9],[.5,.1],[1,.8]]:[[0,.25],[.3,.28],[.6,.23],[.75,.3],[1,.85]];break;
 case'pattern-search':return findPattern();
 case'arena-pick':if(S.arena.includes(value))S.arena=S.arena.filter(x=>x!==value);else if(S.arena.length<3)S.arena.push(value);else return toast('每队最多三张卡');break;
 case'arena-fight':{if(S.arena.length!==3)return;const cards=S.arena.map(stock).map(r=>({...r,...gameAttrs(r)}));const enemy=45+(S.round%5)*7,shield=18+(S.round%3)*6;const damage=cards.reduce((s,c)=>s+Math.max(0,c.attack-shield),0),loss=cards.reduce((s,c)=>s+Math.max(0,enemy-c.guard),0),remain=cards.reduce((s,c)=>s+c.energy,0)-loss;S.battle=`队伍造成 ${damage} 点虚拟伤害\n抵挡后受到 ${loss} 点伤害\n剩余虚拟能量 ${remain}\n${damage>=90&&remain>0?'本轮通过':'本轮未通过，可以重新组队'}。这不是金融风险测评。`;S.round++;break;}
 default:return;
 }render();return;}
 if(el.dataset.sort){const {sort:id,key}=el.dataset;const old=S.sort[id];S.sort[id]={key,dir:old?.key===key?-old.dir:-1};render();return;}
 if(el.dataset.sector){S.sector=el.dataset.sector;if(board.id==='sectors')render();else{const a=constituentRows(S.sector),sec=D.sectors?.find(x=>x.thscode===S.sector);showDrawer(sec?.name||S.sector,breadth(a).html+table(a,baseCols,'drawer-members'));}return;}
 if(el.dataset.code)openStock(el.dataset.code);
});
document.addEventListener('change',async e=>{const el=e.target,k=el.dataset.control;if(el.id==='importData'){const file=el.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(d.version!==1||!Array.isArray(d.sources)||!Number.isFinite(d.updatedAt))throw new Error('数据包格式不正确');D=d;window.BOARD_DATA=d;closeDrawer();render();toast('数据包已导入；此操作仅影响当前打开页面');}catch(e){toast(e.message);}return;}
 if(!k)return;switch(k){case'native-width':S.nativeWidth=Number(el.value);break;case'native-height':S.nativeHeight=Number(el.value);break;case'navigate':location.href=el.value+'.html';return;case'direction':S.direction=el.value;break;case'event-tag':S.eventTag=el.value;break;case'etf-min':S.etfMin=Number(el.value)||0;break;case'etf-window':S.etfWindow=el.value;break;case'etf-trend':S.etfTrend=el.checked;break;case'pattern-window':S.patternWindow=Number(el.value);S.patternMatches=[];break;case'structure-code':S.structure=el.value;break;case'future-plate':S.futuresPlate=el.value;break;default:return;}render();});
let inputTimer;document.addEventListener('input',e=>{const el=e.target;if(el.id==='noteText'){store.set('draft:'+board.id,el.value);return;}if(['sector-search','limit-search','event-search'].includes(el.dataset.control)){clearTimeout(inputTimer);const pos=el.selectionStart;inputTimer=setTimeout(()=>{S.search=el.value;render();const next=document.querySelector(`[data-control="${el.dataset.control}"]`);next?.focus();next?.setSelectionRange(pos,pos);},220);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if((e.key==='Enter'||e.key===' ')&&e.target.dataset.sort){e.preventDefault();e.target.click();}if(e.key==='Enter'&&e.target.id==='watchSearch')document.querySelector('[data-action=watch-search]')?.click();});

async function init(){if(!board)return;if(boot.mode==='dynamic'){try{const res=await fetch('/api/state?board='+board.id);if(!res.ok)throw new Error('无法读取本地数据包');D=await res.json();window.BOARD_DATA=D;if(store.get('watch',null)===null&&!S.watch.length)S.watch=D.watchCodes||[];}catch(e){document.getElementById('app').innerHTML=empty('无法打开动态看板',e.message+'；请在完整交付包运行 npm start。');return;}}render();schedule();const deepCode=new URLSearchParams(location.search).get('code');if(board.id==='watch'&&/^[0-9]{6}\.(SH|SZ|BJ)$/.test(deepCode||''))openStock(deepCode);}
init();
