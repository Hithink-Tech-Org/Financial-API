    background: radial-gradient(circle at 34% 30%, color-mix(in srgb, var(--c-warn) 45%, var(--c-text)), var(--c-warn) 62%, color-mix(in srgb, var(--c-warn) 62%, var(--c-bg)));
    box-shadow: 0 2px 0 color-mix(in srgb, var(--c-warn) 55%, var(--c-bg)), 0 0 10px color-mix(in srgb, var(--c-warn) 45%, transparent);
    color: color-mix(in srgb, var(--c-warn) 30%, var(--c-bg)); font-size: 14px; font-weight: 800; }
  #cash { font-size: var(--f-2xl); font-weight: 800; line-height: 1.15; color: color-mix(in srgb, var(--c-warn) 55%, var(--c-text)); }
  #cash.bump { animation: hg-bump .26s ease; }
  @keyframes hg-bump { 45% { transform: scale(1.2); } }

  .cards { display: flex; flex: 1; gap: 6px; min-width: 0; padding-bottom: 2px; overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--c-border) transparent; }
  .pcard { position: relative; display: flex; flex: 1 1 0; flex-direction: column; align-items: center; justify-content: flex-end;
    min-width: 54px; max-width: 86px; height: 68px; padding: 2px 4px 4px; overflow: hidden; cursor: pointer; border: 0; border-radius: 12px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c-text) 10%, var(--c-surface)), var(--c-surface));
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--c-text) 14%, var(--c-border)) inset, 0 3px 0 color-mix(in srgb, var(--c-bg) 55%, var(--c-border)), 0 6px 12px color-mix(in srgb, var(--c-bg) 50%, transparent);
    transition: transform .12s, box-shadow .12s, filter .15s; }
  .pcard:hover { transform: translateY(-3px); filter: brightness(1.12); }
  .pcard:active { transform: translateY(2px); }
  .pcard.on { transform: translateY(-5px); background: linear-gradient(180deg, color-mix(in srgb, var(--c-accent) 34%, var(--c-surface)), color-mix(in srgb, var(--c-accent) 12%, var(--c-surface)));
    box-shadow: 0 0 0 2px var(--c-accent) inset, 0 3px 0 color-mix(in srgb, var(--c-accent) 52%, var(--c-bg)), 0 0 18px color-mix(in srgb, var(--c-accent) 50%, transparent); }
  .pcard.poor .pcard-cost { color: var(--c-mute); }
  .pcard.poor canvas, .pcard.cooling canvas { opacity: .45; }
  .pcard canvas { width: 40px; height: 40px; margin-bottom: -2px; }
  .pcard-name { max-width: 100%; overflow: hidden; font-size: var(--f-sm); font-weight: 500; line-height: 1.35; white-space: nowrap; text-overflow: ellipsis; }
  .pcard-cost { position: absolute; top: 3px; left: 5px; display: flex; align-items: center; gap: 3px; color: var(--c-warn); font-size: var(--f-sm); font-weight: 600; line-height: 1.2; }
  .pcard-cost i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pcard-key { position: absolute; top: 3px; right: 5px; color: var(--c-mute); font-size: var(--f-xs); line-height: 1.4; }
  .pcard-cd { position: absolute; inset: auto 0 0 0; height: 0; background: color-mix(in srgb, var(--c-bg) 70%, transparent); pointer-events: none; }
  .pcard.fresh::after { content: ""; position: absolute; top: 19px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--c-gain);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-gain) 28%, transparent); }

  /* 客户端页面预览在右上角叠了一个 36px 的「缩放预览」悬浮按钮（距右 7px、距顶 11px），工具栏向左让出这块位置 */
  .tools { display: flex; flex: none; align-items: center; gap: 6px; margin-right: 38px; }
  .tool { --bb: var(--c-surface); display: inline-flex; align-items: center; gap: 5px; height: 36px; padding: 0 12px; cursor: pointer; white-space: nowrap; border: 0; border-radius: 11px; font-size: var(--f-sm); font-weight: 700;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c-text) 10%, var(--bb)), var(--bb));
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--c-text) 14%, var(--c-border)) inset, 0 3px 0 color-mix(in srgb, var(--c-bg) 55%, var(--c-border)), 0 5px 10px color-mix(in srgb, var(--c-bg) 50%, transparent);
    transition: transform .08s, box-shadow .08s, filter .15s; }
  .tool svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tool:hover { filter: brightness(1.14); }
  .tool:active { transform: translateY(3px); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c-text) 14%, var(--c-border)) inset; }
  .tool.on { --bb: var(--c-accent); color: var(--c-surface); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c-text) 30%, var(--c-accent)) inset, 0 3px 0 color-mix(in srgb, var(--c-accent) 52%, var(--c-bg)), 0 0 14px color-mix(in srgb, var(--c-accent) 45%, transparent); }
  .tool.icon { width: 36px; padding: 0; justify-content: center; border-radius: 50%; }

  /* ------------------------------------------------------------------ 画面 */
  .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; user-select: none;
    border: 1px solid var(--c-border); border-radius: var(--r-lg); background: var(--c-bg); }
  .stage.selling { cursor: crosshair; }
  .stage.buying { cursor: cell; }
  #cv { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: manipulation; }

  .lanes { position: absolute; top: 0; left: 0; z-index: 2; width: 0; height: 0; transform-origin: 0 0; }
  .lane { position: absolute; left: 8px; display: flex; flex-direction: column; justify-content: center; gap: 1px; width: 104px; height: 80px; padding: 6px 8px 6px 10px;
    border: 1px solid color-mix(in srgb, var(--c-text) 14%, var(--c-border)); border-left: 4px solid var(--c-accent); border-radius: 10px; text-align: left; cursor: pointer;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c-text) 7%, var(--c-surface)), var(--c-surface)); box-shadow: 0 3px 0 color-mix(in srgb, var(--c-bg) 55%, var(--c-border));
    transition: transform .15s, filter .15s; }
  .lane:hover { transform: translateX(3px); filter: brightness(1.12); }
  .lane.demo { cursor: default; }
  .lane-name { overflow: hidden; font-size: var(--f-base); font-weight: 600; line-height: 1.25; white-space: nowrap; text-overflow: ellipsis; }
  .lane-live { font-size: var(--f-sm); line-height: 1.3; }
  .lane-day { display: flex; align-items: center; gap: 4px; color: var(--c-mute); font-size: var(--f-sm); line-height: 1.3; }
  .lane-day b { font-weight: 600; }
  .lane.limit-up { border-color: var(--c-gain); box-shadow: 0 0 0 1px var(--c-gain) inset; }
  .lane.limit-down { border-color: var(--c-loss); box-shadow: 0 0 0 1px var(--c-loss) inset; }

  /* 开盘横幅：一条横贯盘面的色带，从左侧滑入 */
  .banner { --bc: var(--c-accent); position: absolute; top: 34%; left: 0; right: 0; z-index: 3; padding: 12px 30px; pointer-events: none; white-space: nowrap; text-align: center;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--bc) 30%, var(--c-bg)) 22%, color-mix(in srgb, var(--bc) 30%, var(--c-bg)) 78%, transparent);
    border-top: 2px solid color-mix(in srgb, var(--bc) 70%, transparent); border-bottom: 2px solid color-mix(in srgb, var(--bc) 70%, transparent);
    opacity: 0; transform: translate(-40px, -50%) scaleY(.6); transition: opacity .26s ease, transform .3s cubic-bezier(.2, 1.3, .4, 1); }
  .banner.show { opacity: 1; transform: translate(0, -50%) scaleY(1); }
  .banner b { display: block; font-size: 30px; font-weight: 800; letter-spacing: 8px; text-shadow: 0 2px 0 var(--c-bg), 0 0 18px color-mix(in srgb, var(--bc) 70%, transparent); }
  .banner span { color: var(--c-dim); font-size: var(--f-sm); letter-spacing: 2px; }
  .banner.alert { --bc: var(--c-loss); }
  .banner.alert b { color: color-mix(in srgb, var(--c-loss) 60%, var(--c-text)); }
  .toast { position: absolute; bottom: 12px; left: 50%; z-index: 3; max-width: 86%; padding: 6px 16px; pointer-events: none;
    border-radius: var(--r-full); background: var(--c-surface); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c-accent) 40%, var(--c-border)) inset, 0 6px 16px color-mix(in srgb, var(--c-bg) 60%, transparent);
    color: var(--c-text); font-size: var(--f-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transform: translate(-50%, 6px); transition: opacity .18s ease, transform .18s ease; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 知识卡：新概念首次登场时从右侧滑入，不打断操作 */
  .tip { position: absolute; right: 12px; bottom: 12px; z-index: 3; width: min(320px, 46%); padding: 12px 14px 12px 16px; border-radius: 14px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c-accent) 10%, var(--c-surface)), var(--c-surface));
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--c-accent) 45%, var(--c-border)) inset, 4px 0 0 var(--c-accent) inset, var(--sh-lg);
    opacity: 0; transform: translateX(30px) scale(.94); pointer-events: none; transition: opacity .25s ease, transform .32s cubic-bezier(.2, 1.3, .4, 1); }
  .tip.show { opacity: 1; transform: none; }
  .tip.show .tip-x { pointer-events: auto; }
  .tip h4 { display: flex; align-items: center; gap: 6px; margin: 0 0 3px; font-size: var(--f-base); font-weight: 600; }
  .tip h4 em { padding: 0 6px; border-radius: var(--r-sm); background: var(--accent-dim); color: var(--c-accent); font-size: var(--f-sm); font-style: normal; font-weight: 500; }
  .tip p { margin: 0; color: var(--c-dim); font-size: var(--f-sm); line-height: 1.6; }
  .tip .tip-x { position: absolute; top: 4px; right: 6px; padding: 2px 6px; border: 0; background: none; color: var(--c-mute); font-size: var(--f-base); cursor: pointer; }

  /* ------------------------------------------------------------------ 弹层 */
  .overlay { position: absolute; inset: 0; z-index: 4; display: none; padding: 16px; overflow-y: auto;
    background: color-mix(in srgb, var(--c-bg) 66%, transparent); backdrop-filter: blur(5px); }
  .overlay.show { display: flex; }
  /* 对话框：带主色光晕的标题区 + 内容区，入场回弹；--hc 决定这张对话框的主色 */
  .panel { position: relative; width: min(780px, 100%); margin: auto; overflow: hidden; border: 1px solid color-mix(in srgb, var(--hc, var(--c-accent)) 45%, var(--c-border)); border-radius: 20px;
    background: var(--c-surface); box-shadow: var(--sh-lg), 0 0 0 6px color-mix(in srgb, var(--hc, var(--c-accent)) 10%, transparent); animation: hg-pop .36s cubic-bezier(.2, 1.35, .4, 1); }
  .panel.narrow { width: min(540px, 100%); }
  /* 首页：加宽、收紧纵向留白，保证在常见窗口高度下一屏放完 */
  .panel.wide { width: min(1020px, 100%); }
  .panel.wide .dlg-head { padding: 12px 26px 4px; }
  .panel.wide h1 { font-size: 26px; }
  .panel.wide h3 { margin: 10px 0 8px; }
  .panel.wide .dlg-body { padding-bottom: 14px; }
  .panel.wide .actions { margin-top: 10px; }
  @keyframes hg-pop { from { opacity: 0; transform: translateY(18px) scale(.92); } }
  .dlg-head { position: relative; padding: 20px 26px 14px; overflow: hidden; text-align: center;
    background: radial-gradient(ellipse 80% 130% at 50% -30%, color-mix(in srgb, var(--hc, var(--c-accent)) 42%, transparent), transparent 72%), linear-gradient(180deg, color-mix(in srgb, var(--hc, var(--c-accent)) 12%, var(--c-surface)), var(--c-surface)); }
  .dlg-head.left { text-align: left; }
  .dlg-x { position: absolute; top: 12px; right: 12px; z-index: 2; display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 1px solid var(--c-border); border-radius: 50%; background: var(--c-surface); color: var(--c-dim); font-size: var(--f-lg); line-height: 1; cursor: pointer; }
  .dlg-x:hover { border-color: var(--c-accent); color: var(--c-text); }
  .dlg-body { padding: 2px 26px 22px; }
  .ribbon { display: inline-block; padding: 1px 14px 1px 10px; background: var(--hc, var(--c-accent)); color: var(--c-bg); font-size: var(--f-sm); font-weight: 800; letter-spacing: 1px; clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 50%, 100% 100%, 0 100%); }
  .panel h1 { display: inline-flex; align-items: center; gap: 12px; margin: 0; font-size: 30px; font-weight: 800; letter-spacing: 6px;
    background: linear-gradient(180deg, var(--c-text) 35%, color-mix(in srgb, var(--c-warn) 70%, var(--c-text))); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo { position: relative; flex: none; width: 30px; height: 30px; border-radius: 8px; transform: rotate(45deg) scale(.82);
    background: linear-gradient(135deg, var(--c-gain), color-mix(in srgb, var(--c-gain) 55%, var(--c-warn))); box-shadow: 0 0 0 2px var(--c-surface), 0 0 0 4px var(--c-warn), 0 0 16px color-mix(in srgb, var(--c-gain) 60%, transparent); }
  .logo::after { content: ""; position: absolute; inset: 7px; border-radius: 3px; background: var(--c-surface); opacity: .9; }
  .panel h2 { margin: 0 0 4px; font-size: var(--f-2xl); font-weight: 800; letter-spacing: 3px; }
  .panel h3 { display: flex; align-items: center; gap: 8px; margin: 16px 0 8px; font-size: var(--f-base); font-weight: 800; letter-spacing: 2px; }
  .panel h3::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: var(--hc, var(--c-accent)); }
  .panel h3 small { letter-spacing: 0; }
  .panel h3 small { color: var(--c-mute); font-size: var(--f-sm); font-weight: 400; }
  .panel .sub { margin: 2px 0 0; color: var(--c-dim); font-size: var(--f-sm); }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .head .meta { color: var(--c-mute); font-size: var(--f-sm); text-align: right; }
  .head .meta b { color: var(--c-warn); font-weight: 600; }
  .spacer { flex: 1; }
  .link { padding: 0; border: 0; background: none; color: var(--c-accent); font-size: var(--f-sm); cursor: pointer; }
  .link:hover { text-decoration: underline; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; border-radius: var(--r-full); font-size: var(--f-sm); font-weight: 500; line-height: 20px;
    background: color-mix(in srgb, var(--c-gain) 14%, transparent); color: var(--c-gain); }
  .badge.sim { background: color-mix(in srgb, var(--c-warn) 16%, transparent); color: var(--c-warn); }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .stocks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .stock { position: relative; display: grid; grid-template-columns: auto 1fr; align-items: baseline; column-gap: 8px; min-width: 0; padding: 8px 10px 6px 12px; cursor: pointer; border-radius: 12px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c-text) 5%, var(--c-bg)), var(--c-bg));
    box-shadow: 0 0 0 1px var(--c-border) inset, 4px 0 0 var(--c-accent) inset, 0 3px 0 color-mix(in srgb, var(--c-bg) 55%, var(--c-border)); transition: transform .15s, filter .15s; }
  .stock:hover { transform: translateY(-3px); filter: brightness(1.12); }
  .stock::before { content: attr(data-lane); position: absolute; top: -7px; left: 10px; padding: 0 6px; border-radius: 4px; background: var(--c-accent); color: var(--c-surface); font-size: var(--f-xs); font-weight: 800; line-height: 15px; }
  .stock.demo { cursor: default; }
  /* 三行：名称 / 现价 + 涨跌幅 + 代码 / 走势 */
  .stock-name { grid-column: 1 / -1; overflow: hidden; padding-right: 22px; font-weight: 700; white-space: nowrap; text-overflow: ellipsis; }
  .stock-px { grid-row: 2; grid-column: 1; font-size: var(--f-lg); font-weight: 700; }
  .stock-pct { grid-row: 2; grid-column: 2; justify-self: start; font-size: var(--f-sm); }
  .stock-code { grid-row: 2; grid-column: 2; justify-self: end; color: var(--c-mute); font-size: var(--f-sm); }
  .stock canvas { grid-column: 1 / -1; width: 100%; height: 24px; margin-top: 2px; }
  .watch-btn { position: absolute; top: 6px; right: 6px; display: grid; place-items: center; width: 20px; height: 20px; padding: 0; cursor: pointer;
    border: 1px solid var(--c-border); border-radius: var(--r-sm); background: var(--c-surface); color: var(--c-accent); font-size: 14px; line-height: 1; }
  .watch-btn:hover { background: var(--c-accent); color: var(--c-surface); }
  .watch-btn:disabled { opacity: .5; cursor: not-allowed; }
  .mood { display: flex; align-items: center; gap: 10px; margin-top: 10px; color: var(--c-dim); font-size: var(--f-sm); }
  .mood-bar { position: relative; flex: 1; height: 6px; overflow: hidden; border-radius: 3px; background: var(--c-loss); }
  .mood-bar i { position: absolute; inset: 0 auto 0 0; background: var(--c-gain); }

  /* 闯关之路：八个关卡徽章用虚线连成两排；通关金环，下一关脉冲发光，未解锁上锁 */
  /* 八关排成一排，首页才能在一屏内放下，不出现滚动条 */
  .levels { position: relative; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 10px 4px; padding: 6px 0 2px; }
  .levels::before { content: ""; position: absolute; top: 35px; left: 6.25%; right: 6.25%; height: 5px; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--c-border) 0 10px, transparent 10px 18px); }
  .level { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 0; min-width: 0; padding: 0; border: 0; background: none; text-align: center; cursor: pointer; line-height: 1.35; }
  .level > span { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .level .ringimg { position: relative; display: grid; place-items: center; overflow: visible; width: 62px; height: 62px; border-radius: 50%; background: var(--c-bg);
    box-shadow: 0 0 0 3px var(--c-surface), 0 0 0 6px var(--c-border), 0 6px 14px color-mix(in srgb, var(--c-bg) 60%, transparent); transition: transform .2s, box-shadow .2s; }
  .level .ringimg canvas { width: 50px; height: 50px; }
  .level:hover:not(:disabled) .ringimg { transform: translateY(-4px) scale(1.06); }
  .level.done .ringimg { box-shadow: 0 0 0 3px var(--c-surface), 0 0 0 6px var(--c-warn), 0 6px 14px color-mix(in srgb, var(--c-bg) 60%, transparent); }
  .level.next .ringimg { box-shadow: 0 0 0 3px var(--c-surface), 0 0 0 6px var(--c-accent), 0 0 26px 6px color-mix(in srgb, var(--c-accent) 55%, transparent); }
  .level.next .ringimg::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--c-accent); animation: ringPulse 1.6s ease-out infinite; }
  @keyframes ringPulse { from { opacity: .9; transform: scale(.92); } to { opacity: 0; transform: scale(1.4); } }
  .level.live .ringimg { box-shadow: 0 0 0 3px var(--c-surface), 0 0 0 6px var(--c-gain), 0 0 22px color-mix(in srgb, var(--c-gain) 45%, transparent); }
  .level:disabled { cursor: not-allowed; }
  .level:disabled .ringimg canvas { filter: grayscale(1) brightness(.5); }
  .level:disabled .ringimg::before { content: ""; position: absolute; z-index: 1; width: 22px; height: 18px; margin-top: 8px; border-radius: 4px; background: var(--c-mute); box-shadow: 0 -11px 0 -5px var(--c-surface), 0 -11px 0 -2px var(--c-mute); }
  .level-no { margin-top: 6px; color: var(--c-mute); font-size: var(--f-xs); letter-spacing: 1px; }
  .level-name { font-weight: 800; }
  .level.next .level-name { color: var(--c-accent); }
  .level-topic { color: var(--c-dim); font-size: var(--f-sm); }
  .stars { color: var(--c-warn); font-size: var(--f-base); letter-spacing: 2px; }
  .stars i { color: var(--c-border); font-style: normal; }

  .lesson { position: relative; padding: 12px 16px 12px 18px; border-radius: 14px; background: linear-gradient(180deg, color-mix(in srgb, var(--c-accent) 8%, var(--c-bg)), var(--c-bg));
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--c-accent) 35%, var(--c-border)) inset, 4px 0 0 var(--c-accent) inset; }
  .lesson b { display: block; margin-bottom: 2px; }
  .lesson p { margin: 0; color: var(--c-dim); font-size: var(--f-sm); line-height: 1.7; }
  .lesson p + p { margin-top: 4px; color: var(--c-text); }
  .units { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .unit { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: 12px; background: var(--c-bg);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--c-gain) 30%, var(--c-border)) inset, 0 3px 0 color-mix(in srgb, var(--c-bg) 55%, var(--c-border)); }
  .unit.foe { box-shadow: 0 0 0 1px color-mix(in srgb, var(--c-loss) 30%, var(--c-border)) inset, 0 3px 0 color-mix(in srgb, var(--c-bg) 55%, var(--c-border)); }
  .unit canvas { flex: none; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c-text) 10%, var(--c-surface)), var(--c-surface)); }
  .unit b { display: block; font-weight: 600; }
  .unit span { color: var(--c-dim); font-size: var(--f-sm); line-height: 1.45; }

  .kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .kv div { padding: 10px 6px; border-radius: 12px; background: linear-gradient(180deg, color-mix(in srgb, var(--c-text) 6%, var(--c-bg)), var(--c-bg)); text-align: center;

  function Game() {

  const G = Game.prototype;

  G.reset = function (level, lanes, opts) {

  G.addEquity = function (d) {

  /* ------------------------------------------------------------ 建仓 / 卖出 */
  G.why = function (key, row, col) {

    if (this.grid[row][col]) return '这格已经有持仓了';

  };
  G.place = function (key, row, col) {

  G.addPlant = function (key, row, col) {

  G.removePlant = function (p, reason) {

    if (i >= 0) this.plants.splice(i, 1);
    if (reason !== 'eaten') return;
    if (p.key === 'leek') {

  G.sellAt = function (row, col) {
    const p = this.grid[row] && this.grid[row][col];

  /* -------------------------------------------------------------- 资金掉落 */
  G.spawnDrop = function (x, y, val, kind) {
    this.drops.push({ x: x, y: kind === 'sky' ? -20 : y, ty: y, val: Math.round(val * this.mood.cash / 5) * 5, kind: kind, t: 0, life: 7 });

  G.dropAt = function (x, y) {

  };
  G.collect = function (d) {

  };

  /* -------------------------------------------------------------- 波次编排 */
  G.dayIndex = function (r, d) {
    const s = this.lanes[r] && this.lanes[r].series;
    if (!s || !s.length) return -1;
    if (this.days !== Infinity && s.length >= this.days) return s.length - this.days + d - 1;
    return (d - 1) % s.length;
  };
  G.startWave = function () {
    const lv = this.level, rng = this.rng;
    const d = ++this.day;
    const last = d === this.days;
    const loop = this.days === Infinity ? Math.floor((d - 1) / 30) : 0;
    const weights = [];
    let worst = -1, date = '';
    for (let r = 0; r < CFG.ROWS; r++) {
      const idx = this.dayIndex(r, d);
      const bar = idx >= 0 ? this.lanes[r].series[idx] : null;
      const pct = bar ? bar.pct : 0;
      if (bar && !date) date = bar.date;
      this.lanePct[r] = pct;
      this.laneState[r] = pct >= 9.7 ? 'limit-up' : pct <= -9.7 ? 'limit-down' : '';
      weights.push(pct >= 9.7 ? 0 : pct <= -9.7 ? 2.6 : clamp(1 - pct / 4, 0.35, 2.2));

    }
    this.dayDate = date;
    if (!weights.some((w) => w > 0)) weights.fill(0.35);
    const total = weights.reduce((a, b) => a + b, 0);
    const pickRow = () => {
      let t = rng() * total;
      for (let r = 0; r < CFG.ROWS; r++) { t -= weights[r]; if (t <= 0) return r; }
      return CFG.ROWS - 1;
    };

    let budget = (lv.base + lv.grow * (d - 1)) * this.mood.press * (1 + loop * 0.35) * (last ? 1.4 : 1);
    const list = [];
    let guard = 0;
    while (budget >= 1 && guard++ < 80) {
      const ok = lv.pool.filter((k) => BEARS[k].cost <= budget && (BEARS[k].cost < 3 || d >= 2) && (BEARS[k].cost < 5 || d >= 3));
      if (!ok.length) break;
      const key = ok[Math.floor(rng() * ok.length)];
      budget -= BEARS[key].cost;
      list.push({ key: key, row: pickRow() });
    }
    for (let r = 0; r < CFG.ROWS; r++) {
      if (this.laneState[r] !== 'limit-down') continue;
      list.push({ key: 'panic', row: r }, { key: 'panic', row: r });
      this.news('【跌停】' + this.laneName(r) + ' 封死跌停，恐慌盘涌出');
    }
    const gap = clamp(20 / Math.max(1, list.length), 0.5, 3.6);

    list.forEach((q) => { q.delay = at; at += gap * (0.65 + rng() * 0.7); });

    if (boss) {

    }
    this.queue = list;
    this.waveLive = true;
    this.waveT = 18;

    let bonus = 0;
    for (let r = 0; r < CFG.ROWS && bonus < 2; r++) {
      if (this.lanePct[r] >= 9.7) {

    if (this.lanes[worst] && this.lanePct[worst] <= -2 && this.laneState[worst] !== 'limit-down') {
      this.news(this.laneName(worst) + ' 当日 ' + this.lanePct[worst].toFixed(2) + '%，这条线抛压加重');
    }

  };
  G.laneName = function (r) { return (this.lanes[r] && this.lanes[r].name) || ('第 ' + (r + 1) + ' 行'); };

  G.spawnBear = function (key, row, x) {
    const def = BEARS[key];
    const loop = this.days === Infinity ? Math.floor((this.day - 1) / 30) : 0;
    const hp = def.hp * (1 + loop * 0.3);
    this.bears.push({ key: key, def: def, row: row, x: x || CFG.W + 30, hp: hp, maxHp: hp, shield: def.shield || 0, t: this.rng() * 6,

  };

  /* ---------------------------------------------------------- 伤害与结算 */
  G.hurt = function (b, dmg, slow) {
    if (b.shield > 0) {
      b.shield -= dmg;
      if (b.shield <= 0) { this.puff(b.x - 16, rowY(b.row) - 10, 'paper', 8); b.shield = 0; }
    } else {
      b.hp -= dmg;
    }
    if (slow) b.slowT = Math.max(b.slowT, slow);

    if (b.hp <= 0) this.kill(b, true);
  };
  G.kill = function (b, credited) {
    const i = this.bears.indexOf(b);
    if (i < 0) return;
    this.bears.splice(i, 1);
    const y = rowY(b.row);

      this.emit('sfx', b.def.boss ? 'win' : 'kill');

        if (p.key === 'hedge' || Math.abs(p.row - b.row) > 1 || Math.abs(p.x - b.x) > 110) return;
        p.hp -= b.def.blast; p.flash = 0.15;
        if (p.hp <= 0) this.removePlant(p, 'eaten');
      });

    }
  };
  G.explode = function (x, y, rows, radius, dmg) {
    this.puff(x, y, 'boom', 22);
    this.shake = Math.max(this.shake, 0.3);
    this.emit('sfx', 'boom');
    const row = rowAt(y);
    this.bears.slice().forEach((b) => {
      if (Math.abs(b.row - row) <= rows && Math.abs(b.x - x) <= radius) this.hurt(b, dmg);

  };
  G.finish = function (win, reason) {
    this.phase = win ? 'won' : 'lost';
    this.reason = reason || '';
    this.sample(true);
    this.emit('end', win);
    this.emit('sfx', win ? 'win' : 'lose');
  };
  G.stars = function () {
    if (this.phase !== 'won') return 0;
    return this.maxDD < 0.035 ? 3 : this.maxDD < 0.09 ? 2 : 1;
  };

  /* -------------------------------------------------------------- 粒子 */
  G.puff = function (x, y, kind, n) {
    for (let i = 0; i < n; i++) {
      const a = this.rng() * Math.PI * 2, s = (kind === 'boom' ? 90 : 46) * (0.4 + this.rng());
      this.fx.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (kind === 'boom' ? 20 : 30), t: 0, life: 0.45 + this.rng() * 0.4, kind: kind, r: 2 + this.rng() * 4 });
    }
    if (kind === 'boom') this.fx.push({ x: x, y: y, vx: 0, vy: 0, t: 0, life: 0.4, kind: 'ring', r: 12 });
  };
  G.float = function (x, y, text, tone) { this.floats.push({ x: x, y: y, text: text, tone: tone, t: 0 }); };

  /* -------------------------------------------------------------- 主循环 */
  G.step = function (dt) {
    if (this.phase !== 'playing') return;
    let left = Math.min(dt, 0.25);
    while (left > 1e-6 && this.phase === 'playing') {
      const h = Math.min(left, 1 / 30);
      this.tick(h);
      left -= h;
    }
  };
  G.tick = function (h) {
    this.time += h;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - h);
    for (const k in this.cool) if (this.cool[k] > 0) this.cool[k] = Math.max(0, this.cool[k] - h);
    this.stepWaves(h);
    this.stepPlants(h);
    this.stepShots(h);
    this.stepBears(h);
    this.stepMowers(h);
    this.stepDrops(h);
    this.stepFx(h);
    this.sampleT -= h;
    if (this.sampleT <= 0) { this.sampleT = 0.5; this.sample(false); }
  };
  G.sample = function (force) {
    const c = this.curve;
    if (force || this.phase === 'playing') c.push(this.equity);
    if (c.length > 360) { for (let i = c.length - 2; i > 0; i -= 2) c.splice(i, 1); }
  };

  G.stepWaves = function (h) {
    for (let i = this.queue.length - 1; i >= 0; i--) {
      const q = this.queue[i];
      q.delay -= h;
      if (q.delay <= 0) { this.queue.splice(i, 1); this.spawnBear(q.key, q.row); }
    }
    if (this.queue.length) return;
    if (this.waveLive && !this.bears.length) {
      this.waveLive = false;
      if (this.day >= this.days) { this.finish(true, '全部交易日守住'); return; }
      this.waveT = Math.min(this.waveT, 7);
    }
    this.waveT -= h;
    if (this.waveT <= 0 && this.day < this.days) this.startWave();
  };

  G.rowHasBear = function (row, x) {
    for (let i = 0; i < this.bears.length; i++) {
      const b = this.bears[i];
      if (b.row === row && b.x > x - 10 && b.x < CFG.W + 10) return true;
    }
    return false;
  };
  G.shoot = function (p) {
    this.shots.push({ row: p.row, x: p.x + 26, y: p.y - 8, dmg: p.def.dmg, slow: p.def.slow || 0, kind: p.key });
    p.kick = 1;
    this.emit('sfx', 'shot');
  };
  G.stepPlants = function (h) {
    for (let i = this.regrow.length - 1; i >= 0; i--) {
      const g = this.regrow[i];
      g.t -= h;
      if (g.t > 0) continue;
      if (this.grid[g.row][g.col]) { g.t = 1; continue; }
      this.regrow.splice(i, 1);
      this.addPlant('leek', g.row, g.col);
      this.float(colX(g.col), rowY(g.row) - 30, '又长出来了', 'leaf');
    }
    const list = this.plants.slice();
    for (let i = 0; i < list.length; i++) {
      const p = list[i], def = p.def;
      p.t += h;
      if (p.flash > 0) p.flash -= h;
      if (p.kick > 0) p.kick = Math.max(0, p.kick - h * 6);
      if (def.every) {
        p.pay -= h;
        if (p.pay <= 0) { p.pay = def.every; this.spawnDrop(p.x + (this.rng() - 0.5) * 30, p.y - 6, def.pay, 'div'); }
      }
      if (def.rate) {
        p.fire -= h;
        if (p.fire <= 0 && this.rowHasBear(p.row, p.x)) {
          p.fire = def.rate;
          this.shoot(p);
          if (p.key === 'lev') p.second = 0.16;
        }
        if (p.second > 0) { p.second -= h; if (p.second <= 0) this.shoot(p); }
      }
      if (p.key === 'stop') {
        if (p.arm > 0) {
          p.arm -= h;
          if (p.arm <= 0) this.float(p.x, p.y - 26, '止损单已生效', 'accent');
        } else {
          for (let j = 0; j < this.bears.length; j++) {
            const b = this.bears[j];
            if (b.row === p.row && b.leap <= 0 && Math.abs(b.x - p.x) < 38) {
              this.removePlant(p, 'used');
              this.explode(p.x + 14, p.y, 0, 78, def.boom);
              this.float(p.x, p.y - 34, '止损触发', 'accent');
              break;
            }
          }
        }
      } else if (p.key === 'sweep') {
        p.fuse -= h;
        if (p.fuse <= 0) { this.removePlant(p, 'used'); this.explode(p.x, p.y, 1, CFG.CW * 1.55, def.boom); }
      } else if (p.key === 'hedge') {
        p.life -= h;
        for (let j = this.bears.length - 1; j >= 0; j--) {
          const b = this.bears[j];
          if (b.row === p.row && b.leap <= 0 && Math.abs(b.x - p.x) < CFG.CW / 2) {
            b.hedged = 0.2;
            const keep = b.flash;
            this.hurt(b, def.dps * h);
            b.flash = keep;
          }
        }
        if (p.life <= 0) {
          this.removePlant(p, 'expired');
          this.expired++;
          this.float(p.x, p.y, '期权到期', 'dim');
        }
      }
    }
  };

  G.stepShots = function (h) {
    for (let i = this.shots.length - 1; i >= 0; i--) {
      const s = this.shots[i];
      s.x += 340 * h;
      let hit = null;
      for (let j = 0; j < this.bears.length; j++) {
        const b = this.bears[j];
        if (b.row === s.row && b.leap <= 0 && s.x >= b.x - 16 && s.x <= b.x + 22 && (!hit || b.x < hit.x)) hit = b;
      }
      if (hit) {
        this.shots.splice(i, 1);
        this.puff(s.x, s.y, s.slow ? 'ice' : 'spark', 3);
        this.hurt(hit, s.dmg, s.slow);
      } else if (s.x > CFG.W + 30) {
        this.shots.splice(i, 1);
      }
    }
  };

  G.blocker = function (b) {
    const row = this.grid[b.row];
    let best = null;
    for (let c = 0; c < CFG.COLS; c++) {
      const p = row[c];
      if (!p || p.key === 'hedge' || p.key === 'stop') continue;   // 止损单是挂在地上的委托，不挡路也不会被吃：生效前被吃掉曾让它几乎触发不了
      const d = b.x - p.x;
      if (d > -12 && d < 36 && (!best || p.x > best.x)) best = p;
    }
    return best;
  };
  G.stepBears = function (h) {
    const list = this.bears.slice();
    for (let i = 0; i < list.length; i++) {
      const b = list[i], def = b.def;
      if (this.bears.indexOf(b) < 0) continue;
      b.t += h;
      if (b.flash > 0) b.flash -= h;
      if (b.slowT > 0) b.slowT -= h;
      if (b.hedged > 0) b.hedged -= h;
      if (b.leap > 0) {
        b.leap -= h;
        b.x -= (CFG.CW * 1.3 / 0.5) * h;
        continue;
      }
      if (def.boss) {
        b.callT -= h;
        if (b.callT <= 0) {
          b.callT = 10;
          [b.row - 1, b.row + 1].forEach((r) => { if (r >= 0 && r < CFG.ROWS) this.spawnBear('profit', r, Math.min(CFG.W, b.x + 30)); });
          this.float(b.x, rowY(b.row) - 70, '对倒拉高', 'loss');
          this.news('庄家对倒拉高，跟风抛压出现在相邻泳道');
        }
      }
      const p = this.blocker(b);
      if (p) {
        if (def.vault && !b.vaulted && p.key !== 'value') {
          b.vaulted = true; b.leap = 0.5; b.eating = false;
          this.float(b.x, rowY(b.row) - 50, '抢跑', 'info');
          continue;
        }
        b.eating = true;
        p.hp -= def.eat * h * (p.key === 'lev' ? 2 : 1);
        p.flash = 0.08;
        if (p.hp <= 0) this.removePlant(p, 'eaten');
      } else {
        b.eating = false;
        b.x -= def.speed * (b.slowT > 0 ? 0.5 : 1) * (b.vaulted ? 0.75 : 1) * h;
      }
      if (b.x < CFG.GX - 26) this.breach(b);
      if (this.phase !== 'playing') return;
    }
  };
  G.breach = function (b) {
    const m = this.mowers[b.row];
    if (m.state === 'run') return;
    if (m.state === 'spent') { this.finish(false, this.laneName(b.row) + ' 被击穿，无人护盘，爆仓出局'); return; }
    m.state = 'run';
    this.breaches++;
    this.addEquity(-0.03);
    this.shake = 0.45;
    this.float(CFG.GX + 30, rowY(b.row) - 30, '击穿 -3%', 'loss');
    this.news('【护盘】' + this.laneName(b.row) + ' 被击穿，国家队入场，净值 -3%');
    this.emit('know', 'guard');
    this.emit('sfx', 'alarm');
  };
  G.stepMowers = function (h) {
    for (let r = 0; r < this.mowers.length; r++) {
      const m = this.mowers[r];
      if (m.state !== 'run') continue;
      m.x += 560 * h;
      this.bears.slice().forEach((b) => { if (b.row === r && Math.abs(b.x - m.x) < 44) this.kill(b, false); });
      if (this.rng() < 0.5) this.fx.push({ x: m.x - 20, y: rowY(r) + 20, vx: -60, vy: -20, t: 0, life: 0.4, kind: 'spark', r: 3 });
      if (m.x > CFG.W + 80) m.state = 'spent';
    }
  };
  G.stepDrops = function (h) {
    this.dropT -= h;
    if (this.dropT <= 0) {
      this.dropT = 7;
      this.spawnDrop(CFG.GX + 40 + this.rng() * (CFG.CW * CFG.COLS - 80), rowY(Math.floor(this.rng() * CFG.ROWS)), 25, 'sky');
    }
    for (let i = this.drops.length - 1; i >= 0; i--) {
      const d = this.drops[i];
      d.t += h;
      if (d.y < d.ty) d.y = Math.min(d.ty, d.y + 150 * h);
      if (d.t > d.life) this.collect(d);
    }
  };
  G.stepFx = function (h) {
    for (let i = this.fx.length - 1; i >= 0; i--) {
      const f = this.fx[i];
      f.t += h;
      f.x += f.vx * h; f.y += f.vy * h; f.vy += 160 * h;
      if (f.t >= f.life) this.fx.splice(i, 1);
    }
    for (let i = this.floats.length - 1; i >= 0; i--) {
      const f = this.floats[i];
      f.t += h; f.y -= 26 * h;
      if (f.t > 1.3) this.floats.splice(i, 1);
    }
  };

  /* ------------------------------------------------------------ 盘后点评 */
  G.review = function () {
    const out = [], u = this.used;
    const shooters = (u.buy || 0) + (u.buyback || 0) + (u.lev || 0);
    if (this.liquidations > 0) out.push('融资仓被强平 ' + this.liquidations + ' 次：杠杆放大的是波动，前面要有人扛，自己也要留足担保。');
    else if ((u.lev || 0) > 0) out.push('用了杠杆却没被强平：给融资仓配了防线，这就是“留足担保比例”。');
    if (this.breaches > 0) out.push('被击穿 ' + this.breaches + ' 次：防线过薄的泳道要么补仓位，要么提前挂好止损单。');
    else if (this.phase === 'won') out.push('全程没有泳道被击穿：仓位分配均衡，五条线都有人照看。');
    if ((u.div || 0) >= 4) out.push('红利ETF 建了 ' + u.div + ' 份：现金流打底，后面的选择会从容很多。');
    else if (shooters > 0 && (u.div || 0) <= 1) out.push('几乎没配红利资产：只进攻不留现金流，遇到连续下跌日会接不上。');
    if ((u.stop || 0) === 0 && this.level.cards.indexOf('stop') >= 0) out.push('整局没挂止损单：它只要 25 资金，是最便宜的风险控制。');
    if (this.expired > 0) out.push(this.expired + ' 份认沽到期作废：对冲是买保险，权利金就是保费，别等风险过了才买。');
    if (this.maxDD >= 0.09) out.push('最大回撤 ' + (this.maxDD * 100).toFixed(1) + '%：同样的收益，回撤越小越难得，先活下来再谈赚钱。');
    return out.slice(0, 4);
  };

  root.HG = { CFG: CFG, CARDS: CARDS, CARD_ORDER: CARD_ORDER, BEARS: BEARS, LEVELS: LEVELS, Game: Game,
    rowY: rowY, colX: colX, colAt: colAt, rowAt: rowAt, clamp: clamp, rng32: rng32 };
})(window);

  function spark(cv, ln) {
    if (!ln || !ln.bars || ln.bars.length < 2) return;
    const P = pal(), dpr = Math.min(window.devicePixelRatio || 1, 2), w = cv.clientWidth || 100, h = cv.clientHeight || 30;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const c = cv.getContext('2d'), bars = ln.bars, n = bars.length, span = (ln.hi - ln.lo) || 1;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const up = bars[n - 1].c >= bars[0].o, C = up ? P.gain.m : P.loss.m;
    c.beginPath();
    bars.forEach((b, i) => { const x = 1 + i / (n - 1) * (w - 2), y = h - 2 - (b.c - ln.lo) / span * (h - 4); if (i) c.lineTo(x, y); else c.moveTo(x, y); });
    c.strokeStyle = C; c.lineWidth = 1.5; c.lineJoin = 'round'; c.stroke();
    c.lineTo(w - 1, h); c.lineTo(1, h); c.closePath(); c.globalAlpha = 0.12; c.fillStyle = C; c.fill();
  }

  const TUT = [null,
    { card: 'div', text: '先攒钱。点上面的<b>【红利ETF】</b>，它会定期给你分红。' },

    if (market.state !== 'live') { toast('等待真实日线就绪'); return; }

  function tutAdvance() { if (!tut) return; tut.step++; if (tut.step >= TUT.length) endTutorial(); else placeGuide(); }
  function placeGuide() {
    document.querySelectorAll('.spot, .guide').forEach((n) => n.remove());
    if (!tut || screen !== 'play' || el.overlay.classList.contains('show')) return;
    const s = TUT[tut.step];
    let r;
    if (s.card) { const c = cardEls[s.card]; if (!c) return; r = c.b.getBoundingClientRect(); }
    else if (s.cell) { const cr = el.cv.getBoundingClientRect(), k = view.scale; r = { left: cr.left + view.ox + (CFG.GX + s.cell[1] * CFG.CW) * k, top: cr.top + view.oy + (CFG.GY + s.cell[0] * CFG.CH) * k, width: CFG.CW * k, height: CFG.CH * k }; }
    else { const e = laneEls[s.lane]; if (!e) return; r = e.b.getBoundingClientRect(); }
    r = { left: r.left, top: r.top, width: r.width, height: r.height, bottom: r.top + r.height };
    const spot = document.createElement('div'); spot.className = 'spot';
    spot.style.cssText = 'left:' + (r.left - 6) + 'px;top:' + (r.top - 6) + 'px;width:' + (r.width + 12) + 'px;height:' + (r.height + 12) + 'px';
    const g = document.createElement('div'); g.className = 'guide';
    g.innerHTML = '<div><b class="step">教练 · 第 ' + tut.step + ' / ' + (TUT.length - 1) + ' 步</b><p>' + s.text + '</p>' +
      (s.ok ? '<button class="btn primary" type="button" data-guide="ok" style="margin-top:8px;padding:6px 18px">开始守仓</button>' : '<button class="skip" type="button" data-guide="skip">跳过教学</button>') + '</div>';
    g.insertBefore(V.icon('card', 'buy', 46), g.firstChild);
    el.app.appendChild(spot); el.app.appendChild(g);
    const gw = g.offsetWidth, gh = g.offsetHeight, cx = r.left + r.width / 2;
    const left = Math.max(10, Math.min(window.innerWidth - gw - 10, cx - gw / 2)), below = r.top - gh - 22 < 8;
    g.style.left = left + 'px'; g.style.top = (below ? r.bottom + 22 : r.top - gh - 22) + 'px';
    g.style.setProperty('--ax', Math.max(24, Math.min(gw - 24, cx - left)) + 'px');
    if (below) g.classList.add('below');
  }

  function drain() {
    if (!game.events.length) return;
    const list = game.events.splice(0);
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (e.type === 'sfx') { if (SFX[e.data]) SFX[e.data](); }
      else if (e.type === 'news') news(e.data);
      else if (e.type === 'know') teach(e.data);
      else if (e.type === 'cash') { el.cash.classList.remove('bump'); void el.cash.offsetWidth; el.cash.classList.add('bump'); }
      else if (e.type === 'wave') {
        const w = e.data;
        banner(w.boss ? '庄家出货' : w.last ? '最后一个交易日' : '第 ' + w.day + ' 个交易日', (w.date ? w.date + ' · ' : '') + (w.last ? '尾盘抛压加重，守住就赢' : '抛压进场'), w.boss);
        paintLanes();
        if (game.laneState.some(Boolean)) teach('limit');
        if (w.day === 2) teach('drawdown');
      } else if (e.type === 'end') {
        const mine = runId;
        setTimeout(() => { if (mine === runId) showResult(e.data); }, 900);
      }

    const d = game.dropAt(p.x, p.y);

  });
  el.cv.addEventListener('pointerleave', () => { hover = null; });

    ev.preventDefault();
    if (game.phase !== 'playing') return;
    const p = toLogic(ev), row = rowAt(p.y), col = colAt(p.x);
    hover = { row: row, col: col };
    const d = game.dropAt(p.x, p.y);
    if (d) { game.collect(d); return; }
    if (row < 0 || row >= CFG.ROWS || col < 0 || col >= CFG.COLS) return;
    if (game.selling) {
      const back = game.sellAt(row, col);
      toast(back < 0 ? '这里没有持仓' : '已卖出，收回 ' + back + ' 资金');
      return;
    }
    if (tut) {
      const s = TUT[tut.step];
      if (!s.cell) { toast(s.card ? '先点上面发光的那张卡片' : '点气泡里的“开始守仓”'); return; }
      if (row !== s.cell[0] || col !== s.cell[1]) { toast('点发光的那一格'); return; }
    }
    if (!game.selected) { toast('先点上方卡片，再点盘面建仓'); return; }
    const why = game.why(game.selected, row, col);
    if (why) { toast(why); return; }
    game.place(game.selected, row, col);
    if (!ev.shiftKey || tut) game.selected = null;
    if (tut) tutAdvance();
  });

  el.cards.addEventListener('click', (ev) => {
    const b = ev.target.closest('.pcard');
    if (!b || game.phase !== 'playing') return;
    const key = b.dataset.key;
    if (tut) {
      const s = TUT[tut.step];
      if (s.card !== key) { toast(s.card ? '先点发光的【' + CARDS[s.card].name + '】' : s.cell ? '点盘面上发光的那一格' : '点气泡里的“开始守仓”'); return; }
      game.selling = false; game.selected = key; tutAdvance(); return;
    }
    game.selling = false;
    game.selected = game.selected === key ? null : key;
    if (game.selected) toast(CARDS[key].name + ' · ' + CARDS[key].desc);
  });
  el.lanes.addEventListener('click', async (ev) => {
    const b = ev.target.closest('.lane');
    if (!b || !b.dataset.code) return;
    if (!V.hasLumi()) { toast('当前快照暂无个股详情'); return; }
    pause();
    if (!(await V.openStock(b.dataset.code))) toast('个股页打开失败，稍后再试');
  });
  el.btnSell.addEventListener('click', () => {
    if (game.phase !== 'playing') return;
    game.selling = !game.selling; game.selected = null;
    toast(game.selling ? '卖出模式：点持仓卖出，收回 50% 成本' : '已退出卖出模式');
  });
  el.btnPause.addEventListener('click', () => { if (game.phase === 'playing') pause(); else resume(); });
  el.btnCodex.addEventListener('click', () => { if (game.phase === 'playing') game.pause(); showCodex(); });
  el.btnSound.addEventListener('click', () => { store.sound = !store.sound; V.saveStore(); paintSound(); if (store.sound) SFX.coin(); });
  el.btnHome.addEventListener('click', () => { if (game.phase === 'playing') pause(); else if (screen !== 'home') goHome(); });
  el.tip.addEventListener('click', (ev) => { if (ev.target.closest('[data-act="tip-x"]')) nextTip(); });

  el.panel.addEventListener('click', async (ev) => {
    const t = ev.target;
    const askEl = t.closest('.ask');
    if (askEl) { if (!V.ask(askEl)) toast('可在案例游廊继续探索'); return; }
    const watch = t.closest('.watch-btn');
    if (watch) {
      ev.stopPropagation();
      const r = await V.toggleWatch(watch);
      toast(r === null ? '自选操作失败' : r ? '已加入自选' : '已移出自选');
      return;
    }
    const opt = t.closest('.quiz-opt');
    if (opt) { answer(opt); return; }
    const stock = t.closest('[data-open]');
    if (stock) { if (!(await V.openStock(stock.dataset.open))) toast(V.hasLumi() ? '个股页打开失败，稍后再试' : '当前快照暂无个股详情'); return; }
    const lv = t.closest('[data-level]');
    if (lv && !lv.disabled) { showIntro(LEVELS.find((l) => l.id === Number(lv.dataset.level))); return; }
    const act = t.closest('[data-act]');
    if (!act) return;
    const a = act.dataset.act;
    if (act.disabled) return;
    if (a === 'start' || a === 'retry') { tut = null; startLevel(level); placeGuide(); }
    else if (a === 'resume') resume();
    else if (a === 'home') { tut = null; goHome(); }
    else if (a === 'codex') showCodex();
    else if (a === 'how') showHow(0, false);
    else if (a === 'howNext' || a === 'howPrev') showHow(howState.page + (a === 'howNext' ? 1 : -1), howState.first);
    else if (a === 'howClose') { if (game.phase === 'paused') showPause(); else showHome(); }
    else if (a === 'tutorial') startTutorial();
    else if (a === 'demo') { store.demo = !store.demo; V.saveStore(); showHome(true); toast(store.demo ? '演示模式已开：全部关卡解锁' : '演示模式已关'); }
    else if (a === 'refresh') {
      act.disabled = true; act.textContent = '刷新中…';
      await V.loadMarket().catch(() => V.pickLanes(0));
      if (screen === 'home') goHome();
      toast('已重新读取自选股与行情');
    }
    else if (a === 'back') { if (backTo === 'play' || backTo === 'pause') showPause(); else if (backTo === 'intro') showIntro(level); else if (backTo === 'result') goHome(); else showHome(); }
    else if (a === 'shuffle') {
      act.disabled = true; act.textContent = '换股中…';
      await V.pickLanes(market.offset + CFG.ROWS);
      if (screen === 'home') goHome();
    }
  });

  window.addEventListener('keydown', (ev) => {
    if (ev.target && /^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
    const k = ev.key;
    if (k === 'Escape') { if (game.phase === 'playing') clearPick(); return; }
    if (k === 'p' || k === 'P' || k === ' ') { if (game.phase === 'playing') { ev.preventDefault(); pause(); } else if (game.phase === 'paused' && screen === 'pause') { ev.preventDefault(); resume(); } return; }
    if (game.phase !== 'playing') return;
    if (k === 's' || k === 'S') { el.btnSell.click(); return; }
    const i = '123456789'.indexOf(k);
    if (i >= 0 && i < level.cards.length) { game.selling = false; game.selected = level.cards[i]; toast(CARDS[level.cards[i]].name + ' · ' + CARDS[level.cards[i]].desc); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  /* -------------------------------------------------------------- 主循环 */
  function frame(ts) {
    const dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0;
    lastTs = ts; T += dt;
    game.step(tut && tut.step <= 4 ? 0 : dt);   // 教学的前四步时间静止
    drain();
    drawWorld();
    renderHud();
    window.requestAnimationFrame(frame);
  }
  V.themeSubs.push(() => { buildCards(); if (screen === 'home') showHome(true); else if (screen === 'intro') showIntro(level); });

  resize();
  paintSound();
  buildCards();
  goHome();
  V.loadMarket().catch(() => V.pickLanes(0)).then(() => {
    if (!market.lanes.length) return V.pickLanes(0);
  }).then(() => {
    if (screen === 'home') { goHome(); if (!store.seen) showHow(0, true); }   // 第一次来，先看三页玩法引导
    else if (game.phase === 'idle') { game.lanes = market.lanes; buildLanes(); }
  });
  setInterval(() => {
    V.refreshQuotes().then((ok) => { if (!ok) return; paintLanes(); if (screen === 'home') showHome(true); });
  }, 20000);
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
