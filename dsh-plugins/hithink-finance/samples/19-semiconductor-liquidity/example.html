<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>半导体成交梯队 · 金融观察室</title><style>/* Original visual styles: 半导体资金梯队; financial-data scripts are not included. */

  :root{
    color-scheme: dark light;
    --tier-1: var(--widget-accent, #6366f1);
    --mono: "SF Mono", "JetBrains Mono", Consolas, "Microsoft YaHei", monospace;
    --subtle: color-mix(in srgb, var(--widget-text, #f0f0f4) 9%, transparent);
    --track: color-mix(in srgb, var(--widget-text, #f0f0f4) 7%, transparent);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--widget-bg, #111113);
    color:var(--widget-text, #f0f0f4);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
    font-size:12px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    display:flex;flex-direction:column;gap:10px;
    padding:12px 14px 18px;
    min-height:100%;
  }
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
  .up{color:var(--widget-gain, #ef4444)}
  .down{color:var(--widget-loss, #22c55e)}
  .flat{color:var(--widget-text-secondary, #92929e)}

  /* ---------- header ---------- */
  .hdr{
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    padding-bottom:8px;border-bottom:1px solid var(--widget-divider, #2c2c32);
  }
  .hdr-id{display:flex;align-items:baseline;gap:10px;min-width:0}
  .hdr-id h1{font-size:20px;line-height:1.1;margin:0;font-weight:600;letter-spacing:.5px}
  .hdr-id .sub{color:var(--widget-text-secondary, #92929e);font-size:11px}
  .hdr-id .code{font-family:var(--mono);color:var(--widget-text-faint, #55555f);font-size:11px}
  .hdr-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .stamp{color:var(--widget-text-faint, #55555f);font-size:11px;white-space:nowrap}
  .btn{
    height:26px;padding:0 12px;border-radius:4px;cursor:pointer;
    background:var(--widget-surface, #1a1a1e);
    border:1px solid var(--widget-border, #2c2c32);
    color:var(--widget-text, #f0f0f4);font-size:12px;font-family:inherit;
  }
  .btn:hover{background:var(--widget-surface-hover, #232329);border-color:var(--widget-border-strong, #42424c)}
  .btn:disabled{opacity:.5;cursor:default}

  /* ---------- kpi ---------- */
  .kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
  .kpi{
    background:var(--widget-card, #1a1a1e);
    border:1px solid var(--widget-border, #2c2c32);
    border-radius:6px;padding:8px 10px;min-width:0;
    display:flex;flex-direction:column;justify-content:space-between;
    min-height:66px;overflow:hidden;
  }
  .kpi .k{color:var(--widget-text-secondary, #92929e);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .v{font-size:19px;font-weight:600;line-height:1.25;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .s{color:var(--widget-text-faint, #55555f);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .v .u{font-size:11px;font-weight:400;color:var(--widget-text-secondary, #92929e);margin-left:2px}

  /* ---------- card ---------- */
  .card{
    background:var(--widget-card, #1a1a1e);
    border:1px solid var(--widget-border, #2c2c32);
    border-radius:6px;
    display:flex;flex-direction:column;min-width:0;
  }
  .card-hd{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:0 12px;min-height:34px;flex-shrink:0;
    border-bottom:1px solid var(--widget-divider, #2c2c32);
  }
  .card-hd h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.3px}
  .card-hd .hint{color:var(--widget-text-faint, #55555f);font-size:11px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- ladder ---------- */
  .ladder{padding:4px 12px 10px}
  .ladder-axis{position:relative;height:18px;margin-left:126px;margin-right:146px}
  .ladder-axis .tick{position:absolute;top:0;transform:translateX(-50%);color:var(--widget-text-faint, #55555f);font-size:10px;font-family:var(--mono)}
  .ladder-axis .zero{position:absolute;top:12px;bottom:-6px;width:1px;background:var(--widget-text-muted, #55555f);opacity:.5}
  .tier{
    display:grid;grid-template-columns:126px minmax(0,1fr) 146px;
    align-items:center;gap:0;
    border-top:1px solid var(--widget-divider, #2c2c32);
    padding:5px 0;cursor:pointer;border-radius:0;
  }
  .tier:first-of-type{border-top:0}
  .tier:hover{background:var(--widget-surface-hover, #232329)}
  .tier.on{background:var(--widget-accent-veil-16, rgba(99,102,241,.16))}
  .tier-id{display:flex;align-items:baseline;gap:6px;padding-right:10px;min-width:0}
  .tier-id b{font-size:13px;font-weight:600}
  .tier-id .n{color:var(--widget-text-secondary, #92929e);font-size:11px;font-family:var(--mono)}
  .tier-id .mv{display:block;color:var(--widget-text-faint, #55555f);font-size:10px}
  .tier-plot{position:relative;height:52px;border-left:1px solid var(--widget-border, #2c2c32);border-right:1px solid var(--widget-border, #2c2c32)}
  .tier-plot .zero{position:absolute;top:2px;bottom:2px;width:1px;background:var(--widget-text-muted, #55555f);opacity:.45}
  .dot{
    position:absolute;width:7px;height:7px;border-radius:50%;
    transform:translate(-50%,-50%);cursor:pointer;
    transition:transform .12s ease-out;
  }
  .dot:hover{transform:translate(-50%,-50%) scale(1.85);z-index:3}
  .dot.sel{outline:2px solid var(--widget-text, #f0f0f4);outline-offset:1px;z-index:2}
  .tier-stats{display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding-left:10px}
  .tier-stats .a{font-size:13px;font-weight:600}
  .tier-stats .b{color:var(--widget-text-secondary, #92929e);font-size:10px;font-family:var(--mono)}

  /* ---------- mid ---------- */
  .mid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:stretch}
  .mid > .card{height:100%}
  .bars{padding:8px 12px;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;flex:1;min-height:0;overflow:hidden}
  .bar-row{display:grid;grid-template-columns:66px minmax(0,1fr) 48px;align-items:center;gap:8px;height:15px}
  .bar-row .lab{color:var(--widget-text-secondary, #92929e);font-size:11px;text-align:right;font-family:var(--mono)}
  .bar-track{display:block;height:12px;background:var(--track);border-radius:2px;overflow:hidden;position:relative}
  .bar-fill{display:block;height:100%;border-radius:2px;min-width:2px}
  .bar-axis{position:absolute;top:0;bottom:0;left:50%;width:1px;background:color-mix(in srgb, var(--widget-text, #f0f0f4) 22%, transparent)}
  .bar-row .val{font-size:11px;text-align:right;color:var(--widget-text, #f0f0f4);font-family:var(--mono);white-space:nowrap}
  .reading{padding:4px 12px 6px;display:flex;flex-direction:column;gap:0;flex:1;min-height:0}
  .read-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:4px 0;min-height:26px;flex:1;border-bottom:1px dashed var(--widget-divider, #2c2c32)}
  .read-row:last-child{border-bottom:0}
  .read-row .k{color:var(--widget-text-secondary, #92929e);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .read-row .v{font-size:13px;font-weight:600;font-family:var(--mono);white-space:nowrap;flex-shrink:0}
  .read-note{margin-top:4px;padding:5px 8px;border-radius:4px;background:var(--subtle);color:var(--widget-text-secondary, #92929e);font-size:11px;line-height:1.4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

  /* ---------- bottom ---------- */
  .bottom{display:grid;grid-template-columns:minmax(0,1fr) 306px;gap:10px;align-items:stretch}
  .bottom > .card{min-height:508px;max-height:562px;overflow:hidden}
  .toolbar{display:flex;align-items:center;gap:6px;padding:7px 12px;border-bottom:1px solid var(--widget-divider, #2c2c32);flex-wrap:wrap}
  .chip{
    height:22px;padding:0 9px;border-radius:11px;cursor:pointer;font-size:11px;
    background:transparent;border:1px solid var(--widget-border, #2c2c32);
    color:var(--widget-text-secondary, #92929e);font-family:inherit;
  }
  .chip:hover{color:var(--widget-text, #f0f0f4);border-color:var(--widget-border-strong, #42424c)}
  .chip.on{background:var(--widget-accent-veline, rgba(99,102,241,.18));border-color:var(--widget-accent, #6366f1);color:var(--widget-text, #f0f0f4)}
  .search{
    margin-left:auto;height:22px;width:132px;padding:0 8px;border-radius:4px;
    background:var(--widget-surface, #1a1a1e);border:1px solid var(--widget-border, #2c2c32);
    color:var(--widget-text, #f0f0f4);font-size:11px;font-family:inherit;outline:none;
  }
  .search:focus{border-color:var(--widget-accent, #6366f1)}
  .tbl-wrap{flex:1;min-height:0;overflow:auto}
  table{width:100%;border-collapse:collapse}
  thead th{
    position:sticky;top:0;z-index:1;height:28px;
    background:var(--widget-surface, #1a1a1e);
    color:var(--widget-text-secondary, #92929e);
    font-size:11px;font-weight:400;text-align:right;
    padding:6px 8px;white-space:nowrap;cursor:pointer;user-select:none;
    border-bottom:1px solid var(--widget-divider, #2c2c32);
  }
  thead th:first-child,thead th:nth-child(2){text-align:left}
  thead th:hover{color:var(--widget-text, #f0f0f4)}
  thead th.sorted{color:var(--widget-accent, #6366f1)}
  tbody td{
    padding:0 8px;height:26px;text-align:right;font-family:var(--mono);
    font-size:11.5px;border-bottom:1px solid var(--widget-divider-strong, #232329);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  tbody td:first-child,tbody td:nth-child(2){text-align:left;font-family:inherit}
  tbody tr{cursor:default}
  tbody tr:hover{background:var(--widget-surface-hover, #232329)}
  tbody tr.sel{background:var(--widget-accent-veil-16, rgba(99,102,241,.16))}
  tbody tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--widget-accent, #6366f1)}
  .nm{display:flex;align-items:center;gap:5px;max-width:112px;overflow:hidden;cursor:pointer}
  .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .12s}
  .nm:hover span:first-child{color:var(--widget-accent, #6366f1);text-decoration:underline;text-underline-offset:2px}
  .badge{font-size:9px;padding:0 3px;border-radius:2px;border:1px solid var(--widget-border-strong, #42424c);color:var(--widget-text-secondary, #92929e);font-family:inherit;flex-shrink:0}
  .tier-tag{font-size:10px;color:var(--widget-text-secondary, #92929e);font-family:inherit;white-space:nowrap}

  /* ---------- detail ---------- */
  .detail{padding:8px 12px 10px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:auto}
  .d-name{display:flex;align-items:baseline;gap:6px;flex-wrap:nowrap;overflow:hidden;height:24px;flex-shrink:0}
  .d-name b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .d-name .c{font-family:var(--mono);color:var(--widget-text-faint, #55555f);font-size:11px;flex-shrink:0}
  .d-price{display:flex;align-items:baseline;gap:8px;height:34px;flex-shrink:0;overflow:hidden}
  .d-price .p{font-size:24px;font-weight:600;font-family:var(--mono)}
  .d-price .pct{font-size:13px;font-family:var(--mono)}
  .d-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 8px}
  .d-item{background:var(--subtle);border-radius:4px;padding:4px 7px;min-width:0;height:38px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  .d-item .k{color:var(--widget-text-faint, #55555f);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .d-item .v{font-size:12.5px;font-family:var(--mono);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .d-rank{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
  .rank-row{display:flex;align-items:center;gap:6px;height:14px}
  .rank-row .k{color:var(--widget-text-secondary, #92929e);font-size:10px;width:70px;flex-shrink:0;white-space:nowrap}
  .rank-track{display:block;flex:1;min-width:0;height:6px;background:var(--track);border-radius:3px;overflow:hidden}
  .rank-fill{display:block;height:100%;background:var(--widget-accent, #6366f1);border-radius:3px;opacity:.85}
  .rank-row .v{font-family:var(--mono);font-size:11px;width:42px;text-align:right;flex-shrink:0;white-space:nowrap}
  .d-foot{color:var(--widget-text-faint, #55555f);font-size:10.5px;line-height:1.45;flex-shrink:0}
  .mini-charts{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .mini-chart{border:1px solid var(--widget-divider, #2c2c32);border-radius:4px;padding:4px 7px 3px;height:84px;
    display:flex;flex-direction:column;overflow:hidden}
  .mc-hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:1px;height:16px;flex-shrink:0}
  .mc-hd b{font-size:11px;font-weight:600}
  .mc-hd span{font-size:10px;color:var(--widget-text-faint, #55555f);font-family:var(--mono)}
  .mini-chart svg{display:block;width:100%;height:58px;flex:1;min-height:0}
  .mc-empty{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;color:var(--widget-text-faint, #55555f);font-size:10.5px}

  /* ---------- states ---------- */
  .state{
    display:none;align-items:center;gap:8px;padding:8px 12px;border-radius:4px;
    background:var(--subtle);
    border:1px solid var(--widget-border, #2c2c32);
    color:var(--widget-text-secondary, #92929e);font-size:11.5px;
  }
  .state.show{display:flex}
  .state .dotled{width:6px;height:6px;border-radius:50%;background:var(--widget-text-faint, #55555f);flex-shrink:0}
  .state.warn .dotled{background:var(--widget-warning, #f59e0b)}
  .state.err .dotled{background:var(--widget-danger, #ef4444)}
  .loading-veil{opacity:.45;transition:opacity .15s}
  .foot{margin-left:auto;color:var(--widget-text-faint, #55555f);font-size:10.5px}
  .empty-cell{padding:26px 12px;text-align:center;color:var(--widget-text-faint, #55555f);font-size:11.5px}
  @media (max-width:1180px){
    .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
    .mid{grid-template-columns:minmax(0,1fr)}
    .bottom{grid-template-columns:minmax(0,1fr)}
    .bottom > .card{min-height:0;max-height:none}
    .bottom .tbl-wrap{max-height:400px}
  }


/* ============================================================
   ACTIVE COLOR THEMES
   与 `src/renderer/theme/registry.ts` 中 `ThemeId` / `THEMES` 一致。
   默认 Zinc 基底 + registry.ts 注册的五套产品主题。
   ============================================================ */

:root {
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 8px;
  --radius-s: 6px;
  --radius-m: 8px;
  --radius-l: 12px;
  --motion-duration-fast: 0.12s;
  --motion-duration-base: 0.2s;
  --motion-duration-slow: 0.3s;
  --motion-duration-ripple: 0.6s;
  --motion-ease-enter: ease-out;
  --motion-ease-exit: ease-in;
  --motion-ease-move: ease-in-out;
  --motion-distance: 16px;
  --motion-scale-from: 0.9;
  --motion-opacity-from: 0;
  --gain: var(--red, #ef4444);
  --loss: var(--green, #22c55e);

  /* 未知或缺失宿主 data-theme 时，与 HostTheme 的 dark 回退一致。 */
  --bg: #111113;
  --surface: #1a1a1e;
  --border: #2c2c32;
  --border-hi: #42424c;
  --text: #f0f0f4;
  --text-dim: #92929e;
  --text-faint: #55555f;
  --accent: #6366f1;
  --accent-dim: #2e3073;
  --green: #22c55e;
  --red: #ef4444;
  --comment: #666672;

  /* 设计稿 Token 模块的未知主题深色回退。 */
  --text-1: var(--text);
  --text-2: color-mix(in srgb, var(--text) 92%, #ffffff);
  --text-3: var(--text-dim);
  --text-4: var(--text-faint);
  --text-5: color-mix(in srgb, var(--text-faint) 72%, var(--bg));
  --text-6: var(--accent);
  --text-7: color-mix(in srgb, var(--accent) 82%, var(--text));
  --border-1: var(--border);
  --border-2: color-mix(in srgb, var(--border) 65%, var(--surface));
  --border-3: var(--border-hi);
  --border-4: color-mix(in srgb, var(--border) 40%, transparent);
  --border-5: color-mix(in srgb, var(--bg) 90%, var(--text));
  --fill-1: var(--border-hi);
  --fill-2: var(--border);
  --fill-3: color-mix(in srgb, var(--surface) 65%, var(--bg));
  --fill-4: var(--surface);
  --fill-5: color-mix(in srgb, var(--surface) 50%, var(--text));
  --fill-6: color-mix(in srgb, var(--bg) 55%, #000000);
  --background-1: var(--bg);
  --background-2: var(--surface);
  --background-3: color-mix(in srgb, var(--surface) 88%, var(--text));
  --background-4: color-mix(in srgb, var(--bg) 78%, #000000);
  --background-5: color-mix(in srgb, var(--accent) 22%, var(--bg));
  --brand-1: var(--accent);
  --brand-2: color-mix(in srgb, var(--accent) 88%, #ffffff);
  --brand-3: color-mix(in srgb, var(--accent) 72%, #000000);
  --brand-4: color-mix(in srgb, var(--accent) 48%, var(--bg));
  --brand-5: color-mix(in srgb, var(--accent) 28%, var(--bg));
  --brand-6: var(--accent-dim);
  --rise-1: var(--red);
  --rise-2: color-mix(in srgb, var(--red) 88%, #ffffff);
  --rise-3: color-mix(in srgb, var(--red) 72%, #000000);
  --rise-4: color-mix(in srgb, var(--red) 35%, var(--bg));
  --rise-5: color-mix(in srgb, var(--red) 18%, var(--bg));
  --fall-1: var(--green);
  --fall-2: color-mix(in srgb, var(--green) 88%, #ffffff);
  --fall-3: color-mix(in srgb, var(--green) 72%, #000000);
  --fall-4: color-mix(in srgb, var(--green) 35%, var(--bg));
  --fall-5: color-mix(in srgb, var(--green) 18%, var(--bg));
  --equal-1: var(--text-dim);
  --success-1: color-mix(in srgb, var(--green) 55%, #36ddd8);
  --success-2: color-mix(in srgb, var(--green) 72%, #00c6d1);
  --success-3: color-mix(in srgb, var(--green) 58%, #00a9b2);
  --success-4: color-mix(in srgb, var(--green) 32%, var(--bg));
  --success-5: color-mix(in srgb, #36ddd8 25%, var(--bg));
  --warning-1: #f59e0b;
  --warning-2: #f6aa28;
  --warning-3: #b07208;
  --warning-4: color-mix(in srgb, #f59e0b 35%, var(--bg));
  --warning-5: color-mix(in srgb, #f59e0b 18%, var(--bg));
  --danger-1: var(--red);
  --danger-2: color-mix(in srgb, var(--red) 90%, #ffffff);
  --danger-3: color-mix(in srgb, var(--red) 75%, #000000);
  --danger-4: color-mix(in srgb, var(--red) 38%, var(--bg));
  --danger-5: color-mix(in srgb, var(--red) 20%, var(--bg));
  --link-1: var(--accent);
  --link-2: color-mix(in srgb, var(--accent) 90%, #ffffff);
  --link-3: color-mix(in srgb, var(--accent) 75%, #000000);
  --link-4: color-mix(in srgb, var(--accent) 45%, var(--bg));
  --link-5: color-mix(in srgb, var(--accent) 25%, var(--bg));

  --lumi-tag-red: color-mix(in srgb, var(--danger-3) 18%, transparent);
  --lumi-tag-blue: color-mix(in srgb, var(--brand-2) 12%, transparent);
  --lumi-tag-yellow: color-mix(in srgb, var(--warning-3) 15%, transparent);
  --lumi-input-bg: color-mix(in srgb, var(--fill-3) 40%, transparent);
  --lumi-input-bg-2: color-mix(in srgb, var(--fill-3) 70%, transparent);
  --lumi-hover: color-mix(in srgb, var(--text-2) 6%, transparent);
  --lumi-click: color-mix(in srgb, var(--text-2) 10%, transparent);
  --lumi-card-bg-1: color-mix(in srgb, var(--background-2) 60%, transparent);

/*
 * 融合侧栏 Figma [2458:4147]：直接用语义 token —— Background 3 → --background-3；
 * Fill 1|2 → --fill-1 / --fill-2；Text 2|3|4 → --text-2 / --text-3 / --text-4。
 *
 * 2026-07-20 起**不再有 --fusion-text-* / --fusion-bg-* / --fusion-fill-* 这层别名**：
 * 它只有融合壳吃得到，且曾把 ifind 的正文色错取成「主按钮白字」造成白底白字、
 * 把 aviator 辅助字错取成「不可用文本」档。皮肤差异一律由语义 token 在各主题块的取值表达
 * （见 renderer.md 样式铁律第 3 条与 OPEN-QUESTIONS Q26）。
 * 同时移除的还有 brush-* 中间层（31 个变量，全部只在本文件内部转接、组件从未直接消费）。
 */

     放在语义层后所有组件都取对色（见 renderer.md 样式铁律第 3 条）。 */
  --text-2: #eeeff0;
  --text-3: #b4b6b8;

  --text-4: #808286;

}

 if(!k)return;switch(k){case'native-width':S.nativeWidth=Number(el.value);break;case'native-height':S.nativeHeight=Number(el.value);break;case'navigate':location.href=el.value+'.html';return;case'direction':S.direction=el.value;break;case'event-tag':S.eventTag=el.value;break;case'etf-min':S.etfMin=Number(el.value)||0;break;case'etf-window':S.etfWindow=el.value;break;case'etf-trend':S.etfTrend=el.checked;break;case'pattern-window':S.patternWindow=Number(el.value);S.patternMatches=[];break;case'structure-code':S.structure=el.value;break;case'future-plate':S.futuresPlate=el.value;break;default:return;}render();});
let inputTimer;document.addEventListener('input',e=>{const el=e.target;if(el.id==='noteText'){store.set('draft:'+board.id,el.value);return;}if(['sector-search','limit-search','event-search'].includes(el.dataset.control)){clearTimeout(inputTimer);const pos=el.selectionStart;inputTimer=setTimeout(()=>{S.search=el.value;render();const next=document.querySelector(`[data-control="${el.dataset.control}"]`);next?.focus();next?.setSelectionRange(pos,pos);},220);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if((e.key==='Enter'||e.key===' ')&&e.target.dataset.sort){e.preventDefault();e.target.click();}if(e.key==='Enter'&&e.target.id==='watchSearch')document.querySelector('[data-action=watch-search]')?.click();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(refreshTimer);else schedule();});
window.addEventListener('pagehide',()=>{clearTimeout(refreshTimer);destroyCharts();});
async function init(){if(!board)return;if(boot.mode==='dynamic'){try{const res=await fetch('/api/state?board='+board.id);if(!res.ok)throw new Error('无法读取本地数据包');D=await res.json();window.BOARD_DATA=D;if(store.get('watch',null)===null&&!S.watch.length)S.watch=D.watchCodes||[];}catch(e){document.getElementById('app').innerHTML=empty('无法打开动态看板',e.message+'；请在完整交付包运行 npm start。');return;}}render();schedule();const deepCode=new URLSearchParams(location.search).get('code');if(board.id==='watch'&&/^[0-9]{6}\.(SH|SZ|BJ)$/.test(deepCode||''))openStock(deepCode);}
init();
})();
</script></body></html>
