<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>手绘形态检索 · 金融观察室</title><style>/* Original visual styles: 手绘形态选股; financial-data scripts are not included. */

﻿:root{
  --lumi-bg:#0b0f14; --lumi-panel:#121821; --lumi-panel2:#0f141c; --lumi-line:#22303f;
  --lumi-fg:#e8eef6; --lumi-mute:#8ba0b6; --lumi-mute2:#61748a;
  --lumi-up:#f0524d; --lumi-down:#2ea043; --lumi-accent:#4c8dff; --lumi-warn:#d29922; --lumi-err:#f85149; --lumi-ok:#3fb950;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--lumi-bg);color:var(--lumi-fg)}
body{font:14px/1.65 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
.mono{font-family:Consolas,"Cascadia Mono",monospace}
.small{font-size:12px}
.sub{color:var(--lumi-mute);font-size:12px}
b,strong{font-weight:600}

.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0d131b 0%,#0b0f14 100%);
  border-bottom:1px solid var(--lumi-line);padding:14px 22px 0}
.row1{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:34px;height:34px;border-radius:8px;background:#1d2b3f;color:var(--lumi-accent);
  display:grid;place-items:center;font-weight:700}
h1{font-size:16px;margin:0;letter-spacing:.3px}
.brand .sub{margin:2px 0 0}
.controls{display:flex;gap:10px;align-items:center}
.field{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--lumi-mute)}
select{background:var(--lumi-panel);color:var(--lumi-fg);border:1px solid var(--lumi-line);border-radius:6px;
  padding:6px 10px;font-size:13px}
button{background:#1a2431;color:var(--lumi-fg);border:1px solid var(--lumi-line);border-radius:6px;
  padding:6px 12px;font-size:12px;cursor:pointer}
button:hover{border-color:var(--lumi-accent)}

.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--lumi-line);color:var(--lumi-mute)}
.chip.idle{color:var(--lumi-mute)}
.chip.busy{color:var(--lumi-accent);border-color:#2d4a76;background:#122033}
.chip.ok{color:var(--lumi-ok);border-color:#1f5130;background:#0f1d15}
.chip.warn{color:var(--lumi-warn);border-color:#5a4415;background:#1d1809}
.chip.err{color:var(--lumi-err);border-color:#5d1f1c;background:#1e0f0e}

.metaGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px 18px;
  padding:12px 0 10px;border-top:1px dashed var(--lumi-line);margin-top:12px}
.metaGrid>div{display:flex;gap:8px;align-items:baseline;min-width:0}
.metaGrid span{color:var(--lumi-mute2);font-size:12px;white-space:nowrap}
.metaGrid b{font-size:12px;font-weight:500;color:#cfdcea;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--lumi-line);color:var(--lumi-mute)}
.tag.ok{color:var(--lumi-ok);border-color:#1f5130}
.taskHint{color:var(--lumi-warn);font-size:12px;min-height:16px}
.fallback{margin:6px 0;padding:8px 10px;border:1px solid #5a4415;background:#1d1809;
  color:var(--lumi-warn);border-radius:6px;font-size:12px}

.nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 0}
.tab{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid transparent;
  border-bottom:2px solid transparent;border-radius:6px 6px 0 0;padding:9px 14px;color:var(--lumi-mute)}
.tab:hover{color:var(--lumi-fg);background:#131a24}
.tab.active{color:var(--lumi-fg);background:var(--lumi-panel);border-color:var(--lumi-line);border-bottom-color:var(--lumi-accent)}
.tab .tabTag{font-size:10px;padding:0 6px;border-radius:999px;border:1px solid var(--lumi-line);color:var(--lumi-mute2)}
.tab.todo .tabName{color:#7f93a8}
.tab.active .tabTag{border-color:#2d4a76;color:#8fb4e8}

.view{padding:18px 22px 28px;display:flex;flex-direction:column;gap:16px}
.view>section{min-width:0}
.cards{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.panel{background:var(--lumi-panel);border:1px solid var(--lumi-line);border-radius:10px;padding:16px}
.head{grid-column:1/-1;display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.head h2{font-size:15px;margin:0}
.headBadges{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--lumi-panel2);border:1px solid var(--lumi-line);border-radius:10px;padding:14px 16px}
.card.warnCard{border-color:#4a3a12}
.cardLabel{color:var(--lumi-mute);font-size:12px}
.cardValue{font-size:30px;font-weight:600;letter-spacing:.5px;line-height:1.25;margin:6px 0 2px;
  font-variant-numeric:tabular-nums}
.cardValue .unit{font-size:13px;color:var(--lumi-mute);margin-left:6px;font-weight:400}
.cardSub{font-size:12px;color:#b9c8d8}
.cardScope{font-size:11px;color:var(--lumi-mute2);margin-top:4px}
.cardWarn{font-size:11px;color:var(--lumi-warn);margin-top:6px;border-top:1px dashed #4a3a12;padding-top:6px}

.panelHead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.panelHead h3{font-size:13px;margin:0;color:#cddcec}
table.grid{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.grid th{font-size:11px;color:var(--lumi-mute2);text-align:left;font-weight:500;
  border-bottom:1px solid var(--lumi-line);padding:6px 4px}
table.grid td{font-size:13px;padding:6px 4px;border-bottom:1px dashed #1b2531}
table.grid .num{text-align:right}
table.grid tfoot td{font-weight:600;border-top:1px solid var(--lumi-line);border-bottom:none}
.dir{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--lumi-line)}
.dir.up{color:var(--lumi-up);border-color:#5a2320}
.dir.down{color:var(--lumi-down);border-color:#1f5130}
.dir.flat{color:var(--lumi-mute)}

.kv{margin:0;display:grid;grid-template-columns:96px 1fr;gap:8px 12px}
.kv dt{color:var(--lumi-mute2);font-size:12px}
.kv dd{margin:0;font-size:12px;color:#cfdcea}
.check{display:inline-block;margin:2px 6px 2px 0;font-size:11px}
.check.ok{color:var(--lumi-ok)}
.check.err{color:var(--lumi-err)}
.srcList,.gapList{margin:0;padding-left:0;list-style:none;display:grid;gap:8px}
.srcList li{border-left:2px solid #2b3b4d;padding-left:10px;font-size:12px}
.url{color:var(--lumi-mute);font-size:11px;word-break:break-all;margin:2px 0}
.gapList li{font-size:12px;color:#c2d0de}
.gapList b{color:#e3ecf6}

.empty h2{font-size:15px;margin:0 0 6px}
.empty ul{margin:8px 0 0;padding-left:18px;color:#c2d0de;font-size:13px}
.loading{color:var(--lumi-mute);grid-column:1/-1}

.foot{border-top:1px solid var(--lumi-line);padding:12px 22px;display:flex;gap:16px;flex-wrap:wrap;
  color:var(--lumi-mute2);font-size:11px}
@media (max-width:980px){.view{grid-template-columns:1fr}}


/* ---- 16 图看板 ---- */
.ctrl{display:flex;flex-direction:column;gap:10px;padding:12px 16px}
.ctrlRow{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.ctrlRow.custom{justify-content:flex-start;gap:16px}
.ctrlRow.custom input[type=date]{background:var(--lumi-panel2);color:var(--lumi-fg);border:1px solid var(--lumi-line);border-radius:6px;padding:4px 8px;font-size:12px}
.seg{display:flex;gap:4px;background:var(--lumi-panel2);border:1px solid var(--lumi-line);border-radius:8px;padding:3px}
.segBtn{background:transparent;border:none;color:var(--lumi-mute);padding:5px 12px;border-radius:6px;font-size:12px}
.segBtn:hover{color:var(--lumi-fg);background:#182231}
.segBtn.on{background:#1d3a63;color:#cfe2ff}
.ctrlRight{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--lumi-mute)}
.cursorDate{font-family:Consolas,monospace;color:#cfe2ff;min-width:88px;text-align:center}
.check{display:flex;align-items:center;gap:6px;color:var(--lumi-mute);cursor:pointer}
.chartGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.chartCard{background:var(--lumi-panel);border:1px solid var(--lumi-line);border-radius:10px;padding:10px 12px 8px;
  display:flex;flex-direction:column;gap:6px;min-width:0}
.chartCard.disabled{opacity:.72;border-style:dashed}
.ccHead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ccGroup{font-size:10px;color:var(--lumi-mute2);border:1px solid var(--lumi-line);border-radius:999px;padding:0 6px}
.ccHead h4{font-size:12px;margin:0;font-weight:500;color:#cfdcea}
.ccVal{margin-left:auto;font-size:16px;font-variant-numeric:tabular-nums;color:#e8eef6}
.ccVal i{font-style:normal;font-size:10px;color:var(--lumi-mute);margin-left:3px}
.ccBody{position:relative;height:92px;cursor:crosshair}
.chartCard.disabled .ccBody{cursor:default}
.spark{width:100%;height:100%;display:block}
.noData{height:100%;display:grid;place-items:center;color:var(--lumi-mute2);font-size:11px;
  border:1px dashed var(--lumi-line);border-radius:6px;background:#0d131b}
.ccFoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10px;color:var(--lumi-mute2)}
.unavail{color:var(--lumi-warn)}
.legend{display:flex;align-items:center;gap:4px;color:var(--lumi-mute)}
.legend .dash{width:14px;height:0;border-top:1px dashed var(--lumi-warn);display:inline-block}
.detail{padding:14px 16px}
.headActions{display:flex;align-items:center;gap:12px}
.tableWrap{max-height:420px;overflow:auto;border:1px solid var(--lumi-line);border-radius:8px}
.tableWrap thead th{position:sticky;top:0;background:#131a24;z-index:1}
table.grid tr.cur td{background:#122033}
.metaPanel{padding:14px 16px}
.metaPanel .kv{grid-template-columns:110px 1fr}

/* ---- 情绪周期 ---- */
.up{color:var(--lumi-up)}
.down{color:var(--lumi-down)}
.flat{color:var(--lumi-mute)}
.sentStack{display:flex;flex-direction:column;gap:16px}
.sentBanner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--lumi-panel);
  border:1px solid var(--lumi-line);border-left:3px solid var(--lumi-accent);border-radius:8px;padding:10px 14px;font-size:12px}
.sentBanner b{font-size:14px}
.sentBanner .sub{margin-left:auto}
.sentPanel{padding:14px 16px}
.sentChart{width:100%;height:auto;display:block}
.sentChart .gridline{stroke:#1b2531;stroke-width:1}
.sentChart .axis{fill:var(--lumi-mute2);font-size:10px}
.sentChart .cursorLine{stroke:var(--lumi-accent);stroke-width:1;stroke-dasharray:3 3;opacity:.8}
.legendRow{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--lumi-mute);margin-top:6px}
.legendRow .lg{display:flex;align-items:center;gap:5px}
.legendRow .lg i{width:12px;height:3px;border-radius:2px;display:inline-block}
table.grid.sent td{vertical-align:top}
table.grid.compact td,table.grid.compact th{font-size:12px}
.tableWrap.tall{max-height:360px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chipStock{display:inline-flex;align-items:center;gap:5px;background:#16202c;border:1px solid var(--lumi-line);
  border-radius:6px;padding:2px 7px;font-size:12px;color:#cfe0f2;cursor:pointer;line-height:1.5}
.chipStock:hover{border-color:var(--lumi-accent);color:#e8f2ff}
.chipStock i{font-style:normal;font-size:10px;color:var(--lumi-mute2)}
.chipStock b{font-weight:400;font-size:10px;color:var(--lumi-mute);font-family:Consolas,monospace}
.lvl{font-weight:600;color:#dbe8f6;white-space:nowrap}
tr.gapRow td{background:#1a1408}
.gapNote{color:var(--lumi-warn);font-size:11px}
.fbSummary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}
.fbSummary>div{background:var(--lumi-panel2);border:1px solid var(--lumi-line);border-radius:8px;padding:8px 10px;
  display:flex;flex-direction:column;gap:2px}
.fbSummary span{font-size:11px;color:var(--lumi-mute2)}
.fbSummary b{font-size:16px;font-variant-numeric:tabular-nums}
.promoWrap{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
.promoBig{display:flex;flex-direction:column;gap:2px;min-width:150px}
.promoBig b{font-size:30px;color:#e8eef6}
.promoBig span{font-size:11px;color:var(--lumi-mute2)}
.stateGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.stateCard{background:var(--lumi-panel2);border:1px solid var(--lumi-line);border-radius:10px;padding:12px 14px;
  display:flex;flex-direction:column;gap:8px}
.stateCard.main{border-color:#2f4f7a;box-shadow:inset 0 0 0 1px #1d3a63}
.stateCard.low{opacity:.86}
.stateHead{display:flex;align-items:center;gap:8px}
.stateHead b{font-size:14px}
.tagState{font-size:10px;border:1px solid var(--lumi-line);border-radius:999px;padding:1px 7px;color:var(--lumi-mute)}
.stateCard.main .tagState{color:#8fb4e8;border-color:#2d4a76}
.tagAI{font-size:10px;border:1px dashed #5a4415;border-radius:999px;padding:1px 7px;color:var(--lumi-warn);margin-left:auto}
.evRow{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start}
.evRow ul{margin:0;padding-left:16px;font-size:12px;color:#c2d0de}
.evRow li{margin:1px 0}
.evTag{font-size:10px;border-radius:4px;padding:1px 5px;text-align:center}
.evTag.plus{background:#1f2d1c;color:#7ee787}
.evTag.minus{background:#2d1c1c;color:#ff9d96}
.evTag.unk{background:#22262b;color:#9aa7b4}
.eventList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.eventList li{display:grid;grid-template-columns:86px 110px 1fr;gap:10px;font-size:12px;
  border-left:2px solid #2b3b4d;padding-left:10px;align-items:baseline}
.evDate{font-family:Consolas,monospace;color:var(--lumi-mute2);font-size:11px}
.evType{color:#8fb4e8}
.eventList .sub{grid-column:1/-1;font-size:11px}
.noteBox{width:100%;min-height:64px;background:var(--lumi-panel2);color:var(--lumi-fg);border:1px solid var(--lumi-line);
  border-radius:8px;padding:8px 10px;font-size:12px;resize:vertical;font-family:inherit}
.noteRow{display:flex;align-items:center;gap:10px;margin-top:8px}
.tagInline{display:inline-block;font-size:11px;border:1px solid var(--lumi-line);border-radius:4px;
  padding:0 6px;margin:1px 4px 1px 0;color:#c2d0de}
.kModal{position:fixed;inset:0;background:rgba(4,8,12,.72);display:grid;place-items:center;z-index:50;padding:20px}
.kModal[hidden]{display:none}
.kBox{background:var(--lumi-panel);border:1px solid var(--lumi-line);border-radius:12px;padding:14px 16px;
  width:min(900px,96vw);max-height:88vh;overflow:auto}
.kHead{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.kHead b{font-size:14px}
.kHead button{margin-left:auto}
.kChart{width:100%;height:auto;display:block}
.kChart .gridline{stroke:#1b2531}
.kChart .axis{fill:var(--lumi-mute2);font-size:10px}
.tierMore{display:inline-block;font-size:11px;color:var(--lumi-mute)}
.tierMore summary{cursor:pointer;color:#8fb4e8;padding:2px 0}
.tierMore .chips{margin-top:4px}

/* 板块雷达 */
.radarStack{display:flex;flex-direction:column;gap:12px}
.radarIntro h2{margin:0 0 2px;font-size:17px}
.radarStats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:12px 0}
.radarStats>div{background:var(--lumi-panel2);border:1px solid var(--lumi-line);border-radius:9px;padding:9px 11px;display:flex;flex-direction:column;gap:3px}
.radarStats>div>span{font-size:11px;color:var(--lumi-mute2)}
.radarStats>div>b{font-size:17px;color:#e7f0fb;font-variant-numeric:tabular-nums}
.radarStats>div>small{font-size:10px;color:var(--lumi-mute);line-height:1.45}
.radarBanner{display:flex;gap:10px;align-items:flex-start;background:#1a1408;border:1px solid #4a3a15;border-radius:8px;padding:8px 10px;margin:6px 0}
.radarHint{line-height:1.6}
.radarCtrlRow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rTabs{display:flex;gap:4px;background:var(--lumi-panel2);border:1px solid var(--lumi-line);border-radius:8px;padding:3px;flex-wrap:wrap}
.rTab{border:1px solid transparent;background:transparent;color:var(--lumi-mute);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
.rTab i{font-style:normal;font-size:10px;color:var(--lumi-mute2);margin-left:5px}
.rTab.active{background:#182334;color:#e7f0fb;border-color:#2d4a76}
.rTab.small{padding:2px 8px;font-size:11px}
.radarSearch{flex:1;min-width:210px;background:var(--lumi-panel2);color:var(--lumi-fg);border:1px solid var(--lumi-line);border-radius:6px;padding:7px 10px;font-size:12px}
.radarCap{font-size:11px;color:var(--lumi-mute);display:flex;align-items:center;gap:6px}
.radarTip{position:absolute;z-index:4;width:230px;background:#101823;border:1px solid #2d4a76;border-radius:8px;padding:8px 10px;font-size:11px;line-height:1.55;color:#c9d6e4;box-shadow:0 8px 24px #0008;pointer-events:none}
.radarTip b{color:#fff}
.scatterWrap{position:relative;width:100%;min-height:380px;background:linear-gradient(180deg,#0e141d,#0b1017);border:1px solid var(--lumi-line);border-radius:8px;overflow:hidden}
.scatterWrap canvas{display:block}
.radarTableWrap{max-height:520px}
.radarTable td{white-space:nowrap}
.radarTable th{cursor:pointer;user-select:none;white-space:nowrap}
.radarTable th.sorted{color:#9fc3ff}
.radarTable th.sorted[data-dir="desc"]::after{content:" ↓"}
.radarTable th.sorted[data-dir="asc"]::after{content:" ↑"}
.radarTable tr[data-id]{cursor:pointer}
.radarTable tr[data-id]:hover td{background:#16202c}
.rName{font-weight:600;color:#dbe8f6}
.rCode{display:block;font-size:9px;color:var(--lumi-mute2);letter-spacing:.2px}
.stateTag{display:inline-block;font-size:10px;border:1px solid var(--lumi-line);border-radius:999px;padding:1px 7px;white-space:nowrap}
.leadCell{max-width:160px;overflow:hidden;text-overflow:ellipsis}
.miniTag{display:inline-block;font-style:normal;font-size:9px;border:1px solid #2d4a76;color:#8fb4e8;border-radius:3px;padding:0 4px;margin:1px 2px 1px 0;white-space:nowrap}
.miniTag.hot{border-color:#6b2c28;color:#ff9b96;background:#241110}
.miniTag.lb{border-color:#5a4415;color:#e3b341;background:#1d1809}
.noRow{text-align:center;color:var(--lumi-mute2);padding:18px 0}
.detailHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.detailHead h2{margin:0;font-size:18px}
.detailStats{margin:8px 0 14px}
.detailGrid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin:8px 0 12px}
.stateEvidence{background:var(--lumi-panel2);border:1px dashed var(--lumi-line);border-radius:8px;padding:9px 10px;font-size:12px;line-height:1.6;color:#c9d6e4}
.auditBox{background:#121a13;border:1px solid #1f5130;border-radius:8px;padding:10px 12px;margin:10px 0;font-size:12px;line-height:1.65}
.auditBox b{color:#8edb9d}
.auditBox p{margin:4px 0}
.lbBox{background:var(--lumi-panel2);border:1px solid var(--lumi-line);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbChip{background:#16202c;border:1px solid var(--lumi-line);color:#dbe8f6;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer}
.lbChip:hover{border-color:var(--lumi-accent)}
.lbChip i{font-style:normal;color:#e3b341;margin:0 3px}
.stockBtn{background:none;border:none;color:#cfe2ff;padding:0;font-size:12px;cursor:pointer;text-decoration:underline dotted #3a4a5c;text-underline-offset:3px}
.stockBtn:hover{color:#fff}
.tags{line-height:1.7}
.memberHead{margin-top:14px}

.covGrid span{font-size:10px;color:var(--lumi-mute2)}
.covGrid b{font-size:13px;color:#dbe8f6}
.covGrid small{font-size:10px;color:var(--lumi-mute);line-height:1.5}
.filterBox,.missingBox{background:var(--lumi-panel2);border:1px solid var(--lumi-line);border-radius:8px;padding:9px 11px;margin:8px 0;font-size:11px;line-height:1.6}

.missingBox ul{margin:4px 0 0;padding-left:18px;color:#c2d0de}
.missingBox li{margin:2px 0}

/* ---- AI 每日复盘 ---- */
.reviewRoot{display:flex;flex-direction:column;gap:16px}
.rvHead h2{font-size:17px;margin:0 0 4px}
.rvHeadRow{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.rvHeadBadges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rvMetaGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;
  border-top:1px dashed var(--lumi-line);margin-top:12px;padding-top:10px}
.rvMetaGrid>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.rvMetaGrid span{color:var(--lumi-mute2);font-size:11px}
.rvMetaGrid b{font-size:12px;font-weight:500;color:#cfdcea;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rvLayout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.rvMain{display:flex;flex-direction:column;gap:16px;min-width:0}
.rvAside{display:flex;flex-direction:column;gap:16px;position:sticky;top:132px}
.rvControl{display:flex;flex-direction:column;gap:10px}
.rvControlRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button.primary{background:#1d3a63;border-color:#2d5a95;color:#dcecff}
button.primary:hover{background:#244a7c}
.rvNote{display:flex;gap:8px;align-items:center;color:var(--lumi-mute);font-size:12px;flex:1;min-width:240px}
.rvNote input{flex:1;background:var(--lumi-panel2);border:1px solid var(--lumi-line);border-radius:6px;color:var(--lumi-fg);
  padding:6px 9px;font-size:12px;min-width:180px}
.rvProgress{display:flex;flex-direction:column;gap:8px}
.rvSteps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rvStep{display:grid;grid-template-columns:24px 180px 1fr;gap:8px;align-items:center;
  font-size:12px;color:var(--lumi-mute);border-bottom:1px dashed #1b2531;padding:5px 0}
.rvStep:last-child{border-bottom:none}
.rvStepDot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--lumi-line);color:var(--lumi-mute2);font-size:11px}
.rvStep.running{color:#cfe2ff}
.rvStep.running .rvStepDot{border-color:var(--lumi-accent);color:var(--lumi-accent);animation:rvPulse 1s infinite}
.rvStep.ok{color:#bfe3c8}
.rvStep.ok .rvStepDot{border-color:#1f5130;background:#0f1d15;color:var(--lumi-ok)}
.rvStep.failed{color:#ffb3ae}
.rvStep.failed .rvStepDot{border-color:#5d1f1c;background:#1e0f0e;color:var(--lumi-err)}
.rvStepDetail{color:var(--lumi-mute2);font-family:Consolas,monospace;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes rvPulse{0%,100%{opacity:.45}50%{opacity:1}}
.rvFail{border-color:#5d1f1c;background:#1b1112}
.rvFailHead{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.rvFail p{margin:4px 0;font-size:13px;color:#ffd6d3}
.rvFailText{color:var(--lumi-err);font-size:12px}
.rvWarnText{color:var(--lumi-warn)}
.rvEmpty h3{font-size:15px;margin:0 0 6px}
.rvEmpty ul{margin:8px 0 12px;padding-left:18px;color:#c2d0de;font-size:12px}
.rvEmpty button{margin-top:4px}
.rvNotice{border:1px solid #2d4a76;background:#122033;color:#cfe2ff;border-radius:8px;padding:8px 11px;font-size:12px}
.rvNotice.warn{border-color:#5a4415;background:#1d1809;color:#e3b341}
.rvNotice button{margin-left:8px;padding:2px 8px;font-size:11px}
.rvReport{display:flex;flex-direction:column;gap:16px}
.rvHeadline{border-color:#2d4a76;background:linear-gradient(180deg,#111c2b 0%,#121821 100%)}
.rvHeadlineTop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.rvHeadlineText{font-size:18px;line-height:1.65;margin:0 0 10px;color:#f0f6ff;font-weight:600}
.rvType{display:inline-flex;align-items:center;border-radius:4px;padding:1px 7px;font-size:11px;border:1px solid var(--lumi-line);white-space:nowrap}
.rvType.fact{color:#8fd3a4;border-color:#1f5130;background:#0f1d15}
.rvType.analysis{color:#9fc4ff;border-color:#2d4a76;background:#122033}
.rvType.pending{color:#e3b341;border-color:#5a4415;background:#1d1809}
.rvChanges{display:grid;gap:10px}
.rvChange{display:flex;gap:12px;align-items:flex-start;background:var(--lumi-panel2);border:1px solid var(--lumi-line);border-radius:8px;padding:10px 12px}
.rvChangeNo{font-size:22px;font-weight:700;color:#35506e;font-family:Consolas,monospace;line-height:1.1;min-width:30px}
.rvChangeBody{flex:1;min-width:0}
.rvSections{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.rvSection.pending{border-style:dashed;opacity:.9}
.rvSectionNote{font-size:12px;color:#d8c9a8;background:#1d1809;border:1px solid #4a3a12;border-radius:6px;padding:6px 9px;margin:0 0 8px}
.rvItem{border-top:1px dashed #1b2531;padding:9px 0 2px}
.rvItem:first-of-type{border-top:none}
.rvItemHead{display:flex;gap:8px;align-items:center;margin-bottom:5px}
.rvItemNo{font-size:10px;color:var(--lumi-mute2);font-family:Consolas,monospace}
.rvText{margin:0 0 6px;font-size:13px;line-height:1.7;color:#e2ebf5}
.rvRefs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:5px 0}
.rvRefsTag{font-size:10px;color:var(--lumi-mute2);margin-right:2px}
.evChip{font-family:Consolas,monospace;font-size:10px;line-height:1.4;padding:1px 5px;border-radius:4px;
  border:1px solid #2b3b4d;background:#131c27;color:#8fb4e8;cursor:pointer}
.evChip:hover{border-color:var(--lumi-accent);color:#dcecff}
.rvCounter{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;font-size:12px;line-height:1.6;
  color:#b9a77c;background:#171407;border-left:2px solid #5a4415;border-radius:4px;padding:5px 8px;margin:6px 0 2px}
.rvCounterTag{font-size:10px;border:1px solid #5a4415;border-radius:999px;padding:0 6px;color:#e3b341;white-space:nowrap}
.rvCounter .rvRefs{margin:0}
.rvEvent{border-top:1px dashed #1b2531;padding:9px 0 2px}
.rvEvent:first-of-type{border-top:none}
.rvEventType{font-size:10px;color:var(--lumi-mute2);border:1px solid var(--lumi-line);border-radius:999px;padding:0 6px}
.rvChecks{display:grid;gap:10px}
.rvCheck{display:flex;gap:12px;background:var(--lumi-panel2);border:1px solid var(--lumi-line);border-radius:8px;padding:10px 12px}
.rvCheckNo{font-size:20px;font-weight:700;color:#35506e;font-family:Consolas,monospace;line-height:1.1;min-width:28px}
.rvCheckHead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.rvCheck p{margin:2px 0;font-size:13px;color:#e2ebf5}
.rvCheckBase{font-size:12px;color:var(--lumi-mute);margin:4px 0}
.rvCheckBase b{color:#e3b341;font-family:Consolas,monospace}
.rvSources{display:grid;gap:8px}
.rvSource{background:var(--lumi-panel2);border:1px solid var(--lumi-line);border-radius:8px;padding:8px 10px;border-left-width:3px}
.rvSource.ok{border-left-color:#1f5130}
.rvSource.miss{border-left-color:#5a4415}
.rvSourceTop{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px}
.rvSourceMeta{font-size:10px;color:var(--lumi-mute2);margin-top:3px;word-break:break-all}
.rvHistory{display:grid;gap:6px;max-height:340px;overflow:auto}
.rvVersion{display:grid;grid-template-columns:44px 1fr;gap:2px 6px;text-align:left;background:var(--lumi-panel2);
  border:1px solid var(--lumi-line);border-radius:7px;padding:7px 9px}
.rvVersion.active{border-color:#2d5a95;background:#122033}
.rvVersionNo{grid-row:1/3;font-family:Consolas,monospace;color:#8fb4e8;font-size:12px;align-self:center}
.rvVersionMain{font-size:11px;color:#dbe8f6}
.rvVersionSub{font-size:10px;color:var(--lumi-mute2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rvStorageBox{display:flex;flex-direction:column;gap:5px}
.rvStorageBox p{margin:0}
.rvStorageLine{font-size:12px;color:#dbe8f6}
.rvBreak{word-break:break-all}
.rvDrawer{position:fixed;inset:0;z-index:60;background:rgba(3,7,11,.68);display:grid;place-items:center;padding:20px}
.rvDrawer[hidden],.rvProgress[hidden]{display:none !important}
.rvDrawerBox{width:min(620px,100%);background:var(--lumi-panel);border:1px solid var(--lumi-line);border-radius:12px;
  padding:16px 18px;max-height:82vh;overflow:auto;box-shadow:0 18px 60px rgba(0,0,0,.5)}
.rvDrawerHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rvDrawerHead h3{margin:0;font-size:14px}
.rvDrawerId{font-size:12px;color:#8fb4e8;margin-bottom:10px}
.rvDrawerVal{font-size:18px;color:#f0f6ff;font-family:Consolas,monospace}
.rvDrawerActions{display:flex;gap:8px;margin-top:12px}
.rvDrawer .kv{grid-template-columns:88px 1fr}
.rvDrawer .kv dd{word-break:break-all}
.rvItem.flash,.rvHeadline.flash,.rvEvent.flash{animation:rvFlash 1.3s ease}
@keyframes rvFlash{0%,100%{background:transparent}30%{background:#1d3a63}}
@media (max-width:1100px){.rvLayout{grid-template-columns:1fr}.rvAside{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
@media (max-width:700px){.rvSections{grid-template-columns:1fr}.rvStep{grid-template-columns:24px 1fr}.rvStepDetail{display:none}}

/* ---- 盘后概览看板 ---- */
html{scroll-behavior:smooth}

.overviewWrap{display:flex;flex-direction:column;gap:16px}
.dashHero{display:flex;flex-direction:column;gap:14px}

.asOf{font-size:11px;color:var(--lumi-mute2);font-family:Consolas,monospace;white-space:nowrap}
.secFoot{font-size:11px;color:var(--lumi-mute2);margin-top:10px;line-height:1.6;border-top:1px dashed #1b2531;padding-top:7px}

.zeroName{display:flex;flex-direction:column;line-height:1.3;min-width:0}

.zeroName span{font-size:9px;color:var(--lumi-mute2);font-family:Consolas,monospace}
.zeroTrack{position:relative;height:18px;background:#0d131b;border:1px solid #1b2531;border-radius:3px;overflow:hidden}
.zeroMid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#3a4b5f}

.zeroMeta{display:flex;gap:10px;justify-content:flex-end;font-size:10px;color:var(--lumi-mute2);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.pvPanel{padding:14px 16px}

/* Lumi 宿主适配层：在黑色背景上提高对比度，统一图表与文字的颜色、字号。
   仅覆盖颜色、边框、字号与图表网格，不改变布局结构。 */

:root {
  --lumi-bg: #0d131a;
  --lumi-panel: #171f2b;
  --lumi-panel2: #1c2634;
  --lumi-line: #34485e;
  --lumi-fg: #f3f8fe;
  --lumi-mute: #b9cadc;
  --lumi-mute2: #9fb4c9;
  --lumi-up: #ff6b63;
  --lumi-down: #45d07b;
  --lumi-accent: #64a8ff;
  --lumi-warn: #f0b429;
  --lumi-err: #ff7b72;
  --lumi-ok: #4ade80;
  --grid: #2c3d50;
}

html {
  background: #0d131a !important;
  color-scheme: dark;
}

body.lumi-standalone {
  background: #0d131a !important;
  color: var(--lumi-fg) !important;
  font-size: 14px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

.lumiPageRoot {
  min-height: 100vh;
  background: var(--lumi-bg);
  color: var(--lumi-fg);
}

/* 顶部与面板：用更亮的表面把内容从纯黑背景里分离出来 */
.topbar {
  background: linear-gradient(180deg, #141d28 0%, #101822 100%);
  border-bottom: 1px solid var(--lumi-line);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .28);
}

.panel, .chartCard, .card {
  background: var(--lumi-panel);
  border-color: var(--lumi-line);
}

.card { background: var(--lumi-panel2); }

select, button {
  background: #223044;
  border-color: #3c5269;
  color: var(--lumi-fg);
}

select:hover, button:hover { border-color: var(--lumi-accent); }

button.primary, .primary {
  background: #1f4f8f;
  border-color: #3d7fd9;
  color: #ffffff;
}

button.primary:hover, .primary:hover { background: #2660ab; border-color: #64a8ff; }

.metaGrid { border-top-color: #2b3a4b; }
.metaGrid b { color: #e4eefb; }

.sub, .secSub, .metaGrid span, .metaGrid b, .rvMetaGrid span, .rvMetaGrid b,
.legendRow, .shapeLegend, .cardSub, .cardScope, .cardLabel, .kv dt, .kv dd,
table.grid th, .asOf, .noData {
  color: var(--lumi-mute);
}

.metaGrid span, .rvMetaGrid span, .cardScope, .asOf, .chartGroupRow span {
  color: var(--lumi-mute2);
}

table.grid th { color: #a9bed3; font-weight: 600; }
table.grid td { border-bottom-color: #253444; }
table.grid tbody tr:hover td { background: #1b2635; }

.panelHead h3, .chartGroupRow b, .historyHead h2 { color: #e8f1fb; }

.dir.up { color: var(--lumi-up); border-color: #6b2a26; }
.dir.down { color: var(--lumi-down); border-color: #1f5d38; }
.dir.flat { color: var(--lumi-mute2); }

.chip { color: var(--lumi-mute); border-color: var(--lumi-line); }
.chip.ok { color: var(--lumi-ok); border-color: #23663f; background: #10231a; }
.chip.warn { color: var(--lumi-warn); border-color: #6b5218; background: #221b09; }
.chip.err { color: var(--lumi-err); border-color: #6f2622; background: #240f0e; }
.chip.busy { color: var(--lumi-accent); border-color: #33587f; background: #132235; }

.tag { color: var(--lumi-mute); border-color: var(--lumi-line); }
.tag.ok { color: var(--lumi-ok); border-color: #23663f; }

.fallback { border-color: #6b5218; background: #221b09; color: var(--lumi-warn); }

.gapBox {
  color: #f0d9a4;
  background: #241d0b;
  border-color: #6b5218;
  font-size: 12px;
}

/* 图表：网格线、坐标文字、画布底色 */
.pvGridLine { stroke: var(--grid); }
.sentChart .gridline, .kChart .gridline { stroke: var(--grid); }
.sentChart .axis, .kChart .axis { fill: #a9bed3; font-size: 11px; }
.pvAxis { fill: #9fb4c9; font-size: 10px; }
.pvCursor { stroke: #dbe8f7; }

.spark { overflow: visible; }
.kpiSpark { opacity: .95; }

.scatterWrap {
  background: linear-gradient(180deg, #141d28, #101822);
  border-color: var(--lumi-line);
}

.canvasWrap {
  background: #0d131a;
  border-color: var(--lumi-line);
}

.canvasHint { color: #a8bfd6; font-size: 12px; }

.zeroAxis { color: var(--lumi-mute2); font-size: 11px; }
.zeroAxis b { color: var(--lumi-accent); }
.pvLegend { color: var(--lumi-mute2); font-size: 11px; }

.legendRow { font-size: 12px; }

/* 记录与说明类小字统一提亮 */
.secFoot, .foot, .rvStorageLine, .chartNote { color: var(--lumi-mute); }

.foot { border-top: 1px solid var(--lumi-line); color: var(--lumi-mute); }

/* 滚动条与选区，避免在黑色宿主里看不见 */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: #0d131a; }
::-webkit-scrollbar-thumb { background: #33475c; border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: #45607c; }
::selection { background: #2b5d9e; color: #ffffff; }

/* 宿主提供浅色主题时的显式分支（需宿主在根节点标记 data-lumi-theme="light"） */
html[data-lumi-theme="light"],
body.lumi-light {
  background: #f6f8fb !important;
  color: #1a2432 !important;
  color-scheme: light;
}

html[data-lumi-theme="light"] .lumiPageRoot,
body.lumi-light .lumiPageRoot {
  background: #f6f8fb;
  color: #1a2432;
}

html[data-lumi-theme="light"] .panel,
html[data-lumi-theme="light"] .chartCard,
body.lumi-light .panel,
body.lumi-light .chartCard {
  background: #ffffff;
  border-color: #d8e1ec;
}

html[data-lumi-theme="light"] .card,
body.lumi-light .card { background: #f2f6fa; border-color: #d8e1ec; }

html[data-lumi-theme="light"] .topbar,
body.lumi-light .topbar {
  background: linear-gradient(180deg, #ffffff 0%, #f2f6fa 100%);
  border-bottom-color: #d8e1ec;
  box-shadow: 0 4px 14px rgba(15, 30, 50, .08);
}

html[data-lumi-theme="light"] .sub,
html[data-lumi-theme="light"] .secSub,
html[data-lumi-theme="light"] .metaGrid span,
html[data-lumi-theme="light"] .metaGrid b,
html[data-lumi-theme="light"] table.grid th,
html[data-lumi-theme="light"] .asOf,
body.lumi-light .sub,
body.lumi-light .secSub,
body.lumi-light .metaGrid span,
body.lumi-light .metaGrid b,
body.lumi-light table.grid th,
body.lumi-light .asOf {
  color: #4a6178;
}

html[data-lumi-theme="light"] .metaGrid b,
html[data-lumi-theme="light"] .panelHead h3,
body.lumi-light .metaGrid b,
body.lumi-light .panelHead h3 { color: #1f2d3d; }

html[data-lumi-theme="light"] .pvGridLine,
html[data-lumi-theme="light"] .sentChart .gridline,
html[data-lumi-theme="light"] .kChart .gridline,
body.lumi-light .pvGridLine,
body.lumi-light .sentChart .gridline,
body.lumi-light .kChart .gridline { stroke: #dde5ee; }

html[data-lumi-theme="light"] .pvAxis,
html[data-lumi-theme="light"] .sentChart .axis,
html[data-lumi-theme="light"] .kChart .axis,
body.lumi-light .pvAxis,
body.lumi-light .sentChart .axis,
body.lumi-light .kChart .axis { fill: #52667c; }

html[data-lumi-theme="light"] .scatterWrap,
html[data-lumi-theme="light"] .canvasWrap,
body.lumi-light .scatterWrap,
body.lumi-light .canvasWrap { background: #ffffff; border-color: #d8e1ec; }

/* 宿主样式可能命中通用类名；关键表面提高优先级，保证在黑色宿主中始终可读 */
.lumiPageRoot .panel,
.lumiPageRoot .chartCard,
.lumiPageRoot .card,
.lumiPageRoot .detail,
.lumiPageRoot .metaPanel {
  background: var(--lumi-panel) !important;
  border-color: var(--lumi-line) !important;
}

.lumiPageRoot .card { background: var(--lumi-panel2) !important; }

.lumiPageRoot table.grid td { color: var(--lumi-fg); }
.lumiPageRoot table.grid th { color: #bed0e2; }

.lumiPageRoot .ccHead h4 { color: #f2f7fd; }
.lumiPageRoot .ccFoot { color: #a9bed3; }

/* 行情统计：信息密度高，字号与图表高度单独放大，避免在黑色宿主中发灰看不清 */
body[data-page="market"], body[data-page="multi"] { font-size: 15px; }
body[data-page="market"], body[data-page="multi"] h1 { font-size: 18px; }
body[data-page="market"], body[data-page="multi"] .metaGrid span,
body[data-page="market"], body[data-page="multi"] .metaGrid b { font-size: 13px; }
body[data-page="market"], body[data-page="multi"] .cardValue { font-size: 34px; }
body[data-page="market"], body[data-page="multi"] .cardLabel { font-size: 13px; }
body[data-page="market"], body[data-page="multi"] .cardSub { font-size: 13px; }
body[data-page="market"], body[data-page="multi"] .chartGrid { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
body[data-page="market"], body[data-page="multi"] .ccHead h4 { font-size: 14px; }
body[data-page="market"], body[data-page="multi"] .ccGroup { font-size: 11px; }

body[data-page="market"], body[data-page="multi"] .ccBody { height: 112px; }
body[data-page="market"], body[data-page="multi"] .ccFoot { font-size: 12px; color: #a9bed3; }
body[data-page="market"], body[data-page="multi"] table.grid td { font-size: 14px; }
body[data-page="market"], body[data-page="multi"] table.grid th { font-size: 12px; }
body[data-page="market"], body[data-page="multi"] .secSub,
body[data-page="market"], body[data-page="multi"] .secFoot { font-size: 12.5px; color: #b3c6d8; }
body[data-page="market"], body[data-page="multi"] .chartGroupRow b { font-size: 14px; }
body[data-page="market"], body[data-page="multi"] .chartGroupRow span { font-size: 12px; }

/* 顶部与表头在长页面滚动时保持不透明，避免文字与黑底混在一起 */
.lumiPageRoot .topbar { backdrop-filter: none; }
.lumiPageRoot .tableWrap thead th { background: #1d2836; color: #d6e4f2; }

.ivChip{margin-left:6px;padding:1px 8px;font-size:11px;line-height:1.6;border-radius:999px;border:1px solid #3d7fd9;background:#16304f;color:#a9c9ff;cursor:pointer;vertical-align:middle}

.ivHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}

.ivSrc{font-size:11px;color:#9fb4c9;border:1px solid #34485e;border-radius:999px;padding:2px 8px}

.ivSummary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}

.ivSummary span{font-size:11px;color:#9fb4c9}
.ivSummary b{font-size:16px;color:#f2f7fd}
.ivChart{width:100%;height:auto;display:block;background:#0f1721;border:1px solid #2c3d50;border-radius:8px}
.ivGrid{stroke:#2c3d50;stroke-width:1}
.ivAxis{fill:#a9bfd6;font-size:10px;font-family:Consolas,monospace}
.ivVol{fill:#3c5a7d;opacity:.8}
.ivLoading,.ivGap{padding:30px 18px;text-align:center;color:#b3c6d8;font-size:13px;line-height:1.8}
.lumiPageRoot .boardRow .bName{display:flex;align-items:center;gap:2px;flex-wrap:wrap}

function breadth(rows){const v=rows.filter(r=>valid(r.price_change_ratio_pct));const up=v.filter(r=>r.price_change_ratio_pct>0).length,down=v.filter(r=>r.price_change_ratio_pct<0).length,flat=v.length-up-down;return {up,down,flat,total:v.length,missing:rows.length-v.length,html:`<div class="breadth"><div class="breadth-up" style="flex:${up||.001}">${up>0?up:''}</div><div class="breadth-flat" style="flex:${flat||.001}">${flat>100?flat:''}</div><div class="breadth-down" style="flex:${down||.001}">${down>0?down:''}</div></div><div class="legend"><span style="--c:#d03e4c">上涨 ${up}</span><span style="--c:#a0afc0">平盘 ${flat}</span><span style="--c:#168270">下跌 ${down}</span><span>缺失 ${rows.length-v.length}</span></div>`};}
function constituentRows(code){const s=(D.sectors||[]).find(s=>s.thscode===code),m=stockMap();return(s?.members||[]).map(x=>({...x,...(m.get(x.thscode)||{})}));}
function noteWidget(key){const notes=store.get('notes:'+key,[]);return panel('我的观察',`<div class="note-box"><textarea id="noteText" placeholder="记下观察、待验证条件或复盘结论…">${E(store.get('draft:'+key,''))}</textarea><div class="controls" style="margin-top:10px">${button('save-note','保存笔记',key)}${button('export-notes','导出笔记',key)}</div><div class="note-list">${notes.length?notes.map((x,i)=>`<div class="note"><small>${date(x.time,true)}</small><button data-action="delete-note" data-value="${key}:${i}">删除</button><p>${E(x.text)}</p></div>`).join(''):'<small>笔记保存在当前浏览器，不上传。</small>'}</div></div>`,'本机保存');}
function futureRows(){return(D.futures||[]).filter(r=>S.futuresPlate==='全部'||r.plate===S.futuresPlate);}
function gameAttrs(r){return{attack:Math.round(20+Math.min(10,Math.abs(r.price_change_ratio_pct||0))*5),guard:Math.round(60-Math.min(20,r.amplitude||0)*2),energy:Math.round(30+Math.min(70,Math.log10(Math.max(1,r.turnover||1))*7))};}
function sourcePanel(){const rows=(D.sources||[]).filter(x=>board.groups.includes(x.group));const failed=rows.filter(x=>['error','stale'].includes(x.status));return `<details class="source-summary"><summary>数据来源与口径 · ${rows.length} 项请求记录${failed.length?' · '+failed.length+' 项待更新':''}</summary><p>仅使用 hithink-finance。页面生成时间 ${date(boot.generatedAt,true)}；数据包生成时间 ${date(D.updatedAt,true)}。表中“响应时点”是上游响应中的 timestamp，不承诺等于每个字段的发生时间；日线、年报和资讯分别显示自身日期。静态版不会自动联网。</p><div class="table-wrap"><table><thead><tr><th>能力</th><th>接口</th><th>响应时点</th><th>本地取数</th><th>状态</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${E(r.id)}</td><td>${E(r.endpoint)}</td><td>${date(r.upstreamTime,true)}</td><td>${date(r.fetchedAt,true)}</td><td>${E(r.status)}${r.error?' / '+E(r.error):''}</td></tr>`).join('')}</tbody></table></div><p style="margin-top:12px">${E(board.decision)}</p><p>信息展示与研究用途，不构成投资建议。互动实验的游戏属性与收益为虚拟设定。</p></details>`;}
function destroyCharts(){for(const x of charts){try{x.observer.disconnect();window.GalleryKlineChart.dispose(x.el);}catch{}}charts=[];}
function render(){if(!board)return;const scroll=window.scrollY;destroyCharts();V.resetPlots?.();const meta=window.NativeBoards.meta[board.id];document.documentElement.dataset.theme=['watch','futures'].includes(board.id)?'light':'dark';document.body.className='native n-'+board.id+' '+(['watch','futures'].includes(board.id)?'native-light':'native-dark');['bg','panel','text','muted','accent'].forEach((key,i)=>document.body.style.setProperty('--nf-'+key,meta[i+1]));document.getElementById('app').innerHTML=window.NativeBoards.render({D,S,board,boot,E,n,pct,money,date,valid,cls,stock,name,history,kline,button,table,baseCols,retcol,noteWidget,breadth,F,V,constituentRows,sourcePanel,store,refreshing});V.mountPlots?.();mountCharts();if(board.id==='pattern')mountDrawing();if(scroll)window.scrollTo(0,scroll);}
function mountCharts(scope=document){scope.querySelectorAll('[data-kline]').forEach(el=>{const code=el.dataset.kline,kind=el.dataset.kind,a=history(code,kind).slice(-180);if(!a.length){el.innerHTML=empty('日线尚未保存',boot.mode==='static'?'本次离线快照没有该标的历史。':'点击更新，或在详情中加载日线。');return;}if(!window.GalleryKlineChart){el.innerHTML=V.line([{name:name(code),points:a.map(x=>[x.time,x.close])}],{height:230,unit:'图表库未加载；收盘线预览'});return;}try{const c=window.GalleryKlineChart.init(el,{timezone:'Asia/Shanghai',dateFormat:'YYYY-MM-DD',locale:'zh-CN',disableAnalytics:true,styles:{candle:{type:'candle_solid',tooltip:{showRule:'follow_cross'},bar:{upColor:'#d03e4c',downColor:'#168270',noChangeColor:'#8293a5',upBorderColor:'#d03e4c',downBorderColor:'#168270',upWickColor:'#d03e4c',downWickColor:'#168270'}},grid:{horizontal:{color:document.body.classList.contains('native-light')?'#edf1f5':'#263141'},vertical:{color:document.body.classList.contains('native-light')?'#edf1f5':'#263141'}},xAxis:{tickText:{color:document.body.classList.contains('native-light')?'#7b8695':'#8c98a8'}},yAxis:{tickText:{color:document.body.classList.contains('native-light')?'#7b8695':'#8c98a8'}}}});c.applyNewData(a.map(r=>({...r,timestamp:r.time})));try{c.createIndicator({name:'MA',calcParams:[20,60]},true,{paneId:'candle_pane'});if(!el.classList.contains('small'))c.createIndicator('VOL');}catch{}const observer=new ResizeObserver(()=>c.resize());observer.observe(el);charts.push({el,c,observer});}catch{el.innerHTML=V.line([{name:name(code),points:a.map(x=>[x.time,x.close])}],{height:230,unit:'K线组件暂不可用；收盘线预览'});}});}
let toastTimer;function toast(t){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.append(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),4000);}
function download(file,content,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function closeDrawer(){document.querySelector('.drawer-back')?.remove();document.querySelector('.drawer')?.remove();}
function showDrawer(title,html){closeDrawer();const back=document.createElement('div');back.className='drawer-back';back.dataset.action='close';const d=document.createElement('section');d.className='drawer';d.setAttribute('role','dialog');d.setAttribute('aria-label',title);d.innerHTML=`<div class="top"><h2>${E(title)}</h2><button class="close" data-action="close" aria-label="关闭详情">×</button></div>${html}`;document.body.append(back,d);d.querySelector('button').focus();return d;}
async function openStock(code){const r=stock(code),kind=(D.etfs||[]).some(x=>x.thscode===code)?'etf':(D.futures||[]).some(x=>x.thscode===code)?'futures':'stock';S.selected=code;let h=history(code,kind);if(!h.length&&boot.mode==='dynamic'&&kind==='stock'){showDrawer(r.name,empty('正在读取日线',code));try{const res=await fetch('/api/history?code='+encodeURIComponent(code));const json=await res.json();if(!res.ok)throw new Error(json.error||'历史接口失败');D.history??={};D.history[code]=json.bars;h=json.bars;}catch(e){toast('日线加载失败：'+e.message);}}
 const m=F.metrics(h),noteText=kind==='futures'?'期货价格单位按该合约规则；涨跌幅相对前收。':kind==='etf'?'ETF场内价格，日线按接口原口径。':'A股快照为当前价格，日线使用前复权。';const el=showDrawer(r.name||code,`<p class="description">${E(code)} · ${E(noteText)}</p><div style="margin-top:20px">${strip([['最新价格',n(r.last_price),kind==='futures'?r.quoteKind||'':'报价单位：元'],['当日涨跌',pct(r.price_change_ratio_pct),'快照读数',cls(r.price_change_ratio_pct)],['20日涨幅',pct(m.ret20),'日线收盘计算',cls(m.ret20)],['60日涨幅',pct(m.ret60),'日线收盘计算',cls(m.ret60)]])}${kline(code,kind)}<p class="panel-foot">日线末日 ${date(h.at(-1)?.time)}；有效记录 ${h.length}。当前快照与日线有各自时点。</p><div class="controls" style="margin-top:20px">${kind==='stock'?button('watch-add','加入本地自选',code):''}</div>${(D.limits?.up||[]).find(x=>x.thscode===code)?`<p class="notice">涨停原因：${E(D.limits.up.find(x=>x.thscode===code).limit_up_reason)}</p>`:''}</div>`);V.mountPlots?.();mountCharts(el);
}
function selectedRows(){const map={market:D.stocks,sectors:D.sectors,semiconductor:constituentRows(boot.config.semiconductorIndex),pulse:D.events,abnormal:D.abnormal?.[S.abnormalTab],topics:(D.news||[]).flatMap(x=>x.items||[]),etf:D.etfs,pattern:S.patternMatches,watch:S.watch.map(stock),structure:F.confirmedTurns(history(S.structure||(D.watchCodes||[])[0])),futures:futureRows(),resonance:futureRows(),agri:D.basis,gold:constituentRows(boot.config.goldIndex),arena:(D.watchCodes||[]).map(stock)};return map[board.id]||[];}
function exportCSV(){const rows=selectedRows();if(!rows.length)return toast('当前没有可导出的记录');const keys=[...new Set(rows.flatMap(Object.keys))].filter(k=>rows.some(r=>r[k]===null||typeof r[k]!=='object'));const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[keys.map(q).join(','),...rows.map(r=>keys.map(k=>q(typeof r[k]==='object'?JSON.stringify(r[k]):r[k])).join(','))].join('\r\n');download(board.id+'.csv',csv,'text/csv;charset=utf-8');}
function schedule(){clearTimeout(refreshTimer);if(boot.mode!=='dynamic'||store.get('paused',false)||document.hidden)return;const now=new Date(),hour=Number(new Intl.DateTimeFormat('en',{timeZone:'Asia/Shanghai',hour:'2-digit',hour12:false}).format(now));const active=board.category==='商品与周期'||(hour>=9&&hour<16);const seconds=active?board.interval:Math.max(board.interval,300);refreshTimer=setTimeout(()=>refresh(false),seconds*1000*(.9+Math.random()*.2));}
async function refresh(manual=true){if(boot.mode==='static'){showDrawer('更新离线看板',`<p>静态页面保存的是一次真实取数快照。解压完整交付包，在包目录执行：</p><pre style="padding:18px;background:#eef3f8;white-space:pre-wrap">npm run refresh -- ${E(board.id)}</pre><p>命令会更新数据，并重新生成全部已保存看板的离线 HTML。也可以导入刷新后生成的 <code>data/latest.json</code>，当前页会立即重绘。</p><div class="controls" style="margin-top:18px">${button('import','导入数据包')}</div>`);return;}if(refreshing)return;refreshing=true;const el=document.querySelector('[data-action=refresh]');if(el){el.disabled=true;el.textContent='更新中…';}try{const res=await fetch('/api/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({board:board.id})});const next=await res.json();if(!res.ok)throw new Error(next.error||'更新失败');D=next;window.BOARD_DATA=D;if(store.get('watch',null)===null&&!S.watch.length)S.watch=D.watchCodes||[];render();if(manual)toast('数据检查完成，请核对各模块时点和来源状态');}catch(e){toast('更新失败，保留当前快照：'+e.message);}finally{refreshing=false;const el=document.querySelector('[data-action=refresh]');if(el){el.disabled=false;el.textContent='更新数据';}schedule();}}
function mountDrawing(){const canvas=document.getElementById('drawPad');if(!canvas)return;const ctx=canvas.getContext('2d');const draw=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);if(!S.pencil.length)return;ctx.strokeStyle='#77adff';ctx.lineWidth=4;ctx.lineJoin='round';ctx.beginPath();S.pencil.forEach((p,i)=>{const x=p[0]*canvas.width,y=(1-p[1])*canvas.height;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();};draw();let active=false;const point=e=>{const r=canvas.getBoundingClientRect();return[Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height))];};canvas.onpointerdown=e=>{active=true;S.pencil=[point(e)];canvas.setPointerCapture(e.pointerId);draw();};canvas.onpointermove=e=>{if(!active)return;const p=point(e);if(p[0]>S.pencil.at(-1)[0])S.pencil.push(p);draw();};canvas.onpointerup=()=>active=false;canvas.onpointercancel=()=>active=false;}
function findPattern(){if(S.pencil.length<3)return toast('请从左到右画线，或选择一条预设曲线');const ordered=S.pencil.slice().sort((a,b)=>a[0]-b[0]);const left=ordered[0][0],right=ordered.at(-1)[0];if(right-left<.1)return toast('画线横向范围太短');const target=Array.from({length:40},(_,i)=>{const x=left+(right-left)*i/39;let k=ordered.findIndex(p=>p[0]>=x);if(k<=0)return ordered[0][1];const [p,q]=[ordered[k-1],ordered[k]];return p[1]+(q[1]-p[1])*(x-p[0])/(q[0]-p[0]||1);});S.patternMatches=(D.patternCodes||[]).map(code=>{const a=history(code).slice(-S.patternWindow);return{code,corr:a.length>=S.patternWindow?F.pearson(target,F.sample(a.map(x=>x.close),40)):null};}).filter(x=>x.corr!==null).sort((a,b)=>b.corr-a.corr).slice(0,10);render();if(!S.patternMatches.length)toast('常数曲线或历史窗口不足，无法计算相关度');}
document.addEventListener('click',async event=>{const el=event.target.closest('[data-action],[data-code],[data-sector],[data-sort]');if(!el)return;if(el.tagName==='A')event.preventDefault();if(el.dataset.action){const action=el.dataset.action,value=el.dataset.value;switch(action){
 case'refresh':return refresh();case'pause':store.set('paused',!store.get('paused',false));render();schedule();return;
 case'close':return closeDrawer();case'csv':return exportCSV();case'import':document.getElementById('importData')?.click();return;
 case'export-html':location.href='/api/export?board='+board.id;return;
 case'native-select':S.nativeCode=value;break;case'native-area':S.nativeArea=value;break;case'native-tier':S.nativeTier=value;break;case'native-view':S.nativeView=value;break;case'native-topic':S.nativeTopic=value;break;case'native-plate':S.futuresPlate=S.futuresPlate===value?'全部':value;break;case'native-sources':S.nativeSources=!S.nativeSources;render();if(S.nativeSources){const el=document.querySelector('.nf-source-footer');el.querySelector('details').open=true;el.scrollIntoView({behavior:'smooth',block:'start'});}return;case'window':S.window=value;break;case'limit-tab':S.limitTab=value;break;case'abnormal-tab':S.abnormalTab=value;break;case'resonance':S.resonance=value;break;
 case'save-note':{const t=document.getElementById('noteText')?.value.trim();if(!t)return toast('先写下观察内容');const a=store.get('notes:'+value,[]);a.unshift({time:Date.now(),text:t});store.set('notes:'+value,a);store.set('draft:'+value,'');toast('笔记已保存到本机');break;}
 case'delete-note':{const [key,i]=value.split(':');const a=store.get('notes:'+key,[]);a.splice(Number(i),1);store.set('notes:'+key,a);break;}
 case'export-notes': {
  const notes = JSON.stringify(store.get('notes:'+value,[]),null,2);
  if (window.parent === window) download(value+'-notes.json',notes,'application/json');
  else showDrawer('复制笔记', `<textarea rows="12" style="width:100%" aria-label="笔记 JSON" readonly>${E(notes)}</textarea>`);
  return;
 }
 case'watch-remove':S.watch=S.watch.filter(c=>c!==value);store.set('watch',S.watch);break;
 case'watch-add':if(!S.watch.includes(value))S.watch.push(value);store.set('watch',S.watch);toast('已加入本地自选');return;
 case'watch-reset':S.watch=[...(D.watchCodes||[])];store.set('watch',S.watch);break;
 case'watch-up':{const i=S.watch.indexOf(value);if(i>0)[S.watch[i-1],S.watch[i]]=[S.watch[i],S.watch[i-1]];store.set('watch',S.watch);break;}
 case'watch-load':return openStock(value);
 case'watch-search':{const q=document.getElementById('watchSearch').value.trim();const rows=(D.symbols||D.stocks||[]).filter(x=>(x.name+x.thscode).toLowerCase().includes(q.toLowerCase())).slice(0,12);document.getElementById('watchResults').innerHTML=q?rows.map(x=>`<button data-action="watch-add-render" data-value="${x.thscode}">${E(x.name)} ${E(x.thscode)}　添加</button>`).join('')||'<p>未找到匹配的A股。</p>':'';return;}
 case'watch-add-render':if(!S.watch.includes(value))S.watch.push(value);store.set('watch',S.watch);break;
 case'pattern-clear':S.pencil=[];S.patternMatches=[];break;
 case'pattern-preset':S.pencil=value==='rise'?[[0,.1],[.25,.3],[.4,.22],[.7,.6],[1,.9]]:value==='v'?[[0,.9],[.5,.1],[1,.8]]:[[0,.25],[.3,.28],[.6,.23],[.75,.3],[1,.85]];break;
 case'pattern-search':return findPattern();
 case'arena-pick':if(S.arena.includes(value))S.arena=S.arena.filter(x=>x!==value);else if(S.arena.length<3)S.arena.push(value);else return toast('每队最多三张卡');break;
 case'arena-fight':{if(S.arena.length!==3)return;const cards=S.arena.map(stock).map(r=>({...r,...gameAttrs(r)}));const enemy=45+(S.round%5)*7,shield=18+(S.round%3)*6;const damage=cards.reduce((s,c)=>s+Math.max(0,c.attack-shield),0),loss=cards.reduce((s,c)=>s+Math.max(0,enemy-c.guard),0),remain=cards.reduce((s,c)=>s+c.energy,0)-loss;S.battle=`队伍造成 ${damage} 点虚拟伤害\n抵挡后受到 ${loss} 点伤害\n剩余虚拟能量 ${remain}\n${damage>=90&&remain>0?'本轮通过':'本轮未通过，可以重新组队'}。这不是金融风险测评。`;S.round++;break;}
 default:return;
 }render();return;}
 if(el.dataset.sort){const {sort:id,key}=el.dataset;const old=S.sort[id];S.sort[id]={key,dir:old?.key===key?-old.dir:-1};render();return;}
 if(el.dataset.sector){S.sector=el.dataset.sector;if(board.id==='sectors')render();else{const a=constituentRows(S.sector),sec=D.sectors?.find(x=>x.thscode===S.sector);showDrawer(sec?.name||S.sector,breadth(a).html+table(a,baseCols,'drawer-members'));}return;}
 if(el.dataset.code)openStock(el.dataset.code);
});
document.addEventListener('change',async e=>{const el=e.target,k=el.dataset.control;if(el.id==='importData'){const file=el.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(d.version!==1||!Array.isArray(d.sources)||!Number.isFinite(d.updatedAt))throw new Error('数据包格式不正确');D=d;window.BOARD_DATA=d;closeDrawer();render();toast('数据包已导入；此操作仅影响当前打开页面');}catch(e){toast(e.message);}return;}

let inputTimer;document.addEventListener('input',e=>{const el=e.target;if(el.id==='noteText'){store.set('draft:'+board.id,el.value);return;}if(['sector-search','limit-search','event-search'].includes(el.dataset.control)){clearTimeout(inputTimer);const pos=el.selectionStart;inputTimer=setTimeout(()=>{S.search=el.value;render();const next=document.querySelector(`[data-control="${el.dataset.control}"]`);next?.focus();next?.setSelectionRange(pos,pos);},220);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if((e.key==='Enter'||e.key===' ')&&e.target.dataset.sort){e.preventDefault();e.target.click();}if(e.key==='Enter'&&e.target.id==='watchSearch')document.querySelector('[data-action=watch-search]')?.click();});

async function init(){if(!board)return;if(boot.mode==='dynamic'){try{const res=await fetch('/api/state?board='+board.id);if(!res.ok)throw new Error('无法读取本地数据包');D=await res.json();window.BOARD_DATA=D;if(store.get('watch',null)===null&&!S.watch.length)S.watch=D.watchCodes||[];}catch(e){document.getElementById('app').innerHTML=empty('无法打开动态看板',e.message+'；请在完整交付包运行 npm start。');return;}}render();schedule();const deepCode=new URLSearchParams(location.search).get('code');if(board.id==='watch'&&/^[0-9]{6}\.(SH|SZ|BJ)$/.test(deepCode||''))openStock(deepCode);}
init();
