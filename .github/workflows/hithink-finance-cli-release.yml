name: hithink-finance-cli release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to republish or recover
        required: true
        type: string
permissions:
  contents: write
  id-token: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-production
    defaults:
      run:
        working-directory: hithink-finance-cli
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify immutable tag and package version
        run: node scripts/validate-release.mjs ref
      - name: Check publication state
        id: state
        shell: bash
        run: |
          npm view @hithink-tech/hithink-finance-cli versions --registry https://registry.npmjs.org --json > registry-versions.json
          node scripts/validate-release.mjs registry registry-versions.json >> "$GITHUB_OUTPUT"
      - name: Reuse successful validation for this SHA
        if: steps.state.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/hithink-finance-cli-ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f branch=main -f event=push -f status=success -F per_page=1 > validation-run.json
          node scripts/validate-release.mjs ci validation-run.json
      - if: steps.state.outputs.published != 'true'
        run: npm ci --ignore-scripts
      - if: steps.state.outputs.published != 'true'
        run: npm run build
      - if: steps.state.outputs.published != 'true'
        run: node scripts/check-license.mjs
      - name: Pack and verify the installed artifact
        if: steps.state.outputs.published != 'true'
        id: package
        run: npm run verify:release-package -- "$RUNNER_TEMP/hithink-finance-release"
      - name: Publish once with provenance
        if: steps.state.outputs.published != 'true'
        env:
          RELEASE_TARBALL: ${{ steps.package.outputs.tarball }}
        shell: bash
        run: |
          npm publish "$RELEASE_TARBALL" --ignore-scripts --provenance --access public --tag ${{ contains(inputs.tag || github.ref_name, '-') && 'next' || 'latest' }}
  release:
    needs: publish
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create GitHub Release after npm publication
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists."
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" \
              --title "同花顺金融数据服务 $RELEASE_TAG" \
              --generate-notes \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --title "同花顺金融数据服务 $RELEASE_TAG" \
              --generate-notes \
              --latest
          fi
