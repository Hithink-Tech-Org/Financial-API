html,body,#root{color:var(--widget-text);background:var(--widget-bg)}

/* Page controls continue to consume Lumi host tokens in every client theme. */
#hot-stocks .relation-table tbody td:first-child,
#hot-stocks .hot-stock-code{color:var(--widget-text-secondary)}

.theme-summary-rank.rank-1{background:var(--widget-gain)}
.theme-summary-rank.rank-2{background:var(--mc-rank-second-bg);color:var(--mc-rank-on-warm)}
.theme-summary-rank.rank-3{background:var(--mc-rank-third-bg);color:var(--mc-rank-on-warm)}
.announcement-brief-list::-webkit-scrollbar{width:5px;height:4px}
.announcement-brief-list::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--widget-border) 55%,transparent);border-radius:6px}
.announcement-brief-list:hover::-webkit-scrollbar-thumb,.announcement-brief-list:focus-within::-webkit-scrollbar-thumb{background:var(--widget-border)}
.hotspot-latest-toggle input[type=checkbox],.checkbox input[type=checkbox]{
  -webkit-appearance:none;appearance:none;box-sizing:border-box;display:inline-grid;place-content:center;
  flex:0 0 14px;width:14px;height:14px;min-height:14px;margin:0;padding:0;
  border:1px solid var(--widget-text-muted);border-radius:3px;background:var(--widget-surface);cursor:pointer
}
.hotspot-latest-toggle input[type=checkbox]::after,.checkbox input[type=checkbox]::after{
  content:"";box-sizing:border-box;width:4px;height:7px;margin-top:-2px;
  border-right:2px solid var(--widget-surface);border-bottom:2px solid var(--widget-surface);
  transform:rotate(45deg);visibility:hidden
}
.hotspot-latest-toggle input[type=checkbox]:checked,.checkbox input[type=checkbox]:checked{
  border-color:var(--widget-accent);background:var(--widget-accent)
}
.hotspot-latest-toggle input[type=checkbox]:checked::after,.checkbox input[type=checkbox]:checked::after{visibility:visible}
.hotspot-latest-toggle input[type=checkbox]:focus-visible,.checkbox input[type=checkbox]:focus-visible{
  outline:2px solid var(--widget-accent);outline-offset:2px
}
.hotspot-latest-toggle input[type=checkbox]:disabled,.checkbox input[type=checkbox]:disabled{opacity:.45;cursor:default}

:root{--mc-rank-second-bg:#FE8B51;--mc-rank-third-bg:#FFC430;--mc-rank-on-warm:#222222}

.announcement-brief-list{scrollbar-width:auto;scrollbar-color:auto}


/* One boundary system for all six modules. Host continues to own the theme. */
:root{--mc-module-border:var(--widget-border);--mc-grid-frame:var(--widget-border);--mc-grid-line:var(--widget-border)}
:root.dark{
  --mc-module-border:color-mix(in srgb,var(--widget-text) 32%,var(--widget-surface));
  --mc-grid-frame:color-mix(in srgb,var(--widget-text) 24%,var(--widget-surface));
  --mc-grid-line:color-mix(in srgb,var(--widget-text) 20%,var(--widget-surface))
}
.panel{border-color:var(--mc-module-border)}
.relation-scroll,.ladder-scroll{border-color:var(--mc-grid-frame)}

/* Quote tables: every data column has the same single shared edge. */
#global-markets .relation-table th,#global-markets .relation-table td,
#hot-stocks .relation-table th,#hot-stocks .relation-table td,
#relations .relation-table th,#relations .relation-table td{
  border:0;border-right:1px solid var(--mc-grid-line);border-bottom:1px solid var(--mc-grid-line)
}
#global-markets .relation-table th,#hot-stocks .relation-table th,#relations .relation-table th{
  border-bottom-color:var(--mc-grid-frame)
}
#global-markets .relation-table tr>:last-child,#hot-stocks .relation-table tr>:last-child,
#relations .relation-table tr>:last-child{border-right:0}
#global-markets .relation-table tbody tr:last-child td,
#hot-stocks .relation-table tbody tr:last-child td,#relations .relation-table tbody tr:last-child td{border-bottom:0}

/* News is a one-column content table: outer frame and complete row separators. */
#news>.panel-head,#signals>.panel-head{border-bottom-color:var(--mc-grid-frame)}
#news .news-tabs,#signals .signal-tabs{border-bottom-color:var(--mc-grid-frame)}
#news .compact-news{min-height:0}
#news .compact-news-list{
  display:flex;flex-direction:column;flex:1 1 auto;min-height:0;
  overflow:auto;border:1px solid var(--mc-grid-frame);border-radius:6px
}
#news .compact-news-row{
  flex:1 0 48px;height:auto;min-height:48px;padding:4px 8px;
  border:0;border-bottom:1px solid var(--mc-grid-line)
}
#news .compact-news-row:last-child{border-bottom:0}

/* Announcement fields keep their existing tracks and 12px gaps.
   Lines run down the center of each gap, without squeezing the content. */
#signals .announcement-brief-list{
  min-width:0;padding:0;border:1px solid var(--mc-grid-frame);border-radius:6px
}
#signals .announcement-brief{
  width:100%;padding:4px 8px;border:0;border-bottom:1px solid var(--mc-grid-line)
}
#signals .announcement-brief.forecast-brief{min-width:400px}
#signals .announcement-brief:last-child{border-bottom:0}
#signals .announcement-brief>div{
  position:relative;align-self:stretch;display:flex;flex-direction:column;justify-content:center
}
#signals .announcement-brief>div:not(:last-child)::after{
  content:"";position:absolute;right:-6px;top:-4px;bottom:-4px;
  border-right:1px solid var(--mc-grid-line);pointer-events:none
}

/* Preserve ladder row spans and group ownership; no extra boxes around stocks. */
.ladder-table th,.ladder-table td{border-color:var(--mc-grid-line)}
#hotspots .ladder-table thead tr:first-child th{
  border-right-color:var(--mc-grid-line);border-bottom-color:var(--mc-grid-frame)
}
.theme-stock-group,.theme-stock-group:last-child{border-color:var(--mc-grid-frame)}
.theme-group-heading{border-right-color:var(--mc-grid-line)}
.theme-summary,.theme-summary-list{border-color:var(--mc-grid-line)}
.theme-ranking-head{border-bottom-color:var(--mc-grid-frame)}

/* Topic summaries: separate complete topics with a single horizontal rule. */
#themes .theme-summary-list{border:0;border-radius:0}
#themes .theme-summary{border:0;border-bottom:1px solid var(--mc-grid-line)}
#themes .theme-summary:last-child{border-bottom:0}

/* Only the inner table scrolls: match the search field's 12px edge inset. */
#global-markets>.panel-body,#hot-stocks>.panel-body,#hotspots>.panel-body{
  scrollbar-gutter:auto;padding-left:12px;padding-right:12px
}

/* News headlines are static content; only category tabs remain interactive. */
#news .compact-news-row{grid-template-columns:minmax(0,1fr);cursor:default}

/* Sticky headers need an opaque host surface: Lumi does not supply widget-surface-subtle. */
#global-markets .relation-table th,
#hot-stocks .relation-table th,
#themes .theme-ranking-head{
  background:var(--widget-surface);
}

function noteWidget(key){const notes=store.get('notes:'+key,[]);return panel('我的观察',`<div class="note-box"><textarea id="noteText" placeholder="记下观察、待验证条件或复盘结论…">${E(store.get('draft:'+key,''))}</textarea><div class="controls" style="margin-top:10px">${button('save-note','保存笔记',key)}${button('export-notes','导出笔记',key)}</div><div class="note-list">${notes.length?notes.map((x,i)=>`<div class="note"><small>${date(x.time,true)}</small><button data-action="delete-note" data-value="${key}:${i}">删除</button><p>${E(x.text)}</p></div>`).join(''):'<small>笔记保存在当前浏览器，不上传。</small>'}</div></div>`,'本机保存');}
function futureRows(){return(D.futures||[]).filter(r=>S.futuresPlate==='全部'||r.plate===S.futuresPlate);}
function gameAttrs(r){return{attack:Math.round(20+Math.min(10,Math.abs(r.price_change_ratio_pct||0))*5),guard:Math.round(60-Math.min(20,r.amplitude||0)*2),energy:Math.round(30+Math.min(70,Math.log10(Math.max(1,r.turnover||1))*7))};}
function sourcePanel(){const rows=(D.sources||[]).filter(x=>board.groups.includes(x.group));const failed=rows.filter(x=>['error','stale'].includes(x.status));return `<details class="source-summary"><summary>数据来源与口径 · ${rows.length} 项请求记录${failed.length?' · '+failed.length+' 项待更新':''}</summary><p>仅使用 hithink-finance。页面生成时间 ${date(boot.generatedAt,true)}；数据包生成时间 ${date(D.updatedAt,true)}。表中“响应时点”是上游响应中的 timestamp，不承诺等于每个字段的发生时间；日线、年报和资讯分别显示自身日期。静态版不会自动联网。</p><div class="table-wrap"><table><thead><tr><th>能力</th><th>接口</th><th>响应时点</th><th>本地取数</th><th>状态</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${E(r.id)}</td><td>${E(r.endpoint)}</td><td>${date(r.upstreamTime,true)}</td><td>${date(r.fetchedAt,true)}</td><td>${E(r.status)}${r.error?' / '+E(r.error):''}</td></tr>`).join('')}</tbody></table></div><p style="margin-top:12px">${E(board.decision)}</p><p>信息展示与研究用途，不构成投资建议。互动实验的游戏属性与收益为虚拟设定。</p></details>`;}
function destroyCharts(){for(const x of charts){try{x.observer.disconnect();window.GalleryKlineChart.dispose(x.el);}catch{}}charts=[];}
function render(){if(!board)return;const scroll=window.scrollY;destroyCharts();V.resetPlots?.();const meta=window.NativeBoards.meta[board.id];document.documentElement.dataset.theme=['watch','futures'].includes(board.id)?'light':'dark';document.body.className='native n-'+board.id+' '+(['watch','futures'].includes(board.id)?'native-light':'native-dark');['bg','panel','text','muted','accent'].forEach((key,i)=>document.body.style.setProperty('--nf-'+key,meta[i+1]));document.getElementById('app').innerHTML=window.NativeBoards.render({D,S,board,boot,E,n,pct,money,date,valid,cls,stock,name,history,kline,button,table,baseCols,retcol,noteWidget,breadth,F,V,constituentRows,sourcePanel,store,refreshing});V.mountPlots?.();mountCharts();if(board.id==='pattern')mountDrawing();if(scroll)window.scrollTo(0,scroll);}
function mountCharts(scope=document){scope.querySelectorAll('[data-kline]').forEach(el=>{const code=el.dataset.kline,kind=el.dataset.kind,a=history(code,kind).slice(-180);if(!a.length){el.innerHTML=empty('日线尚未保存',boot.mode==='static'?'本次离线快照没有该标的历史。':'点击更新，或在详情中加载日线。');return;}if(!window.GalleryKlineChart){el.innerHTML=V.line([{name:name(code),points:a.map(x=>[x.time,x.close])}],{height:230,unit:'图表库未加载；收盘线预览'});return;}try{const c=window.GalleryKlineChart.init(el,{timezone:'Asia/Shanghai',dateFormat:'YYYY-MM-DD',locale:'zh-CN',disableAnalytics:true,styles:{candle:{type:'candle_solid',tooltip:{showRule:'follow_cross'},bar:{upColor:'#d03e4c',downColor:'#168270',noChangeColor:'#8293a5',upBorderColor:'#d03e4c',downBorderColor:'#168270',upWickColor:'#d03e4c',downWickColor:'#168270'}},grid:{horizontal:{color:document.body.classList.contains('native-light')?'#edf1f5':'#263141'},vertical:{color:document.body.classList.contains('native-light')?'#edf1f5':'#263141'}},xAxis:{tickText:{color:document.body.classList.contains('native-light')?'#7b8695':'#8c98a8'}},yAxis:{tickText:{color:document.body.classList.contains('native-light')?'#7b8695':'#8c98a8'}}}});c.applyNewData(a.map(r=>({...r,timestamp:r.time})));try{c.createIndicator({name:'MA',calcParams:[20,60]},true,{paneId:'candle_pane'});if(!el.classList.contains('small'))c.createIndicator('VOL');}catch{}const observer=new ResizeObserver(()=>c.resize());observer.observe(el);charts.push({el,c,observer});}catch{el.innerHTML=V.line([{name:name(code),points:a.map(x=>[x.time,x.close])}],{height:230,unit:'K线组件暂不可用；收盘线预览'});}});}
let toastTimer;function toast(t){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.append(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),4000);}
function download(file,content,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function closeDrawer(){document.querySelector('.drawer-back')?.remove();document.querySelector('.drawer')?.remove();}
function showDrawer(title,html){closeDrawer();const back=document.createElement('div');back.className='drawer-back';back.dataset.action='close';const d=document.createElement('section');d.className='drawer';d.setAttribute('role','dialog');d.setAttribute('aria-label',title);d.innerHTML=`<div class="top"><h2>${E(title)}</h2><button class="close" data-action="close" aria-label="关闭详情">×</button></div>${html}`;document.body.append(back,d);d.querySelector('button').focus();return d;}
async function openStock(code){const r=stock(code),kind=(D.etfs||[]).some(x=>x.thscode===code)?'etf':(D.futures||[]).some(x=>x.thscode===code)?'futures':'stock';S.selected=code;let h=history(code,kind);if(!h.length&&boot.mode==='dynamic'&&kind==='stock'){showDrawer(r.name,empty('正在读取日线',code));try{const res=await fetch('/api/history?code='+encodeURIComponent(code));const json=await res.json();if(!res.ok)throw new Error(json.error||'历史接口失败');D.history??={};D.history[code]=json.bars;h=json.bars;}catch(e){toast('日线加载失败：'+e.message);}}
 const m=F.metrics(h),noteText=kind==='futures'?'期货价格单位按该合约规则；涨跌幅相对前收。':kind==='etf'?'ETF场内价格，日线按接口原口径。':'A股快照为当前价格，日线使用前复权。';const el=showDrawer(r.name||code,`<p class="description">${E(code)} · ${E(noteText)}</p><div style="margin-top:20px">${strip([['最新价格',n(r.last_price),kind==='futures'?r.quoteKind||'':'报价单位：元'],['当日涨跌',pct(r.price_change_ratio_pct),'快照读数',cls(r.price_change_ratio_pct)],['20日涨幅',pct(m.ret20),'日线收盘计算',cls(m.ret20)],['60日涨幅',pct(m.ret60),'日线收盘计算',cls(m.ret60)]])}${kline(code,kind)}<p class="panel-foot">日线末日 ${date(h.at(-1)?.time)}；有效记录 ${h.length}。当前快照与日线有各自时点。</p><div class="controls" style="margin-top:20px">${kind==='stock'?button('watch-add','加入本地自选',code):''}</div>${(D.limits?.up||[]).find(x=>x.thscode===code)?`<p class="notice">涨停原因：${E(D.limits.up.find(x=>x.thscode===code).limit_up_reason)}</p>`:''}</div>`);V.mountPlots?.();mountCharts(el);
}
function selectedRows(){const map={market:D.stocks,sectors:D.sectors,semiconductor:constituentRows(boot.config.semiconductorIndex),pulse:D.events,abnormal:D.abnormal?.[S.abnormalTab],topics:(D.news||[]).flatMap(x=>x.items||[]),etf:D.etfs,pattern:S.patternMatches,watch:S.watch.map(stock),structure:F.confirmedTurns(history(S.structure||(D.watchCodes||[])[0])),futures:futureRows(),resonance:futureRows(),agri:D.basis,gold:constituentRows(boot.config.goldIndex),arena:(D.watchCodes||[]).map(stock)};return map[board.id]||[];}
function exportCSV(){const rows=selectedRows();if(!rows.length)return toast('当前没有可导出的记录');const keys=[...new Set(rows.flatMap(Object.keys))].filter(k=>rows.some(r=>r[k]===null||typeof r[k]!=='object'));const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[keys.map(q).join(','),...rows.map(r=>keys.map(k=>q(typeof r[k]==='object'?JSON.stringify(r[k]):r[k])).join(','))].join('\r\n');download(board.id+'.csv',csv,'text/csv;charset=utf-8');}
function schedule(){clearTimeout(refreshTimer);if(boot.mode!=='dynamic'||store.get('paused',false)||document.hidden)return;const now=new Date(),hour=Number(new Intl.DateTimeFormat('en',{timeZone:'Asia/Shanghai',hour:'2-digit',hour12:false}).format(now));const active=board.category==='商品与周期'||(hour>=9&&hour<16);const seconds=active?board.interval:Math.max(board.interval,300);refreshTimer=setTimeout(()=>refresh(false),seconds*1000*(.9+Math.random()*.2));}
async function refresh(manual=true){if(boot.mode==='static'){showDrawer('更新离线看板',`<p>静态页面保存的是一次真实取数快照。解压完整交付包，在包目录执行：</p><pre style="padding:18px;background:#eef3f8;white-space:pre-wrap">npm run refresh -- ${E(board.id)}</pre><p>命令会更新数据，并重新生成全部已保存看板的离线 HTML。也可以导入刷新后生成的 <code>data/latest.json</code>，当前页会立即重绘。</p><div class="controls" style="margin-top:18px">${button('import','导入数据包')}</div>`);return;}if(refreshing)return;refreshing=true;const el=document.querySelector('[data-action=refresh]');if(el){el.disabled=true;el.textContent='更新中…';}try{const res=await fetch('/api/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({board:board.id})});const next=await res.json();if(!res.ok)throw new Error(next.error||'更新失败');D=next;window.BOARD_DATA=D;if(store.get('watch',null)===null&&!S.watch.length)S.watch=D.watchCodes||[];render();if(manual)toast('数据检查完成，请核对各模块时点和来源状态');}catch(e){toast('更新失败，保留当前快照：'+e.message);}finally{refreshing=false;const el=document.querySelector('[data-action=refresh]');if(el){el.disabled=false;el.textContent='更新数据';}schedule();}}
function mountDrawing(){const canvas=document.getElementById('drawPad');if(!canvas)return;const ctx=canvas.getContext('2d');const draw=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);if(!S.pencil.length)return;ctx.strokeStyle='#77adff';ctx.lineWidth=4;ctx.lineJoin='round';ctx.beginPath();S.pencil.forEach((p,i)=>{const x=p[0]*canvas.width,y=(1-p[1])*canvas.height;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();};draw();let active=false;const point=e=>{const r=canvas.getBoundingClientRect();return[Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height))];};canvas.onpointerdown=e=>{active=true;S.pencil=[point(e)];canvas.setPointerCapture(e.pointerId);draw();};canvas.onpointermove=e=>{if(!active)return;const p=point(e);if(p[0]>S.pencil.at(-1)[0])S.pencil.push(p);draw();};canvas.onpointerup=()=>active=false;canvas.onpointercancel=()=>active=false;}
function findPattern(){if(S.pencil.length<3)return toast('请从左到右画线，或选择一条预设曲线');const ordered=S.pencil.slice().sort((a,b)=>a[0]-b[0]);const left=ordered[0][0],right=ordered.at(-1)[0];if(right-left<.1)return toast('画线横向范围太短');const target=Array.from({length:40},(_,i)=>{const x=left+(right-left)*i/39;let k=ordered.findIndex(p=>p[0]>=x);if(k<=0)return ordered[0][1];const [p,q]=[ordered[k-1],ordered[k]];return p[1]+(q[1]-p[1])*(x-p[0])/(q[0]-p[0]||1);});S.patternMatches=(D.patternCodes||[]).map(code=>{const a=history(code).slice(-S.patternWindow);return{code,corr:a.length>=S.patternWindow?F.pearson(target,F.sample(a.map(x=>x.close),40)):null};}).filter(x=>x.corr!==null).sort((a,b)=>b.corr-a.corr).slice(0,10);render();if(!S.patternMatches.length)toast('常数曲线或历史窗口不足，无法计算相关度');}
document.addEventListener('click',async event=>{const el=event.target.closest('[data-action],[data-code],[data-sector],[data-sort]');if(!el)return;if(el.tagName==='A')event.preventDefault();if(el.dataset.action){const action=el.dataset.action,value=el.dataset.value;switch(action){
 case'refresh':return refresh();case'pause':store.set('paused',!store.get('paused',false));render();schedule();return;
 case'close':return closeDrawer();case'csv':return exportCSV();case'import':document.getElementById('importData')?.click();return;
 case'export-html':location.href='/api/export?board='+board.id;return;
 case'native-select':S.nativeCode=value;break;case'native-area':S.nativeArea=value;break;case'native-tier':S.nativeTier=value;break;case'native-view':S.nativeView=value;break;case'native-topic':S.nativeTopic=value;break;case'native-plate':S.futuresPlate=S.futuresPlate===value?'全部':value;break;case'native-sources':S.nativeSources=!S.nativeSources;render();if(S.nativeSources){const el=document.querySelector('.nf-source-footer');el.querySelector('details').open=true;el.scrollIntoView({behavior:'smooth',block:'start'});}return;case'window':S.window=value;break;case'limit-tab':S.limitTab=value;break;case'abnormal-tab':S.abnormalTab=value;break;case'resonance':S.resonance=value;break;
 case'save-note':{const t=document.getElementById('noteText')?.value.trim();if(!t)return toast('先写下观察内容');const a=store.get('notes:'+value,[]);a.unshift({time:Date.now(),text:t});store.set('notes:'+value,a);store.set('draft:'+value,'');toast('笔记已保存到本机');break;}
 case'delete-note':{const [key,i]=value.split(':');const a=store.get('notes:'+key,[]);a.splice(Number(i),1);store.set('notes:'+key,a);break;}
 case'export-notes': {
  const notes = JSON.stringify(store.get('notes:'+value,[]),null,2);
  if (window.parent === window) download(value+'-notes.json',notes,'application/json');
  else showDrawer('复制笔记', `<textarea rows="12" style="width:100%" aria-label="笔记 JSON" readonly>${E(notes)}</textarea>`);
  return;
 }
 case'watch-remove':S.watch=S.watch.filter(c=>c!==value);store.set('watch',S.watch);break;
 case'watch-add':if(!S.watch.includes(value))S.watch.push(value);store.set('watch',S.watch);toast('已加入本地自选');return;
 case'watch-reset':S.watch=[...(D.watchCodes||[])];store.set('watch',S.watch);break;
 case'watch-up':{const i=S.watch.indexOf(value);if(i>0)[S.watch[i-1],S.watch[i]]=[S.watch[i],S.watch[i-1]];store.set('watch',S.watch);break;}
 case'watch-load':return openStock(value);
 case'watch-search':{const q=document.getElementById('watchSearch').value.trim();const rows=(D.symbols||D.stocks||[]).filter(x=>(x.name+x.thscode).toLowerCase().includes(q.toLowerCase())).slice(0,12);document.getElementById('watchResults').innerHTML=q?rows.map(x=>`<button data-action="watch-add-render" data-value="${x.thscode}">${E(x.name)} ${E(x.thscode)}　添加</button>`).join('')||'<p>未找到匹配的A股。</p>':'';return;}
 case'watch-add-render':if(!S.watch.includes(value))S.watch.push(value);store.set('watch',S.watch);break;
 case'pattern-clear':S.pencil=[];S.patternMatches=[];break;
 case'pattern-preset':S.pencil=value==='rise'?[[0,.1],[.25,.3],[.4,.22],[.7,.6],[1,.9]]:value==='v'?[[0,.9],[.5,.1],[1,.8]]:[[0,.25],[.3,.28],[.6,.23],[.75,.3],[1,.85]];break;
 case'pattern-search':return findPattern();
 case'arena-pick':if(S.arena.includes(value))S.arena=S.arena.filter(x=>x!==value);else if(S.arena.length<3)S.arena.push(value);else return toast('每队最多三张卡');break;
 case'arena-fight':{if(S.arena.length!==3)return;const cards=S.arena.map(stock).map(r=>({...r,...gameAttrs(r)}));const enemy=45+(S.round%5)*7,shield=18+(S.round%3)*6;const damage=cards.reduce((s,c)=>s+Math.max(0,c.attack-shield),0),loss=cards.reduce((s,c)=>s+Math.max(0,enemy-c.guard),0),remain=cards.reduce((s,c)=>s+c.energy,0)-loss;S.battle=`队伍造成 ${damage} 点虚拟伤害\n抵挡后受到 ${loss} 点伤害\n剩余虚拟能量 ${remain}\n${damage>=90&&remain>0?'本轮通过':'本轮未通过，可以重新组队'}。这不是金融风险测评。`;S.round++;break;}
 default:return;
 }render();return;}
 if(el.dataset.sort){const {sort:id,key}=el.dataset;const old=S.sort[id];S.sort[id]={key,dir:old?.key===key?-old.dir:-1};render();return;}
 if(el.dataset.sector){S.sector=el.dataset.sector;if(board.id==='sectors')render();else{const a=constituentRows(S.sector),sec=D.sectors?.find(x=>x.thscode===S.sector);showDrawer(sec?.name||S.sector,breadth(a).html+table(a,baseCols,'drawer-members'));}return;}
 if(el.dataset.code)openStock(el.dataset.code);
});
document.addEventListener('change',async e=>{const el=e.target,k=el.dataset.control;if(el.id==='importData'){const file=el.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(d.version!==1||!Array.isArray(d.sources)||!Number.isFinite(d.updatedAt))throw new Error('数据包格式不正确');D=d;window.BOARD_DATA=d;closeDrawer();render();toast('数据包已导入；此操作仅影响当前打开页面');}catch(e){toast(e.message);}return;}
 if(!k)return;switch(k){case'native-width':S.nativeWidth=Number(el.value);break;case'native-height':S.nativeHeight=Number(el.value);break;case'navigate':location.href=el.value+'.html';return;case'direction':S.direction=el.value;break;case'event-tag':S.eventTag=el.value;break;case'etf-min':S.etfMin=Number(el.value)||0;break;case'etf-window':S.etfWindow=el.value;break;case'etf-trend':S.etfTrend=el.checked;break;case'pattern-window':S.patternWindow=Number(el.value);S.patternMatches=[];break;case'structure-code':S.structure=el.value;break;case'future-plate':S.futuresPlate=el.value;break;default:return;}render();});
let inputTimer;document.addEventListener('input',e=>{const el=e.target;if(el.id==='noteText'){store.set('draft:'+board.id,el.value);return;}if(['sector-search','limit-search','event-search'].includes(el.dataset.control)){clearTimeout(inputTimer);const pos=el.selectionStart;inputTimer=setTimeout(()=>{S.search=el.value;render();const next=document.querySelector(`[data-control="${el.dataset.control}"]`);next?.focus();next?.setSelectionRange(pos,pos);},220);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if((e.key==='Enter'||e.key===' ')&&e.target.dataset.sort){e.preventDefault();e.target.click();}if(e.key==='Enter'&&e.target.id==='watchSearch')document.querySelector('[data-action=watch-search]')?.click();});

async function init(){if(!board)return;if(boot.mode==='dynamic'){try{const res=await fetch('/api/state?board='+board.id);if(!res.ok)throw new Error('无法读取本地数据包');D=await res.json();window.BOARD_DATA=D;if(store.get('watch',null)===null&&!S.watch.length)S.watch=D.watchCodes||[];}catch(e){document.getElementById('app').innerHTML=empty('无法打开动态看板',e.message+'；请在完整交付包运行 npm start。');return;}}render();schedule();const deepCode=new URLSearchParams(location.search).get('code');if(board.id==='watch'&&/^[0-9]{6}\.(SH|SZ|BJ)$/.test(deepCode||''))openStock(deepCode);}
init();
