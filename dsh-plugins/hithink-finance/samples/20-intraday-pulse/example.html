  --bloom-cool:radial-gradient(52% 46% at 99% 58%,rgba(0,240,255,.18),transparent 72%),radial-gradient(46% 40% at 8% 96%,rgba(237,30,121,.20),transparent 70%);
  --field-scrim:radial-gradient(105% 78% at 74% 30%,rgba(6,8,11,.08),rgba(5,6,9,.74) 64%),linear-gradient(90deg,rgba(4,5,7,.92) 22%,rgba(4,5,7,.34) 62%);
}
*{box-sizing:border-box}
html,body{margin:0;min-width:320px;background:var(--ground);color:var(--ink);font:13px/1.5 var(--body);font-synthesis:none;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
button:not(:disabled){transition:transform .28s var(--ease-spring),border-color .22s ease,background-color .22s ease,color .22s ease,box-shadow .28s var(--ease-spring)}
button:not(:disabled):active{transform:scale(.985)}
input,textarea{caret-color:var(--cyan)}
::selection{color:#0c0c0c;background:rgba(252,238,10,.88)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(233,245,255,.14);border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(0,240,255,.38);background-clip:content-box}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.pscroll{overflow-x:hidden;scrollbar-width:none}.pscroll::-webkit-scrollbar{display:none}

/* ---------- 场景：夜景 + 暖冷两团光 + 压暗 ---------- */
.field{position:fixed;inset:0;z-index:0;pointer-events:none}
.field::before{content:"";position:fixed;inset:0;background:var(--field) center/cover no-repeat;opacity:.5}
.field::after{content:"";position:fixed;inset:0;background:var(--bloom-warm),var(--bloom-cool),var(--field-scrim)}
canvas.fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;display:block;z-index:80}

/* ---------- 外壳：左侧导轨 + 顶栏（参照 app-rail / topbar） ---------- */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:58px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;z-index:40;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 8px 12px;border-right:1px solid var(--glass-edge);background:var(--glass);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.rail .mark{width:30px;height:30px;margin:4px 0 10px;color:var(--ink)}
.rail-button{position:relative;display:grid;place-items:center;width:38px;height:38px;border:1px solid transparent;border-radius:var(--r-sm);color:var(--faint)}
.rail-button svg{width:18px;height:18px}
.rail-button:hover{color:var(--ink);background:rgba(233,245,255,.07);border-color:var(--glass-edge)}
.rail-button.is-active{color:var(--yellow);background:rgba(252,238,10,.09);border-color:rgba(252,238,10,.34)}
.rail-button.is-active::before{content:"";position:absolute;left:-9px;width:2px;height:18px;background:var(--yellow)}
.rail-button::after{content:attr(data-tip);position:absolute;left:50px;z-index:90;width:max-content;padding:7px 10px;border:1px solid var(--glass-edge);border-radius:var(--r-sm);background:var(--glass-high);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));box-shadow:var(--shadow-lift);color:var(--ink);font-size:13px;opacity:0;pointer-events:none;transform:translateX(-5px);transition:opacity .14s,transform .14s}
.rail-button:hover::after{opacity:1;transform:none}
.rail .grow{flex:1}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;min-height:60px;padding:0 18px 0 22px;border-bottom:1px solid var(--glass-edge);background:var(--glass);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.topbar-title{margin:0;font:500 20px var(--display);white-space:nowrap}
.topbar-context{color:var(--faint);font:12px var(--mono);white-space:nowrap}
.topbar-context span{margin:0 5px;color:var(--line-strong)}
.rhythm{position:relative;flex:1;min-width:200px;max-width:760px;height:36px;margin:0 12px}
.rhythm .seg{position:absolute;top:12px;height:4px;border-radius:2px;background:rgba(233,245,255,.08)}
.rhythm .seg.done{background:color-mix(in srgb,var(--cyan) 30%,transparent)}
.rhythm .seg.on{background:linear-gradient(90deg,color-mix(in srgb,var(--cyan) 40%,transparent),var(--cyan))}
.rhythm .lb{position:absolute;top:19px;color:var(--faint);font:10.5px var(--display);letter-spacing:.06em;transform:translateX(-50%);white-space:nowrap}
.rhythm .lb.on{color:var(--cyan)}
.rhythm .now{position:absolute;top:10px;width:8px;height:8px;margin-left:-4px;background:var(--yellow);transform:rotate(45deg);box-shadow:0 0 12px var(--yellow);transition:left .5s var(--ease-spring)}
.rhythm .now::after{content:attr(data-t);position:absolute;left:6px;top:-14px;transform:rotate(-45deg);color:var(--yellow);font:600 11px var(--mono);white-space:nowrap}
.topbar-controls{display:flex;align-items:center;gap:10px;margin-left:auto}
.capacity{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font:12px var(--mono);white-space:nowrap}

/* ---------- 页面（paper.css：.view-heading / .paper-session / .paper-nav） ---------- */
.view-page{padding:22px 22px 110px}
.wrap{max-width:1680px;margin:0 auto}
.view-heading{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 0 18px}
.view-heading h2{margin:0;font:600 32px var(--headline);letter-spacing:.04em}
.paper-edition{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 0}
.paper-session{display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 8px;border:1px solid var(--glass-edge);border-radius:8px;color:var(--ink);font:600 11.5px var(--display);letter-spacing:.06em;cursor:default}
.paper-session i{width:7px;height:7px;border:1px solid currentColor;transform:rotate(45deg)}
.paper-session.is-open{color:var(--cyan)}
.paper-session.is-open i{background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:paper-pulse 2.4s ease-in-out infinite}
.paper-session.is-replay{color:var(--yellow);cursor:pointer}
.paper-session.is-replay i{background:var(--yellow)}
@keyframes paper-pulse{50%{opacity:.35}}
.paper-edition__meta{color:var(--muted);font:10.5px var(--mono);letter-spacing:.08em}
.track{padding:2px 8px;border:1px solid rgba(252,238,10,.34);border-radius:8px;background:rgba(252,238,10,.07);color:var(--yellow);font:600 11.5px var(--display);letter-spacing:.08em;white-space:nowrap}
.paper-nav{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line-strong);margin-bottom:18px}
.paper-nav [role=tablist]{display:flex;gap:26px}
.paper-nav [role=tab]{padding:0 0 13px;border-bottom:2px solid transparent;border-radius:0;color:var(--ink-soft);font-size:14px}
.paper-nav [role=tab][aria-selected=true]{color:var(--yellow);border-bottom-color:var(--yellow)}
.paper-nav [role=tab] em{display:inline-grid;place-items:center;min-width:17px;height:17px;margin-left:6px;padding:0 5px;border-radius:999px;background:var(--yellow);color:#0c0c0c;font:600 10.5px var(--mono);font-style:normal;vertical-align:1px}
.paper-nav .nav-note{color:var(--muted);font-size:11.5px;padding-bottom:13px}
.view{display:none}.view.is-on{display:grid;gap:14px}

/* search（paper.css .psearch） */
.psearch{position:relative;width:min(400px,100%)}
.psearch label{position:relative;display:flex;align-items:center;gap:9px;height:42px;padding:0 14px;overflow:hidden;border:1px solid rgba(233,245,255,.16);border-top-color:rgba(233,245,255,.32);border-radius:14px;
  background:linear-gradient(180deg,rgba(233,245,255,.09),rgba(233,245,255,.025) 60%),rgba(10,14,20,.28);color:var(--muted);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -10px 22px rgba(0,0,0,.18),0 10px 30px rgba(0,0,0,.28);transition:border-color .2s,box-shadow .25s}
.psearch label::before{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%)}
.psearch label:focus-within{border-color:rgba(85,234,212,.5);color:var(--cyan);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 0 3px rgba(85,234,212,.12),0 0 28px rgba(85,234,212,.18),0 12px 34px rgba(0,0,0,.32)}
.psearch input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:13px}
.psearch kbd{display:grid;place-items:center;min-width:20px;height:20px;border:1px solid var(--glass-edge);border-radius:5px;color:var(--muted);font:11px var(--mono)}
.psearch__menu{position:absolute;z-index:60;top:calc(100% + 8px);left:0;right:0;padding:6px;max-height:440px;overflow:auto;display:none;border:1px solid rgba(233,245,255,.14);border-top-color:rgba(233,245,255,.28);border-radius:14px;
  background:linear-gradient(180deg,rgba(233,245,255,.07),rgba(233,245,255,.02)),var(--menu-fill);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--shadow-plate),inset 0 1px 0 rgba(255,255,255,.12);animation:paper-menu .18s var(--ease-spring) both}
.psearch__menu.on{display:block}
.psearch__menu button{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;column-gap:10px;width:100%;padding:8px 10px;border-radius:9px;color:var(--ink-soft);text-align:left;animation:paper-row .3s var(--ease-spring) both}
.psearch__menu button i{width:6px;height:6px;border:1px solid var(--muted);transform:rotate(45deg)}
.psearch__menu button b{color:var(--ink);font-weight:600}
.psearch__menu button code{color:var(--cyan);font:12px var(--mono)}
.psearch__menu button.on{background:var(--hover-wash)}.psearch__menu button.on i{border-color:var(--yellow);background:var(--yellow)}
.psearch__menu p{margin:0;padding:10px;color:var(--muted);font-size:12px;text-align:center}
@keyframes paper-menu{from{opacity:0;transform:translateY(-4px) scale(.98)}}

/* numbers */
.pnum{font-family:var(--mono);font-variant-numeric:tabular-nums}
.is-up{color:var(--up)}.is-down{color:var(--down)}.is-flat{color:var(--ink)}
.pfig{font-family:Rajdhani,var(--cjk),sans-serif;font-weight:600;letter-spacing:.005em}
.is-flash-up{animation:paper-flash-up .65s ease-out}.is-flash-down{animation:paper-flash-down .65s ease-out}
@keyframes paper-flash-up{from{background:color-mix(in srgb,var(--up) 30%,transparent)}to{background:transparent}}
@keyframes paper-flash-down{from{background:color-mix(in srgb,var(--down) 30%,transparent)}to{background:transparent}}

/* glass card（.pcard）+ 指针高光（.plate::before/after） */
.pcard{position:relative;isolation:isolate;min-width:0;padding:16px 18px;border:1px solid var(--glass-edge);border-radius:var(--r-lg);background:var(--glass);-webkit-backdrop-filter:var(--glass-filter);backdrop-filter:var(--glass-filter);box-shadow:var(--glass-lip),var(--glass-cast)}
.pcard::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;opacity:0;transition:opacity .32s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(233,245,255,.10),transparent 62%)}
.pcard::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;padding:1px;opacity:0;transition:opacity .32s;background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),var(--glass-lit),transparent 58%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.pcard.is-lit::after,.pcard.is-lit::before{opacity:1}
.pcard h3{margin:0;font:600 16.5px var(--headline);letter-spacing:.03em;display:inline-flex;align-items:center;gap:7px}
.pcard__head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.pcard__hint{margin-left:auto;color:var(--muted);font-size:11.5px}
.pbtn{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border:1px solid var(--glass-edge);border-radius:var(--r-sm);background:var(--rest-wash);color:var(--ink-soft);font-size:12.5px;white-space:nowrap}
.pbtn:hover:not(:disabled){border-color:var(--glass-lit);color:var(--ink);background:var(--hover-wash)}
.pbtn.is-on{border-color:color-mix(in srgb,var(--yellow) 60%,transparent);color:var(--yellow)}
.pbtn.is-primary{border-color:var(--yellow);background:var(--yellow);color:#0c0c0c;font-weight:600}
.pbtn.is-primary:hover:not(:disabled){background:var(--yellow-hot);color:#0c0c0c}
.pseg{display:inline-flex;padding:2px;border:1px solid var(--glass-edge);border-radius:var(--r-sm);background:var(--p-fill)}
.pseg button{min-height:26px;padding:0 10px;border-radius:8px;color:var(--muted);font-size:12px}
.pseg button:hover{color:var(--ink)}
.pseg button.is-on{background:color-mix(in srgb,var(--yellow) 14%,transparent);color:var(--yellow);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--yellow) 45%,transparent)}
.pdetail__note{margin:7px 2px 0;color:var(--muted);font-size:11.5px;line-height:1.55}
.prows__empty{padding:28px 8px;color:var(--muted);font-size:12.5px;line-height:1.7;text-align:center}

/* 脉搏条（照 .pstrip：账户条换成盘面脉搏） */
.pstrip{display:grid;grid-template-columns:1.6fr repeat(5,minmax(0,1fr));border:1px solid var(--glass-edge);border-radius:var(--r-lg);background:var(--glass);-webkit-backdrop-filter:var(--glass-filter);backdrop-filter:var(--glass-filter);box-shadow:var(--glass-lip),var(--glass-cast);overflow:hidden}
.pstrip>div{display:flex;flex-direction:column;gap:4px;min-width:0;padding:14px 18px;border-right:1px solid var(--glass-edge)}
.pstrip>div:last-child{border-right:0}
.pstrip span:first-child{color:var(--muted);font-size:11.5px;letter-spacing:.04em}
.pstrip small{color:var(--muted);font-size:11.5px}
.pstrip__lead{position:relative;display:grid!important;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto auto;column-gap:18px;align-items:center;background:linear-gradient(90deg,color-mix(in srgb,var(--pc,var(--yellow)) 9%,transparent),transparent 80%)}
.pstrip__lead::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;background:var(--pc,var(--yellow))}
.pstrip__lead .pfig{font-size:42px;line-height:1;color:var(--pc,var(--yellow))}
.pstrip__lead em{font:normal 600 15px var(--headline);color:var(--pc,var(--yellow));letter-spacing:.06em}
.pstrip__lead canvas{grid-row:1/span 3;grid-column:2;width:100%;height:66px}
.pstrip__mid{font-size:24px;line-height:1.15}
.pmeter{display:block;height:3px;margin-top:4px;border-radius:2px;background:var(--chart-grid);overflow:hidden}
.pmeter b{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--yellow));transition:width .4s var(--ease-spring)}
#pcurve{width:100%;height:30px;display:block}

/* 指数卡 + 涨跌家数（.pidx） */
.pidx{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(180px,1.2fr);gap:10px}
.pidx__card{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;min-width:0;padding:10px 12px 8px;border:1px solid var(--glass-edge);border-radius:var(--r-md);background:var(--glass);-webkit-backdrop-filter:var(--glass-filter);backdrop-filter:var(--glass-filter);box-shadow:var(--glass-lip);color:var(--ink);text-align:left;transition:transform .28s var(--ease-spring),border-color .2s,box-shadow .28s var(--ease-spring)}
.pidx__card:hover{border-color:var(--glass-lit);transform:translateY(-2px);box-shadow:var(--glass-lip),var(--shadow-lift)}
.pidx__card.is-on{border-color:var(--yellow);box-shadow:var(--glass-lip),0 0 0 1px color-mix(in srgb,var(--yellow) 40%,transparent)}
.pidx__card::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;border-radius:2px;opacity:.55;transform:scaleX(.3);transform-origin:left;transition:transform .45s var(--ease-spring),opacity .2s}
.pidx__card.tone-up::after{background:var(--up)}.pidx__card.tone-down::after{background:var(--down)}
.pidx__card:hover::after,.pidx__card.is-on::after{transform:scaleX(1);opacity:.9}
.pidx__name{grid-column:1/-1;color:var(--muted);font-size:12px}
.pidx__px{font-size:22px;line-height:1.1}
.pidx__card>.pnum:last-of-type{justify-self:end;font-size:12px}
.pidx__card canvas{grid-column:1/-1;width:100%;height:28px}
.pidx__breadth{display:grid;align-content:center;gap:6px;padding:10px 14px;border:1px solid var(--glass-edge);border-radius:var(--r-md);background:var(--glass);-webkit-backdrop-filter:var(--glass-filter);backdrop-filter:var(--glass-filter)}
.pidx__breadth>span{color:var(--muted);font-size:12px}
.pidx__bar{height:6px;border-radius:3px;background:var(--down);overflow:hidden}
.pidx__bar b{display:block;height:100%;background:var(--up);transition:width .5s var(--ease-spring)}
.pidx__counts{display:flex;justify-content:space-between;font-size:12.5px}
.pidx__lim{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.pidx__lim b{font:600 12px var(--mono)}

/* 选股列表 + 个股（.pboard__main / .ppick / .pdetail） */
.pboard__main{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;align-items:stretch}
.ppick{position:relative;display:flex;flex-direction:column;min-height:0;max-height:980px;padding:10px}
.ppick__tabs{display:flex;flex-wrap:wrap;gap:4px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.ppick__tabs button{display:inline-flex;align-items:center;gap:4px;min-height:26px;padding:0 9px;border:1px solid transparent;border-radius:8px;color:var(--muted);font-size:12px}
.ppick__tabs button:hover{color:var(--ink);background:var(--rest-wash)}
.ppick__tabs button.is-on{border-color:color-mix(in srgb,var(--yellow) 45%,transparent);background:color-mix(in srgb,var(--yellow) 12%,transparent);color:var(--yellow)}
.ppick__tabs button.is-sector{border-color:color-mix(in srgb,var(--cyan) 45%,transparent);color:var(--cyan)}
.ppick__list{position:relative;flex:1;min-height:0;overflow-y:auto;margin-top:6px;padding-right:8px}
.ppick__glide{position:absolute;left:0;right:8px;top:0;z-index:0;border-radius:9px;pointer-events:none;opacity:0;background:linear-gradient(90deg,color-mix(in srgb,var(--yellow) 16%,transparent),color-mix(in srgb,var(--yellow) 4%,transparent));box-shadow:inset 2px 0 var(--yellow),0 0 18px -6px color-mix(in srgb,var(--yellow) 60%,transparent);transition:transform .34s var(--ease-spring),height .34s var(--ease-spring),opacity .2s}
.ppick__row{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:46px;padding:5px 8px;border-radius:9px;color:var(--ink);text-align:left;transition:background .16s,transform .2s var(--ease-spring);animation:paper-row .42s var(--ease-spring) both}
.ppick__row:hover{background:var(--rest-wash);transform:translateX(2px)}
.ppick__row.is-on b{color:var(--yellow)}
.ppick__id{display:grid;gap:1px;min-width:0}
.ppick__id b{overflow:hidden;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.ppick__id code{color:var(--muted);font:10.5px var(--mono)}
.ppick__id em{font-style:normal;color:var(--magenta)}
.ppick__num{display:grid;justify-items:end;gap:2px;flex:none;font:600 15px var(--mono);line-height:1.15}
.ppick__num small{color:var(--muted);font:500 11.5px var(--mono)}
.ppick__note{margin:6px 4px 0;color:var(--muted);font-size:11px}
.pdesk__main{padding:16px 18px}
.pdetail__head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:0 0 12px;border-bottom:1px solid var(--glass-edge)}
.pdetail__title{display:flex;align-items:baseline;gap:10px;margin:0;font:600 21px var(--display)}
.pdetail__title code{color:var(--cyan);font:13px var(--mono)}
.pdetail__title small{color:var(--muted);font:12px var(--body)}
.pdetail__quote{display:flex;align-items:baseline;flex-wrap:wrap;gap:12px;margin-top:6px}
.pdetail__px{padding:0 4px;border-radius:6px;font-size:36px;line-height:1}
.pdetail__tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pquality{padding:2px 8px;border:1px solid var(--glass-edge);border-radius:8px;color:var(--muted);font:11px var(--mono)}
.pquality.is-fresh{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 45%,transparent)}
.pquality.is-replay{color:var(--yellow);border-color:color-mix(in srgb,var(--yellow) 40%,transparent)}
.ptags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.ptags em{padding:1px 6px;border:1px solid var(--glass-edge);border-radius:5px;color:var(--ink-soft);font:normal 10.5px var(--body)}
.ptags em.is-pop{border-color:color-mix(in srgb,var(--magenta) 50%,transparent);color:var(--magenta)}
.pdetail__body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:14px 0 0}
.pdetail__chart{display:flex;flex-direction:column;min-width:0}
.ptoolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.ptoolbar .cinfo{margin-left:auto;color:var(--ink-soft);font:12px var(--mono);text-align:right;white-space:nowrap}
.pdetail__canvas{position:relative;height:clamp(380px,50vh,540px);border:1px solid var(--glass-edge);border-radius:var(--r-md);background:var(--p-fill);overflow:hidden}
#chart{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none;overscroll-behavior:contain}
.pdetail__side{display:grid;align-content:start;gap:12px;min-width:0}
.pside{position:relative;padding:12px 14px;border:1px solid var(--glass-edge);border-radius:var(--r-md);background:var(--p-fill)}
.pside h4{display:flex;align-items:baseline;gap:8px;margin:0 0 10px;font:600 13.5px var(--display);letter-spacing:.04em}
.pside h4::before{content:"";width:6px;height:6px;border:1px solid var(--cyan);transform:rotate(45deg) translateY(-1px)}
.pside h4 small{color:var(--muted);font:11px var(--body)}
.pkv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:10px 0 0}
.pkv div{display:flex;justify-content:space-between;gap:8px;min-width:0}
.pkv dt{color:var(--muted);font-size:11.5px;white-space:nowrap}
.pkv dd{margin:0;font-size:12.5px;text-align:right}
.pbook{display:grid;gap:4px}
.pbook div{display:grid;grid-template-columns:36px 1fr auto;align-items:center;padding:5px 8px;border-radius:7px}
.pbook div:first-child{background:color-mix(in srgb,var(--down) 10%,transparent)}
.pbook div:last-child{background:color-mix(in srgb,var(--up) 10%,transparent)}
.pbook span{color:var(--muted);font-size:11.5px}.pbook b{font-weight:600}.pbook small{color:var(--ink-soft);font-size:11.5px}
/* 雷达（个股卡右栏） */
.pradar{position:relative;aspect-ratio:1/1;width:100%;max-width:272px;margin:0 auto}
#radar{display:block;width:100%;height:100%}
.rtip{position:absolute;z-index:3;pointer-events:none;padding:6px 9px;border:1px solid var(--glass-edge);border-radius:9px;background:var(--menu-fill);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:12px;white-space:nowrap;opacity:0;transition:opacity .15s}
.rfilters{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.rfilters button{display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:0 7px;border:1px solid var(--glass-edge);border-radius:6px;color:var(--ink-soft);font-size:11px}
.rfilters button i{width:6px;height:6px;transform:rotate(45deg)}

.rfilters button.off{opacity:.35}
/* 图下两块玻璃（照 .pco：财报速览 / 产业链 → 它今天的异动 / 为什么） */
.pco{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:14px}
.pco__half{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0;padding:12px 14px 13px;overflow:hidden;border:1px solid var(--glass-edge);border-top-color:rgba(233,245,255,.24);border-radius:14px;background:linear-gradient(170deg,rgba(233,245,255,.06),rgba(233,245,255,.015) 55%),var(--p-fill);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.pco__half::after{content:'';position:absolute;inset:0 0 auto;height:1px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(85,234,212,.55),transparent);opacity:.6}
.pco__head{display:flex;align-items:center;gap:8px;min-width:0}
.pco__head h4{display:flex;align-items:center;gap:7px;margin:0;font-size:13px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.pco__head h4::before{content:'';width:6px;height:6px;border:1px solid var(--cyan);transform:rotate(45deg)}
.pco__head small{overflow:hidden;color:var(--muted);font:11px var(--mono);text-overflow:ellipsis;white-space:nowrap}
.pco__ai{margin-left:auto;flex:none;padding:1px 7px;border:1px solid rgba(252,238,10,.3);border-radius:8px;color:var(--yellow);font:10.5px var(--mono)}
.pco__what{margin:0;color:var(--ink-soft);font-size:12.5px;line-height:1.7;max-height:150px;overflow:auto}
.pco__what b{color:var(--ink)}
.ptimeline{display:grid;gap:2px;margin:0;padding:0;list-style:none;max-height:160px;overflow:auto}
.ptimeline li{display:grid;grid-template-columns:40px 56px minmax(0,1fr);gap:8px;align-items:center;padding:4px 6px;border-radius:7px;font-size:12px;color:var(--ink-soft);cursor:pointer;animation:paper-row .35s var(--ease-spring) both}
.ptimeline li:hover{background:var(--rest-wash)}
.ptimeline time{color:var(--muted);font:11px var(--mono)}
.ptimeline em{font-style:normal;font-size:11px}
.ptimeline span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 板块 + 热股（.pboard__lower / .psector / .photlist） */
.pboard__lower{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.psectors__grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.psector{position:relative;display:flex;flex-direction:column;min-width:0;border:1px solid var(--glass-edge);border-radius:var(--r-sm);overflow:hidden;color:var(--ink);text-align:left;transition:transform .26s var(--ease-spring),border-color .2s,box-shadow .26s var(--ease-spring);animation:paper-tile .5s var(--ease-spring) both}
.psector.tone-up{background:color-mix(in srgb,var(--up) var(--heat,10%),transparent)}
.psector.tone-down{background:color-mix(in srgb,var(--down) var(--heat,10%),transparent)}
.psector.tone-flat{background:var(--rest-wash)}
.psector::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%) -100% 0/220% 100% no-repeat}
.psector:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.psector.tone-up:hover{border-color:color-mix(in srgb,var(--up) 60%,transparent)}
.psector.tone-down:hover{border-color:color-mix(in srgb,var(--down) 60%,transparent)}
.psector:hover::before{animation:paper-sheen .7s ease-out}
.psector>*{position:relative;z-index:1}
.psector__main{display:grid;gap:3px;width:100%;padding:9px 10px 8px;color:var(--ink);text-align:left}
.psector b{overflow:hidden;font-size:13px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.psector b em{color:var(--muted);font:normal 11px var(--mono)}
.psector__pct{font-size:19px}
.psector small{overflow:hidden;color:var(--ink-soft);font-size:11px;text-overflow:ellipsis;white-space:nowrap}
.psector__ud{display:flex;gap:1px;height:3px;border-radius:2px;overflow:hidden}
.psector__ud i:first-child{background:var(--up)}.psector__ud i:last-child{background:var(--down)}
.psector__lead{padding:5px 10px;border-top:1px solid var(--glass-edge);background:var(--p-fill);color:var(--ink-soft);font-size:11px;text-align:left}
.psector__lead:hover{color:var(--cyan)}
@keyframes paper-sheen{to{background-position:120% 0}}
.photlist{position:relative}
.photlist__list{margin:0;padding:0 8px 0 0;list-style:none;max-height:600px;overflow-y:auto}
.photlist__list li{border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);transition:background .16s;animation:paper-row .42s var(--ease-spring) both}
.photlist__list li:hover{background:var(--rest-wash)}
.photlist__list li.is-on{background:color-mix(in srgb,var(--yellow) 7%,transparent)}
.photlist__row{display:grid;grid-template-columns:26px minmax(90px,1fr) 64px minmax(0,1.4fr) auto;align-items:center;gap:8px;min-height:42px;padding:0 4px}
.photlist__rank{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--rest-wash);color:var(--muted);font:600 11px var(--mono)}
.photlist__rank.is-top{background:color-mix(in srgb,var(--magenta) 22%,transparent);color:var(--magenta);box-shadow:0 0 12px -2px color-mix(in srgb,var(--magenta) 70%,transparent)}
.photlist__name{display:grid;gap:1px;min-width:0;padding:2px 0;color:var(--ink);text-align:left}
.photlist__name b{overflow:hidden;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.photlist__name code{color:var(--muted);font:10.5px var(--mono)}
.photlist__name:hover b{color:var(--cyan)}
.photlist__tags{display:flex;gap:4px;min-width:0;overflow:hidden}
.photlist__tags em{flex:none;padding:1px 6px;border:1px solid var(--glass-edge);border-radius:5px;color:var(--ink-soft);font:normal 10.5px var(--body);white-space:nowrap}
.photlist__tags em.is-pop{border-color:color-mix(in srgb,var(--up) 45%,transparent);color:var(--up)}
.photlist__why{display:inline-flex;align-items:center;gap:2px;min-height:24px;padding:0 6px;border:1px solid var(--glass-edge);border-radius:6px;color:var(--cyan);font-size:11px}
.photlist__why svg{width:12px;height:12px;transition:transform .25s var(--ease-spring)}
.photlist__why.is-open svg{transform:rotate(180deg)}
.photlist__fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease-spring)}
.photlist__fold.is-open{grid-template-rows:1fr}
.photlist__fold>div{overflow:hidden}
.photlist__reason{margin:0 4px 10px 34px;padding:8px 10px;border-left:2px solid var(--cyan);border-radius:0 8px 8px 0;background:var(--p-fill);color:var(--ink-soft);font-size:12px;line-height:1.65}
.prank{display:inline-flex;align-items:center;gap:1px;margin-left:6px;font:10px var(--mono)}

/* 异动页：异动流 + 涨停梯队 */
.pboard__events{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.pfeed{display:grid;gap:2px;max-height:720px;overflow:auto;padding-right:6px}
.pev{display:grid;grid-template-columns:46px 66px minmax(0,1fr) 64px;gap:10px;align-items:center;min-height:38px;padding:0 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);border-radius:8px;color:var(--ink-soft);text-align:left;animation:paper-row .36s var(--ease-spring) both}
.pev:hover{background:var(--rest-wash)}
.pev.is-on{background:color-mix(in srgb,var(--yellow) 8%,transparent);box-shadow:inset 2px 0 var(--yellow)}
.pev time{color:var(--muted);font:11.5px var(--mono)}
.pev em{display:inline-flex;align-items:center;gap:5px;font-style:normal;font-size:11.5px}
.pev em i{width:6px;height:6px;transform:rotate(45deg)}
.pev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pev span b{color:var(--ink);font-weight:600;margin-right:6px}
.pev .pnum{text-align:right}
.pladder{display:grid;gap:10px}
.plrow{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;align-items:start}
.plrow__lv{padding-top:3px;color:var(--yellow);font:600 13px var(--display);letter-spacing:.04em}
.plrow__lv small{display:block;color:var(--muted);font:11px var(--mono)}
.pchips{display:flex;flex-wrap:wrap;gap:5px}
.pchip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 9px;border:1px solid color-mix(in srgb,var(--up) 35%,transparent);border-radius:8px;background:color-mix(in srgb,var(--up) 8%,transparent);color:var(--ink);font-size:12px;animation:paper-tile .4s var(--ease-spring) both}
.pchip:hover{border-color:var(--up)}
.pchip small{color:var(--muted);font:10.5px var(--mono)}
.pchip.zb{border-color:color-mix(in srgb,var(--orange) 40%,transparent);background:color-mix(in srgb,var(--orange) 8%,transparent)}
.pchip.dt{border-color:color-mix(in srgb,var(--down) 40%,transparent);background:color-mix(in srgb,var(--down) 8%,transparent)}
.pchip.is-on{box-shadow:0 0 0 1px var(--yellow)}

/* 速评与笔记页 */
.pboard__notes{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
.pbrief{min-height:180px;color:var(--ink);font-size:13.5px;line-height:1.8}
.pbrief p{margin:0 0 6px}
.pbrief .hl{margin:0 0 10px;color:var(--yellow);font:600 19px var(--headline);letter-spacing:.03em;line-height:1.4}
.pbrief ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.pbrief li{position:relative;padding-left:15px;color:var(--ink-soft)}
.pbrief li::before{content:'';position:absolute;left:1px;top:.7em;width:5px;height:5px;background:var(--cyan);transform:rotate(45deg)}
.pbrief b{color:var(--ink)}
.pbrief table{border-collapse:collapse;margin:6px 0;font-size:12px}
.pbrief td,.pbrief th{border:1px solid var(--glass-edge);padding:3px 8px}
.pask{display:flex;gap:8px;margin-top:14px}
.pask input,.pnote input{flex:1;min-width:0;height:38px;padding:0 12px;border:1px solid var(--glass-edge);border-radius:var(--r-sm);background:var(--p-fill);color:var(--ink);outline:0}
.pask input:focus,.pnote input:focus{border-color:var(--glass-lit)}
.pqs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pqs button{min-height:26px;padding:0 10px;border:1px solid var(--glass-edge);border-radius:8px;color:var(--muted);font-size:12px}
.pqs button:hover{color:var(--yellow);border-color:color-mix(in srgb,var(--yellow) 45%,transparent)}
.psrc{margin:10px 0 0;color:var(--muted);font-size:11.5px}.psrc b{color:var(--cyan);font-weight:600}
.pnote{display:flex;gap:8px}
.plist{display:grid;gap:6px;max-height:300px;overflow:auto;margin-top:10px}
.pitem{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--glass-edge);border-radius:10px;background:var(--p-fill);font-size:12.5px;animation:paper-row .35s var(--ease-spring) both}
.pitem time{color:var(--muted);font:11px var(--mono)}
.pitem button.x{color:var(--muted);font-size:11px}.pitem button.x:hover{color:var(--danger)}
.pitem .hit{color:var(--yellow)}
.pexp{display:none;width:100%;margin-top:10px;padding:8px 10px;border:1px solid var(--glass-edge);border-radius:10px;background:var(--p-fill);color:var(--ink-soft);font:12px var(--mono)}

/* 回放时间轴（底部玻璃坞） */
.dock{position:fixed;left:calc(50% + 29px);bottom:14px;transform:translateX(-50%);z-index:50;width:min(1240px,calc(100vw - 100px));display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 16px;border:1px solid var(--glass-edge);border-top-color:rgba(233,245,255,.26);border-radius:var(--r-lg);
  background:linear-gradient(180deg,rgba(233,245,255,.06),rgba(233,245,255,.015)),var(--menu-fill);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--shadow-plate),inset 0 1px 0 rgba(255,255,255,.12)}
.dock .play{display:grid;place-items:center;width:36px;height:36px;border-radius:var(--r-sm);background:var(--yellow);color:#0c0c0c}
.dock .play:hover{background:var(--yellow-hot)}
.dock .play svg{width:15px;height:15px}
.dock .tlabel{min-width:56px;color:var(--yellow);font:600 22px Rajdhani,var(--mono)}
.tl{position:relative;height:40px;cursor:pointer;touch-action:none}
#tlcv{position:absolute;inset:0;width:100%;height:100%}
.tl .knob{position:absolute;top:0;bottom:12px;width:2px;margin-left:-1px;background:var(--yellow);box-shadow:0 0 12px var(--yellow);pointer-events:none}
.tl .knob::before{content:"";position:absolute;top:-4px;left:-3px;width:8px;height:8px;background:var(--yellow);transform:rotate(45deg)}
.dock select{height:28px;padding:0 6px;border:1px solid var(--glass-edge);border-radius:8px;background:var(--p-fill);color:var(--ink-soft)}
.dock .mode{max-width:230px;color:var(--muted);font-size:11px;line-height:1.4}
.foot{margin:24px 0 0;color:var(--faint);font-size:11px;text-align:center}
.toast{position:fixed;left:calc(50% + 29px);top:74px;z-index:90;transform:translate(-50%,-16px);padding:9px 16px;border:1px solid color-mix(in srgb,var(--yellow) 50%,transparent);border-radius:var(--r-sm);background:var(--menu-fill);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);box-shadow:var(--shadow-lift);font-size:13px;opacity:0;pointer-events:none;transition:.35s var(--ease-spring)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 进场：分块从模糊里上浮，错峰（.pfx-in / .pfx-row / .pfx-tile） */
.pfx-in{animation:paper-rise .56s var(--ease-spring) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes paper-rise{from{opacity:0;filter:blur(8px);transform:translateY(14px)}}
@keyframes paper-row{from{opacity:0;transform:translateX(-8px)}}
@keyframes paper-tile{from{opacity:0;transform:translateY(8px) scale(.97)}}
.quiet .ppick__row,.quiet .psector,.quiet .photlist__list li,.quiet .pev,.quiet .pchip,.quiet .ptimeline li{animation:none}

@media (max-width:1180px){.pdetail__body{grid-template-columns:minmax(0,1fr)}.pco{grid-template-columns:minmax(0,1fr)}}
@media (max-width:980px){.pboard__main{grid-template-columns:minmax(0,1fr)}.ppick{max-height:340px}.pidx{grid-template-columns:repeat(2,minmax(0,1fr))}.view-heading{flex-direction:column;align-items:stretch}.psearch{width:100%}.topbar-context{display:none}}
@media (max-width:640px){.shell{grid-template-columns:minmax(0,1fr)}.rail{display:none}.view-page{padding:14px 12px 120px}.dock{left:50%;width:calc(100vw - 20px);grid-template-columns:auto auto minmax(0,1fr)}.dock .mode,.dock select{display:none}.toast{left:50%}.pstrip{grid-template-columns:1fr}.pstrip>div:nth-child(n+2){display:none}.pdetail__head{flex-direction:column}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function breadth(rows){const v=rows.filter(r=>valid(r.price_change_ratio_pct));const up=v.filter(r=>r.price_change_ratio_pct>0).length,down=v.filter(r=>r.price_change_ratio_pct<0).length,flat=v.length-up-down;return {up,down,flat,total:v.length,missing:rows.length-v.length,html:`<div class="breadth"><div class="breadth-up" style="flex:${up||.001}">${up>0?up:''}</div><div class="breadth-flat" style="flex:${flat||.001}">${flat>100?flat:''}</div><div class="breadth-down" style="flex:${down||.001}">${down>0?down:''}</div></div><div class="legend"><span style="--c:#d03e4c">上涨 ${up}</span><span style="--c:#a0afc0">平盘 ${flat}</span><span style="--c:#168270">下跌 ${down}</span><span>缺失 ${rows.length-v.length}</span></div>`};}
function constituentRows(code){const s=(D.sectors||[]).find(s=>s.thscode===code),m=stockMap();return(s?.members||[]).map(x=>({...x,...(m.get(x.thscode)||{})}));}
function noteWidget(key){const notes=store.get('notes:'+key,[]);return panel('我的观察',`<div class="note-box"><textarea id="noteText" placeholder="记下观察、待验证条件或复盘结论…">${E(store.get('draft:'+key,''))}</textarea><div class="controls" style="margin-top:10px">${button('save-note','保存笔记',key)}${button('export-notes','导出笔记',key)}</div><div class="note-list">${notes.length?notes.map((x,i)=>`<div class="note"><small>${date(x.time,true)}</small><button data-action="delete-note" data-value="${key}:${i}">删除</button><p>${E(x.text)}</p></div>`).join(''):'<small>笔记保存在当前浏览器，不上传。</small>'}</div></div>`,'本机保存');}
function futureRows(){return(D.futures||[]).filter(r=>S.futuresPlate==='全部'||r.plate===S.futuresPlate);}
function gameAttrs(r){return{attack:Math.round(20+Math.min(10,Math.abs(r.price_change_ratio_pct||0))*5),guard:Math.round(60-Math.min(20,r.amplitude||0)*2),energy:Math.round(30+Math.min(70,Math.log10(Math.max(1,r.turnover||1))*7))};}
function sourcePanel(){const rows=(D.sources||[]).filter(x=>board.groups.includes(x.group));const failed=rows.filter(x=>['error','stale'].includes(x.status));return `<details class="source-summary"><summary>数据来源与口径 · ${rows.length} 项请求记录${failed.length?' · '+failed.length+' 项待更新':''}</summary><p>仅使用 hithink-finance。页面生成时间 ${date(boot.generatedAt,true)}；数据包生成时间 ${date(D.updatedAt,true)}。表中“响应时点”是上游响应中的 timestamp，不承诺等于每个字段的发生时间；日线、年报和资讯分别显示自身日期。静态版不会自动联网。</p><div class="table-wrap"><table><thead><tr><th>能力</th><th>接口</th><th>响应时点</th><th>本地取数</th><th>状态</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${E(r.id)}</td><td>${E(r.endpoint)}</td><td>${date(r.upstreamTime,true)}</td><td>${date(r.fetchedAt,true)}</td><td>${E(r.status)}${r.error?' / '+E(r.error):''}</td></tr>`).join('')}</tbody></table></div><p style="margin-top:12px">${E(board.decision)}</p><p>信息展示与研究用途，不构成投资建议。互动实验的游戏属性与收益为虚拟设定。</p></details>`;}
function destroyCharts(){for(const x of charts){try{x.observer.disconnect();window.GalleryKlineChart.dispose(x.el);}catch{}}charts=[];}
function render(){if(!board)return;const scroll=window.scrollY;destroyCharts();V.resetPlots?.();const meta=window.NativeBoards.meta[board.id];document.documentElement.dataset.theme=['watch','futures'].includes(board.id)?'light':'dark';document.body.className='native n-'+board.id+' '+(['watch','futures'].includes(board.id)?'native-light':'native-dark');['bg','panel','text','muted','accent'].forEach((key,i)=>document.body.style.setProperty('--nf-'+key,meta[i+1]));document.getElementById('app').innerHTML=window.NativeBoards.render({D,S,board,boot,E,n,pct,money,date,valid,cls,stock,name,history,kline,button,table,baseCols,retcol,noteWidget,breadth,F,V,constituentRows,sourcePanel,store,refreshing});V.mountPlots?.();mountCharts();if(board.id==='pattern')mountDrawing();if(scroll)window.scrollTo(0,scroll);}
function mountCharts(scope=document){scope.querySelectorAll('[data-kline]').forEach(el=>{const code=el.dataset.kline,kind=el.dataset.kind,a=history(code,kind).slice(-180);if(!a.length){el.innerHTML=empty('日线尚未保存',boot.mode==='static'?'本次离线快照没有该标的历史。':'点击更新，或在详情中加载日线。');return;}if(!window.GalleryKlineChart){el.innerHTML=V.line([{name:name(code),points:a.map(x=>[x.time,x.close])}],{height:230,unit:'图表库未加载；收盘线预览'});return;}try{const c=window.GalleryKlineChart.init(el,{timezone:'Asia/Shanghai',dateFormat:'YYYY-MM-DD',locale:'zh-CN',disableAnalytics:true,styles:{candle:{type:'candle_solid',tooltip:{showRule:'follow_cross'},bar:{upColor:'#d03e4c',downColor:'#168270',noChangeColor:'#8293a5',upBorderColor:'#d03e4c',downBorderColor:'#168270',upWickColor:'#d03e4c',downWickColor:'#168270'}},grid:{horizontal:{color:document.body.classList.contains('native-light')?'#edf1f5':'#263141'},vertical:{color:document.body.classList.contains('native-light')?'#edf1f5':'#263141'}},xAxis:{tickText:{color:document.body.classList.contains('native-light')?'#7b8695':'#8c98a8'}},yAxis:{tickText:{color:document.body.classList.contains('native-light')?'#7b8695':'#8c98a8'}}}});c.applyNewData(a.map(r=>({...r,timestamp:r.time})));try{c.createIndicator({name:'MA',calcParams:[20,60]},true,{paneId:'candle_pane'});if(!el.classList.contains('small'))c.createIndicator('VOL');}catch{}const observer=new ResizeObserver(()=>c.resize());observer.observe(el);charts.push({el,c,observer});}catch{el.innerHTML=V.line([{name:name(code),points:a.map(x=>[x.time,x.close])}],{height:230,unit:'K线组件暂不可用；收盘线预览'});}});}
let toastTimer;function toast(t){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.append(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),4000);}
function download(file,content,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function closeDrawer(){document.querySelector('.drawer-back')?.remove();document.querySelector('.drawer')?.remove();}
function showDrawer(title,html){closeDrawer();const back=document.createElement('div');back.className='drawer-back';back.dataset.action='close';const d=document.createElement('section');d.className='drawer';d.setAttribute('role','dialog');d.setAttribute('aria-label',title);d.innerHTML=`<div class="top"><h2>${E(title)}</h2><button class="close" data-action="close" aria-label="关闭详情">×</button></div>${html}`;document.body.append(back,d);d.querySelector('button').focus();return d;}
async function openStock(code){const r=stock(code),kind=(D.etfs||[]).some(x=>x.thscode===code)?'etf':(D.futures||[]).some(x=>x.thscode===code)?'futures':'stock';S.selected=code;let h=history(code,kind);if(!h.length&&boot.mode==='dynamic'&&kind==='stock'){showDrawer(r.name,empty('正在读取日线',code));try{const res=await fetch('/api/history?code='+encodeURIComponent(code));const json=await res.json();if(!res.ok)throw new Error(json.error||'历史接口失败');D.history??={};D.history[code]=json.bars;h=json.bars;}catch(e){toast('日线加载失败：'+e.message);}}
 const m=F.metrics(h),noteText=kind==='futures'?'期货价格单位按该合约规则；涨跌幅相对前收。':kind==='etf'?'ETF场内价格，日线按接口原口径。':'A股快照为当前价格，日线使用前复权。';const el=showDrawer(r.name||code,`<p class="description">${E(code)} · ${E(noteText)}</p><div style="margin-top:20px">${strip([['最新价格',n(r.last_price),kind==='futures'?r.quoteKind||'':'报价单位：元'],['当日涨跌',pct(r.price_change_ratio_pct),'快照读数',cls(r.price_change_ratio_pct)],['20日涨幅',pct(m.ret20),'日线收盘计算',cls(m.ret20)],['60日涨幅',pct(m.ret60),'日线收盘计算',cls(m.ret60)]])}${kline(code,kind)}<p class="panel-foot">日线末日 ${date(h.at(-1)?.time)}；有效记录 ${h.length}。当前快照与日线有各自时点。</p><div class="controls" style="margin-top:20px">${kind==='stock'?button('watch-add','加入本地自选',code):''}</div>${(D.limits?.up||[]).find(x=>x.thscode===code)?`<p class="notice">涨停原因：${E(D.limits.up.find(x=>x.thscode===code).limit_up_reason)}</p>`:''}</div>`);V.mountPlots?.();mountCharts(el);
}
function selectedRows(){const map={market:D.stocks,sectors:D.sectors,semiconductor:constituentRows(boot.config.semiconductorIndex),pulse:D.events,abnormal:D.abnormal?.[S.abnormalTab],topics:(D.news||[]).flatMap(x=>x.items||[]),etf:D.etfs,pattern:S.patternMatches,watch:S.watch.map(stock),structure:F.confirmedTurns(history(S.structure||(D.watchCodes||[])[0])),futures:futureRows(),resonance:futureRows(),agri:D.basis,gold:constituentRows(boot.config.goldIndex),arena:(D.watchCodes||[]).map(stock)};return map[board.id]||[];}
function exportCSV(){const rows=selectedRows();if(!rows.length)return toast('当前没有可导出的记录');const keys=[...new Set(rows.flatMap(Object.keys))].filter(k=>rows.some(r=>r[k]===null||typeof r[k]!=='object'));const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[keys.map(q).join(','),...rows.map(r=>keys.map(k=>q(typeof r[k]==='object'?JSON.stringify(r[k]):r[k])).join(','))].join('\r\n');download(board.id+'.csv',csv,'text/csv;charset=utf-8');}
function schedule(){clearTimeout(refreshTimer);if(boot.mode!=='dynamic'||store.get('paused',false)||document.hidden)return;const now=new Date(),hour=Number(new Intl.DateTimeFormat('en',{timeZone:'Asia/Shanghai',hour:'2-digit',hour12:false}).format(now));const active=board.category==='商品与周期'||(hour>=9&&hour<16);const seconds=active?board.interval:Math.max(board.interval,300);refreshTimer=setTimeout(()=>refresh(false),seconds*1000*(.9+Math.random()*.2));}
async function refresh(manual=true){if(boot.mode==='static'){showDrawer('更新离线看板',`<p>静态页面保存的是一次真实取数快照。解压完整交付包，在包目录执行：</p><pre style="padding:18px;background:#eef3f8;white-space:pre-wrap">npm run refresh -- ${E(board.id)}</pre><p>命令会更新数据，并重新生成全部已保存看板的离线 HTML。也可以导入刷新后生成的 <code>data/latest.json</code>，当前页会立即重绘。</p><div class="controls" style="margin-top:18px">${button('import','导入数据包')}</div>`);return;}if(refreshing)return;refreshing=true;const el=document.querySelector('[data-action=refresh]');if(el){el.disabled=true;el.textContent='更新中…';}try{const res=await fetch('/api/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({board:board.id})});const next=await res.json();if(!res.ok)throw new Error(next.error||'更新失败');D=next;window.BOARD_DATA=D;if(store.get('watch',null)===null&&!S.watch.length)S.watch=D.watchCodes||[];render();if(manual)toast('数据检查完成，请核对各模块时点和来源状态');}catch(e){toast('更新失败，保留当前快照：'+e.message);}finally{refreshing=false;const el=document.querySelector('[data-action=refresh]');if(el){el.disabled=false;el.textContent='更新数据';}schedule();}}
function mountDrawing(){const canvas=document.getElementById('drawPad');if(!canvas)return;const ctx=canvas.getContext('2d');const draw=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);if(!S.pencil.length)return;ctx.strokeStyle='#77adff';ctx.lineWidth=4;ctx.lineJoin='round';ctx.beginPath();S.pencil.forEach((p,i)=>{const x=p[0]*canvas.width,y=(1-p[1])*canvas.height;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();};draw();let active=false;const point=e=>{const r=canvas.getBoundingClientRect();return[Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height))];};canvas.onpointerdown=e=>{active=true;S.pencil=[point(e)];canvas.setPointerCapture(e.pointerId);draw();};canvas.onpointermove=e=>{if(!active)return;const p=point(e);if(p[0]>S.pencil.at(-1)[0])S.pencil.push(p);draw();};canvas.onpointerup=()=>active=false;canvas.onpointercancel=()=>active=false;}
function findPattern(){if(S.pencil.length<3)return toast('请从左到右画线，或选择一条预设曲线');const ordered=S.pencil.slice().sort((a,b)=>a[0]-b[0]);const left=ordered[0][0],right=ordered.at(-1)[0];if(right-left<.1)return toast('画线横向范围太短');const target=Array.from({length:40},(_,i)=>{const x=left+(right-left)*i/39;let k=ordered.findIndex(p=>p[0]>=x);if(k<=0)return ordered[0][1];const [p,q]=[ordered[k-1],ordered[k]];return p[1]+(q[1]-p[1])*(x-p[0])/(q[0]-p[0]||1);});S.patternMatches=(D.patternCodes||[]).map(code=>{const a=history(code).slice(-S.patternWindow);return{code,corr:a.length>=S.patternWindow?F.pearson(target,F.sample(a.map(x=>x.close),40)):null};}).filter(x=>x.corr!==null).sort((a,b)=>b.corr-a.corr).slice(0,10);render();if(!S.patternMatches.length)toast('常数曲线或历史窗口不足，无法计算相关度');}
document.addEventListener('click',async event=>{const el=event.target.closest('[data-action],[data-code],[data-sector],[data-sort]');if(!el)return;if(el.tagName==='A')event.preventDefault();if(el.dataset.action){const action=el.dataset.action,value=el.dataset.value;switch(action){
 case'refresh':return refresh();case'pause':store.set('paused',!store.get('paused',false));render();schedule();return;
 case'close':return closeDrawer();case'csv':return exportCSV();case'import':document.getElementById('importData')?.click();return;
 case'export-html':location.href='/api/export?board='+board.id;return;
 case'native-select':S.nativeCode=value;break;case'native-area':S.nativeArea=value;break;case'native-tier':S.nativeTier=value;break;case'native-view':S.nativeView=value;break;case'native-topic':S.nativeTopic=value;break;case'native-plate':S.futuresPlate=S.futuresPlate===value?'全部':value;break;case'native-sources':S.nativeSources=!S.nativeSources;render();if(S.nativeSources){const el=document.querySelector('.nf-source-footer');el.querySelector('details').open=true;el.scrollIntoView({behavior:'smooth',block:'start'});}return;case'window':S.window=value;break;case'limit-tab':S.limitTab=value;break;case'abnormal-tab':S.abnormalTab=value;break;case'resonance':S.resonance=value;break;
 case'save-note':{const t=document.getElementById('noteText')?.value.trim();if(!t)return toast('先写下观察内容');const a=store.get('notes:'+value,[]);a.unshift({time:Date.now(),text:t});store.set('notes:'+value,a);store.set('draft:'+value,'');toast('笔记已保存到本机');break;}
 case'delete-note':{const [key,i]=value.split(':');const a=store.get('notes:'+key,[]);a.splice(Number(i),1);store.set('notes:'+key,a);break;}
 case'export-notes': {
  const notes = JSON.stringify(store.get('notes:'+value,[]),null,2);
  if (window.parent === window) download(value+'-notes.json',notes,'application/json');
  else showDrawer('复制笔记', `<textarea rows="12" style="width:100%" aria-label="笔记 JSON" readonly>${E(notes)}</textarea>`);
  return;
 }
 case'watch-remove':S.watch=S.watch.filter(c=>c!==value);store.set('watch',S.watch);break;
 case'watch-add':if(!S.watch.includes(value))S.watch.push(value);store.set('watch',S.watch);toast('已加入本地自选');return;
 case'watch-reset':S.watch=[...(D.watchCodes||[])];store.set('watch',S.watch);break;
 case'watch-up':{const i=S.watch.indexOf(value);if(i>0)[S.watch[i-1],S.watch[i]]=[S.watch[i],S.watch[i-1]];store.set('watch',S.watch);break;}
 case'watch-load':return openStock(value);
 case'watch-search':{const q=document.getElementById('watchSearch').value.trim();const rows=(D.symbols||D.stocks||[]).filter(x=>(x.name+x.thscode).toLowerCase().includes(q.toLowerCase())).slice(0,12);document.getElementById('watchResults').innerHTML=q?rows.map(x=>`<button data-action="watch-add-render" data-value="${x.thscode}">${E(x.name)} ${E(x.thscode)}　添加</button>`).join('')||'<p>未找到匹配的A股。</p>':'';return;}
 case'watch-add-render':if(!S.watch.includes(value))S.watch.push(value);store.set('watch',S.watch);break;
 case'pattern-clear':S.pencil=[];S.patternMatches=[];break;
 case'pattern-preset':S.pencil=value==='rise'?[[0,.1],[.25,.3],[.4,.22],[.7,.6],[1,.9]]:value==='v'?[[0,.9],[.5,.1],[1,.8]]:[[0,.25],[.3,.28],[.6,.23],[.75,.3],[1,.85]];break;
 case'pattern-search':return findPattern();
 case'arena-pick':if(S.arena.includes(value))S.arena=S.arena.filter(x=>x!==value);else if(S.arena.length<3)S.arena.push(value);else return toast('每队最多三张卡');break;
 case'arena-fight':{if(S.arena.length!==3)return;const cards=S.arena.map(stock).map(r=>({...r,...gameAttrs(r)}));const enemy=45+(S.round%5)*7,shield=18+(S.round%3)*6;const damage=cards.reduce((s,c)=>s+Math.max(0,c.attack-shield),0),loss=cards.reduce((s,c)=>s+Math.max(0,enemy-c.guard),0),remain=cards.reduce((s,c)=>s+c.energy,0)-loss;S.battle=`队伍造成 ${damage} 点虚拟伤害\n抵挡后受到 ${loss} 点伤害\n剩余虚拟能量 ${remain}\n${damage>=90&&remain>0?'本轮通过':'本轮未通过，可以重新组队'}。这不是金融风险测评。`;S.round++;break;}
 default:return;
 }render();return;}
 if(el.dataset.sort){const {sort:id,key}=el.dataset;const old=S.sort[id];S.sort[id]={key,dir:old?.key===key?-old.dir:-1};render();return;}
 if(el.dataset.sector){S.sector=el.dataset.sector;if(board.id==='sectors')render();else{const a=constituentRows(S.sector),sec=D.sectors?.find(x=>x.thscode===S.sector);showDrawer(sec?.name||S.sector,breadth(a).html+table(a,baseCols,'drawer-members'));}return;}
 if(el.dataset.code)openStock(el.dataset.code);
});
document.addEventListener('change',async e=>{const el=e.target,k=el.dataset.control;if(el.id==='importData'){const file=el.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(d.version!==1||!Array.isArray(d.sources)||!Number.isFinite(d.updatedAt))throw new Error('数据包格式不正确');D=d;window.BOARD_DATA=d;closeDrawer();render();toast('数据包已导入；此操作仅影响当前打开页面');}catch(e){toast(e.message);}return;}

let inputTimer;document.addEventListener('input',e=>{const el=e.target;if(el.id==='noteText'){store.set('draft:'+board.id,el.value);return;}if(['sector-search','limit-search','event-search'].includes(el.dataset.control)){clearTimeout(inputTimer);const pos=el.selectionStart;inputTimer=setTimeout(()=>{S.search=el.value;render();const next=document.querySelector(`[data-control="${el.dataset.control}"]`);next?.focus();next?.setSelectionRange(pos,pos);},220);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if((e.key==='Enter'||e.key===' ')&&e.target.dataset.sort){e.preventDefault();e.target.click();}if(e.key==='Enter'&&e.target.id==='watchSearch')document.querySelector('[data-action=watch-search]')?.click();});

async function init(){if(!board)return;if(boot.mode==='dynamic'){try{const res=await fetch('/api/state?board='+board.id);if(!res.ok)throw new Error('无法读取本地数据包');D=await res.json();window.BOARD_DATA=D;if(store.get('watch',null)===null&&!S.watch.length)S.watch=D.watchCodes||[];}catch(e){document.getElementById('app').innerHTML=empty('无法打开动态看板',e.message+'；请在完整交付包运行 npm start。');return;}}render();schedule();const deepCode=new URLSearchParams(location.search).get('code');if(board.id==='watch'&&/^[0-9]{6}\.(SH|SZ|BJ)$/.test(deepCode||''))openStock(deepCode);}
init();
